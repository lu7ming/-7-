<script>
/* 防刷新白边：在 CSS 加载前提前设置主题色 */
try{
  var s=JSON.parse(localStorage.getItem("life_settings_v1")||"{}");
  var theme=s.theme||"light";
  var pal=s.palette||"default";
  var dark=theme==="dark";
  var bgMap={
    "default":dark?"#1A1825":"#E8C8A8",
    "forest":dark?"#0F1810":"#B8D9A8",
    "ocean":dark?"#0F1E30":"#A8C8E8",
    "sunset":dark?"#1A0E08":"#E8B898",
    "lavender":dark?"#0E0A18":"#C8B0E0"
  };
  var bg=bgMap[pal]||(dark?"#1A1825":"#E8C8A8");
  document.documentElement.style.background=bg;
  document.documentElement.setAttribute("data-theme",theme);
  if(pal!=="default")document.documentElement.setAttribute("data-palette",pal);
  var m=document.getElementById("meta-theme-color");
  if(m)m.setAttribute("content",bg);
}catch(e){}
</script>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--body-gradient);color:var(--ink);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;}
html{min-height:100vh;min-height:100dvh;min-height:-webkit-fill-available;background-color:#C8A890;background-image:var(--body-gradient);background-repeat:no-repeat;background-attachment:fixed;background-size:cover;}
body{min-height:100vh;min-height:100dvh;min-height:-webkit-fill-available;background-color:#C8A890;background-image:var(--body-gradient);background-repeat:no-repeat;background-attachment:fixed;background-size:cover;}
/* ================== 自定义背景图层 ================== */
.bg-layer{position:fixed;top:-3%;left:-3%;width:106%;height:106%;z-index:-2;background-size:cover;background-position:center;background-repeat:no-repeat;transform:scale(1.08);transition:background-image .25s ease,filter .25s ease;display:none;will-change:filter;}
.bg-overlay{position:fixed;inset:0;z-index:-1;pointer-events:none;transition:background .25s ease;display:none;}
body.bg-photo .bg-layer{display:block;}
body.bg-photo .bg-overlay{display:block;}
body.bg-photo{background:#15131a!important;background-image:none!important;}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}

/* ================== Layout ================== */
.app{
  display:flex;
  height:100vh;
  height:100dvh;
  min-height:100vh;
  min-height:100dvh;
  overflow:hidden;
  background-color:#C8A890;
  background-image:var(--body-gradient);
  background-repeat:no-repeat;background-attachment:fixed;background-size:cover;
  box-sizing:border-box;
}
/* PWA 全屏模式底部安全区填充 */
body::after{
  content:"";
  position:fixed;
  left:0;right:0;bottom:0;
  height:env(safe-area-inset-bottom);
  background:var(--body-gradient) no-repeat;
  background-size:cover;
  z-index:-1;
  pointer-events:none;
}
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;background:transparent;min-height:100dvh;}

/* ---- Sidebar ---- */
.sidebar{
  width:200px;flex-shrink:0;
  background:var(--body-gradient) no-repeat fixed;background-size:cover;
  backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  border-right:1px solid var(--glass-border);
  display:flex;flex-direction:column;
  padding:14px 0 10px;overflow-y:auto;scrollbar-width:none;
  box-shadow:var(--glass-inset);
  min-height:100dvh;
}
.sidebar::-webkit-scrollbar{display:none;}
.sb-top{padding:8px 14px 14px;border-bottom:1px solid var(--line-2);}
.sb-brand{display:flex;align-items:center;gap:8px;}
.sb-avatar{
  width:36px;height:36px;border-radius:50%;
  background-size:cover;background-position:center;
  display:block;flex-shrink:0;
  box-shadow:0 0 0 2px var(--card),0 0 12px rgba(200,167,128,.25),0 1px 4px rgba(0,0,0,.1);
  transition:box-shadow .3s ease;
}
.sb-name{font-weight:700;font-size:15px;color:var(--ink);}
.sb-poem{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.5px;}
.sb-date{margin-top:14px;color:var(--ink);font-size:13.5px;font-weight:500;}
.sb-checkin{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  background:var(--accent);color:var(--accent-ink);
  padding:8px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-sm);
}
.sb-streak{margin-top:12px;font-size:12px;color:var(--muted);font-weight:500;}
.sb-streak b{color:var(--ink);font-size:14px;margin:0 2px;}

.sb-nav{margin-top:14px;display:flex;flex-direction:column;}
.sb-nav .nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 16px;font-size:13.5px;color:var(--ink-2);
  cursor:pointer;border-radius:8px;margin:0 6px;
  position:relative;transition:all .2s ease;
}
.sb-nav .nav-item .ni{font-size:16px;width:18px;text-align:center;transition:transform .2s ease;}
.sb-nav .nav-item:hover{background:var(--card-soft);padding-left:20px;}
.sb-nav .nav-item:hover .ni{transform:scale(1.15);}
.sb-nav .nav-item.active{background:var(--card-soft);font-weight:600;padding-left:20px;}
.sb-nav .nav-item.active::before{
  content:"";position:absolute;left:6px;top:10px;bottom:10px;
  width:3px;background:var(--ink);border-radius:3px;
  transition:height .2s ease;
}
.sb-spacer{flex:1;}
.sb-foot{padding:8px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line-2);}

/* ---- Mobile menu trigger (hidden on desktop) ---- */
.mob-bar{display:none;align-items:center;gap:10px;
  padding:8px 12px;background:var(--glass-bg);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  border-bottom:1px solid var(--glass-border);
  flex-shrink:0;box-shadow:var(--glass-inset);
}
.mob-bar .mob-btn{width:36px;height:36px;border-radius:10px;
  background:var(--card-soft);font-size:18px;color:var(--ink);}
.mob-bar .mob-title{flex:1;font-weight:700;font-size:15px;}
.mob-bar .mob-act{width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--ink-2);}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;}

/* ---- Main content ---- */
.main-top{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;
  background:var(--glass-bg-soft);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  flex-shrink:0;border-bottom:1px solid var(--glass-border);
  box-shadow:var(--glass-inset);
}
.main-top .top-search{display:flex;align-items:center;gap:8px;}
.top-icon{
  width:34px;height:34px;border-radius:50%;
  background:var(--glass-bg-soft);border:1px solid var(--glass-border);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2);
  box-shadow:var(--glass-inset);transition:all .2s ease;
  cursor:pointer;
}
.top-icon:hover{transform:translateY(-1px);box-shadow:var(--glass-shadow),var(--glass-inset);}
.top-icon:active{transform:scale(.93);}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 22px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom));overscroll-behavior-y:contain;min-height:0;-webkit-transform:translateZ(0);transform:translateZ(0);}
.scroll::-webkit-scrollbar{width:6px;}
.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}

/* ---- 视觉质感增强（C级氛围 · 不动格局）---- */
#scroll{animation:pageIn .42s cubic-bezier(.22,.61,.36,1);}
@keyframes pageIn{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
.card{transition:box-shadow .3s ease,transform .3s ease;}
.card:hover{box-shadow:0 14px 44px rgba(60,45,30,.16),var(--glass-inset);transform:translateY(-1px);}
.section-title{letter-spacing:-.6px;}
.section-eyebrow{letter-spacing:1.8px;}
.btn,.btn-ghost{transition:transform .15s ease,box-shadow .2s ease,background .2s ease;}
.btn:active,.btn-ghost:active{transform:scale(.97);}
.kpi-value{letter-spacing:-.5px;}
/* 关联区块的统一"次级卡"语感 */
.card[style*="card-soft"]{border:1px dashed var(--line);}

/* ---- AI 对话面板 ---- */
.ai-panel{position:fixed;top:0;right:0;width:420px;max-width:100vw;height:100vh;height:100dvh;
  background:var(--glass-bg);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);
  border-left:1px solid var(--glass-border);box-shadow:-10px 0 40px rgba(0,0,0,.2),var(--glass-inset);
  z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.22,.61,.36,1);}
.ai-panel.open{transform:translateX(0);}
.ai-panel .ai-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);
  flex-shrink:0;padding-top:max(16px,env(safe-area-inset-top));}
.ai-panel .ai-head .ai-title{flex:1;font-weight:700;font-size:16px;}
.ai-panel .ai-head .ai-close{width:32px;height:32px;border-radius:8px;background:var(--card-soft);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;color:var(--ink-2);}
.ai-panel .ai-context{font-size:11px;color:var(--muted);padding:6px 18px;background:var(--card-soft);flex-shrink:0;}
.ai-panel .ai-msgs{flex:1;overflow-y:auto;padding:14px 18px;scrollbar-width:thin;}
.ai-panel .ai-msg{margin-bottom:12px;max-width:92%;}
.ai-panel .ai-msg.user{margin-left:auto;text-align:right;}
.ai-panel .ai-msg .bubble{display:inline-block;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.ai-panel .ai-msg.user .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px;}
.ai-panel .ai-msg.bot .bubble{background:var(--card-soft);color:var(--ink);border-bottom-left-radius:4px;}
.ai-panel .ai-msg.bot.thinking .bubble{color:var(--muted);font-style:italic;}
.ai-panel .ai-quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 8px;flex-shrink:0;}
.ai-panel .ai-quick button{font-size:12px;padding:5px 12px;border-radius:999px;background:var(--card-soft);
  border:1px solid var(--line);color:var(--ink-2);cursor:pointer;white-space:nowrap;}
.ai-panel .ai-quick button:active{transform:scale(.96);}
.ai-panel .ai-input{display:flex;gap:8px;align-items:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-shrink:0;
  padding-bottom:max(12px,env(safe-area-inset-bottom));}
.ai-panel .ai-input textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;font-size:14px;background:var(--card);color:var(--ink);outline:none;
  font-family:inherit;line-height:1.5;max-height:100px;}
.ai-panel .ai-input textarea:focus{border-color:var(--warm);}
.ai-panel .ai-input button{width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-ink);
  font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:none;}
.ai-panel .ai-input button:active{transform:scale(.95);}
.ai-panel .ai-input button:disabled{opacity:.5;}
.ai-panel .ai-input button#aiMicBtn{background:var(--card-soft);color:var(--ink);}
.ai-panel .ai-input button#aiMicBtn.listening{background:#FF6B6B;color:#fff;animation:pulseMic 1.2s infinite;}
@keyframes pulseMic{0%{box-shadow:0 0 0 0 rgba(255,107,107,.4);}70%{box-shadow:0 0 0 10px rgba(255,107,107,0);}100%{box-shadow:0 0 0 0 rgba(255,107,107,0);}}
/* AI 面板打开时隐藏右下角灵感 FAB,避免与发送按钮重叠 */
.ai-panel.open ~ .qc-fab{display:none;}
@media(max-width:540px){.ai-panel{width:100vw;}}

/* ---- Common card ---- */
.card{
  background:var(--glass-bg);border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  border-radius:var(--radius-lg);padding:18px;
  margin-bottom:14px;box-shadow:var(--glass-shadow),var(--glass-inset);
}
.card.dark{background:var(--ink);color:var(--accent-ink);border-color:var(--ink);}
.card.dark .muted{color:rgba(255,255,255,.55);}
.card.dark .label{color:rgba(255,255,255,.55);}

.section-eyebrow{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.section-title{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 6px;letter-spacing:-.5px;}
.section-desc{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 16px;}
/* ---- Quick capture bar (全局快速录入) ---- */
.quick-capture{
  display:flex;gap:8px;align-items:center;
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:8px 10px;
  box-shadow:var(--shadow-md);margin-bottom:14px;
  position:sticky;top:0;z-index:30;
  transition:box-shadow .3s ease,border-color .3s ease;
}
.quick-capture:focus-within{border-color:var(--warm);box-shadow:0 0 0 3px rgba(200,167,128,.15),var(--shadow-md);}
.quick-capture .qc-icon{font-size:18px;color:var(--muted);padding:0 4px;}
.quick-capture input{
  flex:1;background:transparent;border:none;outline:none;
  font-size:15px;color:var(--ink);padding:8px 4px;
}
.quick-capture input::placeholder{color:var(--faint);}
.quick-capture .qc-btn{
  background:var(--ink);color:var(--accent-ink);
  border-radius:10px;padding:8px 16px;font-weight:600;font-size:14px;
  white-space:nowrap;
}
.quick-capture .qc-hint{
  font-size:11px;color:var(--muted);padding:0 8px;
  white-space:nowrap;display:none;
}
@media(min-width:780px){.quick-capture .qc-hint{display:block;}}

/* ---- Focus three (今日三件事) ---- */
.focus-card{
  background:linear-gradient(135deg,#FFF6E8 0%,#FCEDD7 100%);
  border:1px solid #F0DCB5;border-radius:var(--radius-lg);
  padding:18px;margin-bottom:14px;
}
body[data-theme="dark"] .focus-card{background:linear-gradient(135deg,#3A3020,#2E2618);border-color:#4A3D24;}
.focus-card .fc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.focus-card .fc-title{font-size:16px;font-weight:700;color:#6B4F2A;}
body[data-theme="dark"] .focus-card .fc-title{color:#D8B68A;}
.focus-card .fc-sub{font-size:12px;color:var(--muted);}
.focus-item{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.6);border-radius:12px;
  padding:10px 12px;margin-bottom:8px;
}
body[data-theme="dark"] .focus-item{background:rgba(255,255,255,.05);}
.focus-item .fi-num{
  width:24px;height:24px;border-radius:50%;
  background:#6B4F2A;color:#fff;display:grid;place-items:center;
  font-size:13px;font-weight:700;flex-shrink:0;
}
body[data-theme="dark"] .focus-item .fi-num{background:#D8B68A;color:#2A2520;}
.focus-item .fi-text{flex:1;font-size:14px;color:var(--ink);}
.focus-item .fi-text.done{color:var(--muted);text-decoration:line-through;}
.focus-item .fi-del{color:var(--muted);font-size:16px;padding:4px;}
.focus-item input.fi-edit{
  flex:1;background:transparent;border:none;outline:none;
  font:inherit;color:var(--ink);padding:0;
}
.focus-add{display:flex;gap:8px;margin-top:8px;}
.focus-add input{
  flex:1;background:rgba(255,255,255,.5);border:1px dashed #D8C49A;
  border-radius:10px;padding:8px 12px;outline:none;color:var(--ink);
}
body[data-theme="dark"] .focus-add input{background:rgba(255,255,255,.05);border-color:#5A4D34;}

/* ---- Templates (模板区) ---- */
.tpl-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.tpl-pill{
  background:var(--card-soft);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px;font-size:13px;
  color:var(--ink-2);font-weight:500;
}
.tpl-pill:active{background:var(--ink);color:var(--accent-ink);}

/* ---- Quick capture parse result toast ---- */
.qc-result{
  position:fixed;bottom:60px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--accent-ink);
  padding:10px 16px;border-radius:10px;z-index:130;
  font-size:13px;max-width:90%;
}
.qc-result .qc-mod{color:var(--warm);font-weight:600;}

/* ---- iPad panoramic layout ---- */
@media(min-width:780px){
.pano-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
   .pano-grid > .card{margin-bottom:0;}
   .pano-full{grid-column:1/-1;}
}
.cal-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start;margin-bottom:14px}
.cal-row > *{min-width:0}
.cal-row .cal{margin-bottom:0;display:flex;flex-direction:column;width:100%}
.cal-row .cal .cal-grid{flex:1}
@media(max-width:700px){.cal-row{grid-template-columns:1fr}}
.month-card{display:flex;flex-direction:column;gap:10px}
.month-card .mc-stat-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.month-card .mc-stat{padding:10px 12px;background:var(--glass-bg-soft);border:1px solid var(--glass-border);border-radius:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:var(--glass-inset)}
.month-card .mc-stat .mc-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.month-card .mc-stat .mc-val{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.month-card .mc-stat .mc-val small{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.month-card .mc-mini{display:grid;grid-template-columns:repeat(31,1fr);gap:2px;margin-top:4px}
.month-card .mc-mini div{aspect-ratio:1;border-radius:2px;background:transparent;transition:transform .1s}
.month-card .mc-mini div:hover{transform:scale(1.4)}
.month-card .mc-mini div.check{background:var(--good);opacity:.9}
.month-card .mc-mini div.today{outline:1.5px solid var(--accent-ink);outline-offset:-1px}
.month-card .mc-quote{font-size:12px;color:var(--ink-2);font-style:italic;padding:8px 10px;border-left:2px solid var(--accent);background:var(--card-soft);border-radius:4px;line-height:1.5}

/* ---- Top date greeting card ---- */
.greet{
  background:linear-gradient(135deg,rgba(31,27,23,0.92) 0%,rgba(58,48,38,0.88) 100%);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.3);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.3);
  color:#FFFFFF;border-radius:var(--radius-lg);
  border:1px solid rgba(255,255,255,0.12);
  padding:22px 22px 18px;margin-bottom:14px;
  position:relative;overflow:hidden;
  box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.1);
}
.greet::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;
  background:radial-gradient(circle,rgba(200,167,128,.18),transparent 60%);
  animation:greetGlow 4s ease-in-out infinite alternate;}
@keyframes greetGlow{0%{opacity:.6;transform:scale(1)}100%{opacity:1;transform:scale(1.15)}}
.greet-eyebrow{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.55);font-weight:600;}
.greet-h{font-size:28px;font-weight:700;margin:6px 0 10px;letter-spacing:-.5px;}
.greet-meta{font-size:12.5px;color:rgba(255,255,255,.7);line-height:1.6;}
.greet-deer{position:absolute;right:10px;bottom:2px;width:70px;height:70px;cursor:pointer;user-select:none;touch-action:manipulation;transition:transform .2s;}
.greet-deer:active{transform:scale(.9);}
.greet-deer svg{width:100%;height:100%;transition:transform .15s,opacity .15s;}
.greet-deer.jump{animation:deerJump .5s ease;}
.greet-deer.flower::after{content:"🌸";position:absolute;top:-8px;right:-4px;font-size:14px;animation:deerFlower 1s ease forwards;}
.greet-deer.crown::after{content:"👑";position:absolute;top:-14px;right:12px;font-size:16px;}
.greet-deer.glow{filter:drop-shadow(0 0 8px rgba(255,215,0,.7));}
/* 聊天气泡 */
.deer-bubble{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:11px;line-height:1.4;padding:5px 10px;border-radius:12px;white-space:nowrap;max-width:140px;box-shadow:0 2px 10px rgba(0,0,0,.12);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5;}
.deer-bubble::after{content:"";position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid #fff;}
.deer-bubble.show{opacity:1;}
/* 顶栏提示 */
.top-hint{font-size:11px;color:var(--muted);align-self:center;cursor:pointer;padding:2px 6px;border-radius:6px;background:var(--card-soft);transition:opacity .5s;}
@keyframes wagTail{0%,100%{transform:rotate(0)}25%{transform:rotate(15deg)}75%{transform:rotate(-15deg)}}
@keyframes deerJump{0%{transform:translateY(0)}40%{transform:translateY(-18px)}70%{transform:translateY(-6px)}100%{transform:translateY(0)}}
@keyframes deerFlower{0%{opacity:0;transform:translateY(0) scale(.5)}50%{opacity:1;transform:translateY(-12px) scale(1.2)}100%{opacity:0;transform:translateY(-20px) scale(.8)}}

/* ---- KPIs ---- */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.kpi{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:14px 16px;box-shadow:var(--shadow-sm);
}
.kpi-head{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:500;}
.kpi-tag{margin-left:auto;font-size:10.5px;color:var(--muted);
  letter-spacing:1.5px;background:var(--card-soft);
  padding:3px 8px;border-radius:6px;font-weight:600;}
.kpi-value{font-size:30px;font-weight:700;color:var(--ink);margin:10px 0 2px;letter-spacing:-1px;}
.kpi-value .unit{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px;}
.kpi-bar{margin-top:8px;height:4px;background:var(--card-soft);border-radius:999px;overflow:hidden;}
.kpi-bar > i{display:block;height:100%;background:var(--ink);border-radius:999px;}

/* ---- Countdown ---- */
.countdowns{display:flex;flex-direction:column;gap:10px;}
.cd-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 12px;background:var(--card-soft);
  border-radius:var(--radius);border:1px solid var(--line-2);
}
.cd-row .cd-name{font-size:14px;color:var(--ink);font-weight:500;}
.cd-row .cd-date{font-size:11.5px;color:var(--muted);margin-top:2px;}
.cd-row .cd-days{
  font-size:18px;font-weight:700;color:var(--accent);
  background:var(--accent);color:var(--accent-ink);
  padding:6px 12px;border-radius:10px;min-width:60px;text-align:center;
}
.cd-row.past .cd-days{background:var(--card-2);color:var(--muted);}
.cd-del{font-size:14px;color:var(--muted);padding:4px 8px;border-radius:8px;}
.cd-del:active{background:rgba(199,89,63,.1);color:var(--warn);}
.cd-add{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.cd-add input{flex:1;min-width:120px;background:var(--card-soft);
  border:1px solid var(--line);color:var(--ink);
  border-radius:10px;padding:8px 12px;outline:none;}
.cd-add input[type=date]{min-width:140px;}
.cd-add button{background:var(--accent);color:var(--accent-ink);
  padding:8px 14px;border-radius:10px;font-weight:600;}

/* ---- Daily checks ---- */
.check-cat{margin-top:14px;}
.check-cat:first-child{margin-top:0;}
.check-cat-h{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px;margin-bottom:8px;}
.check-row{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;background:var(--card-soft);
  border:1px solid var(--line-2);border-radius:12px;margin-bottom:6px;
}
.check-cb{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;
  border:2px solid var(--faint);background:var(--card);
  display:grid;place-items:center;color:transparent;font-size:12px;
  cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.check-cb:active{transform:scale(.9);}
.check-cb.on{background:var(--ink);border-color:var(--ink);color:var(--accent-ink);animation:checkPop .35s cubic-bezier(.34,1.56,.64,1);}
@keyframes checkPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.check-text{flex:1;font-size:14px;color:var(--ink);}
.check-text.done{color:var(--muted);text-decoration:line-through;}
.check-meta{font-size:11.5px;color:var(--muted);}
.check-del{color:var(--muted);font-size:14px;padding:2px 6px;border-radius:6px;}
.check-del:active{color:var(--warn);}

.progress-card{margin-bottom:14px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:14px 16px;box-shadow:var(--shadow-sm);}
.progress-card .pc-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.progress-card .pc-h b{font-size:14px;font-weight:600;}
.progress-card .pc-h .pc-n{font-size:13px;color:var(--muted);}
.progress-card .pc-bar{height:6px;background:var(--card-soft);border-radius:999px;overflow:hidden;position:relative;}
.progress-card .pc-bar > i{display:block;height:100%;background:var(--ink);border-radius:999px;transition:width .4s cubic-bezier(.22,.61,.36,1);position:relative;}
.progress-card .pc-bar > i::after{content:"";position:absolute;right:0;top:0;width:20px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35));border-radius:999px;}

/* ---- Form ---- */
.big-text{
  width:100%;background:var(--card-soft);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;
  padding:11px 13px;outline:none;line-height:1.6;min-height:80px;resize:vertical;
}
.big-text:focus{border-color:var(--ink);background:var(--card);box-shadow:0 0 0 3px rgba(31,27,23,.08);}
.tl-input{
  width:100%;background:var(--card-soft);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;outline:none;transition:border-color .2s ease,box-shadow .2s ease;
}
.tl-input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(31,27,23,.06);}
.btn{
  background:var(--accent);color:var(--accent-ink);
  padding:10px 16px;border-radius:10px;font-weight:600;
}
.btn-ghost{
  background:var(--card-soft);color:var(--ink);
  padding:10px 16px;border-radius:10px;font-weight:600;border:1px solid var(--line);
}
.btn-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.input-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center;}

/* ---- Tag chip ---- */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  background:var(--card-soft);border:1px solid var(--line);
  border-radius:999px;padding:2px 9px;font-size:12px;color:var(--ink-2);
}
.chip .x{cursor:pointer;opacity:.6;font-size:13px;line-height:1;}

/* ---- Lists ---- */
.list{display:flex;flex-direction:column;gap:8px;}
.list-item{
  background:var(--card-soft);border:1px solid var(--line-2);
  border-radius:12px;padding:12px 14px;
}
.list-item .li-name{font-size:14px;color:var(--ink);font-weight:500;}
.list-item .li-meta{font-size:11.5px;color:var(--muted);margin-top:3px;}
.list-item .li-row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}
.list-item .li-row input{flex:1;min-width:80px;background:var(--card);
  border:1px solid var(--line);border-radius:8px;padding:6px 10px;outline:none;}
.list-item .li-row select{background:var(--card);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;outline:none;}

/* ---- Book ---- */
.book-card{
  display:flex;gap:14px;background:var(--card-soft);
  border:1px solid var(--line-2);border-radius:14px;padding:14px;
  margin-bottom:10px;
}
.book-cover{
  width:60px;height:88px;flex-shrink:0;
  background:linear-gradient(135deg,#C8A780,#A98A5E);
  border-radius:6px;display:grid;place-items:center;
  color:#fff;font-size:11px;text-align:center;line-height:1.2;
  box-shadow:var(--shadow-sm);
}
.book-info{flex:1;min-width:0;}
.book-info .b-title{font-size:14.5px;font-weight:600;color:var(--ink);}
.book-info .b-author{font-size:12px;color:var(--muted);margin-top:2px;}
.book-info .b-status{margin-top:5px;font-size:11px;color:var(--ink-2);
  background:var(--warm-soft);color:var(--warm);
  padding:2px 8px;border-radius:6px;display:inline-block;font-weight:600;}
.book-info .b-status.read{background:var(--card-2);color:var(--muted);}
.book-info .b-bar{height:4px;background:var(--card);border-radius:999px;overflow:hidden;margin-top:8px;}
.book-info .b-bar > i{display:block;height:100%;background:var(--ink);border-radius:999px;}
.book-info .b-pct{font-size:11.5px;color:var(--muted);margin-top:4px;}

/* ---- Quick tools (bottom) ---- */
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.tool-pill{
  background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;
  font-size:13px;color:var(--ink);font-weight:500;
  text-align:left;
}
.tool-pill:active{background:var(--card-soft);}

/* ---- Modal ---- */
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.55);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;
  padding:24px 12px;overflow-y-auto;}
body[data-theme="dark"] .overlay{background:rgba(0,0,0,.7);}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  width:100%;max-width:520px;box-shadow:var(--shadow-md);
  display:flex;flex-direction:column;overflow:hidden;}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);}
.panel-head h3{margin:0;flex:1;font-size:15px;font-weight:700;}
.panel-body{padding:14px 16px;max-height:75vh;overflow-y:auto;}

.search-input{flex:1;background:var(--card-soft);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;outline:none;font-size:14px;}
.sr{border:1px solid var(--line-2);border-radius:12px;padding:10px 13px;margin-bottom:8px;cursor:pointer;}
.sr .sr-meta{font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.sr .sr-mod{color:var(--ink);font-weight:600;}
.sr .sr-snip{font-size:13.5px;color:var(--ink-2);}
.sr mark{background:var(--warm-soft);color:var(--warm);border-radius:3px;padding:0 2px;}

.empty{color:var(--muted);text-align:center;padding:30px;font-size:13.5px;}
.data-row{display:flex;gap:8px;margin-bottom:10px;align-items:center;flex-wrap:wrap;}
.data-row .btn,.data-row .btn-ghost{flex:1;min-width:110px;text-align:center;}
.data-row input[type=date],.data-row input[type=month]{
  flex:1;min-width:130px;background:var(--card-soft);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;
  color-scheme:light;
}
body[data-theme="dark"] .data-row input[type=date],
body[data-theme="dark"] .data-row input[type=month]{color-scheme:dark;}
.data-note{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:10px;}
.warn-text{color:var(--warn);font-size:12.5px;margin-top:6px;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--accent-ink);
  padding:10px 18px;border-radius:12px;box-shadow:var(--shadow-md);
  z-index:120;font-size:14px;}
.hidden{display:none!important;}

/* ===== 应用内弹窗（iPad 主屏安全，替代原生 confirm/prompt） ===== */
#appModalRoot{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;}
#appModalRoot.am-show{display:flex;}
.am-backdrop{position:absolute;inset:0;background:rgba(40,30,20,.5);backdrop-filter:blur(2px);}
body[data-theme="dark"] .am-backdrop{background:rgba(0,0,0,.66);}
.am-card{position:relative;margin:auto;width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);padding:22px;animation:amPop .18s ease;}
@keyframes amPop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.am-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.am-msg{font-size:14px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;}
.am-input{width:100%;margin-top:12px;background:var(--card-soft);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;color:var(--ink);outline:none;box-sizing:border-box;}
.am-input:focus{border-color:var(--warm);}
.am-btns{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;}
.am-btns .btn,.am-btns .btn-ghost{flex:1;min-width:96px;text-align:center;padding:11px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--line);box-sizing:border-box;}
.am-btns .btn-ghost{background:var(--card-soft);color:var(--ink-2);}
.am-btns .btn{background:var(--ink);color:var(--accent-ink);border-color:var(--ink);}
.am-danger .am-msg{color:var(--warn);}
.am-danger-btn{background:var(--warn)!important;border-color:var(--warn)!important;color:#fff!important;}

/* ===== 密码保险柜（九宫格手势解锁） ===== */
.vault-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:240px;height:240px;margin:18px auto;user-select:none;touch-action:none;}
.vault-dot{position:relative;width:56px;height:56px;margin:auto;border-radius:50%;background:var(--card-soft);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .15s;}
.vault-dot::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--line);}
.vault-dot.hit{border-color:var(--warm);background:rgba(220,160,80,.18);}
.vault-dot.hit::after{background:var(--warm);transform:scale(1.15);}
.vault-dot.error{border-color:var(--warn);background:rgba(220,60,60,.15);}
.vault-dot.error::after{background:var(--warn);}
.vault-canvas{position:absolute;inset:0;pointer-events:none;}
.vault-hint{text-align:center;font-size:13px;color:var(--ink-2);min-height:20px;margin-bottom:6px;}
.vault-item{display:flex;align-items:center;gap:10px;background:var(--card-soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
.vault-item .vi-name{font-size:13px;font-weight:600;color:var(--ink);min-width:80px;}
.vault-item .vi-val{flex:1;font-size:12px;color:var(--ink-2);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.vault-item .vi-btn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--ink);cursor:pointer;}
.vault-item .vi-btn.del{color:var(--warn);}
.vault-empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 0;}

/* Date nav */
.date-nav{display:flex;gap:6px;align-items:center;margin-bottom:12px;background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px}
.date-nav .dn-btn{flex:0 0 auto;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:7px 0;font-size:13px;color:var(--ink);font-weight:500;}
.date-nav .dn-btn.today{background:var(--ink);color:var(--accent-ink);border-color:var(--ink);}
.date-nav .dn-label{flex:1;text-align:center;font-size:13px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.date-nav .dn-label .dn-sub{display:block;font-size:11px;color:var(--muted);font-weight:400;margin-top:2px}

/* ===== 日历 ===== */
.cal{background:var(--glass-bg);border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;
  box-shadow:var(--glass-shadow),var(--glass-inset)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h .cal-title{font-size:14px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.cal-h .cal-nav{display:flex;gap:3px}
.cal-h .cal-nav button{background:var(--card);border:1px solid var(--line);border-radius:5px;width:26px;height:26px;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cal-h .cal-nav button:hover{background:var(--line)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-grid .cal-wh{text-align:center;font-size:9px;color:var(--muted);padding:2px 0;font-weight:600}
.cal-grid .cal-day{border:1px solid var(--glass-border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2);cursor:pointer;background:var(--glass-bg-soft);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:all .12s;position:relative;aspect-ratio:1;max-height:48px;box-shadow:var(--glass-inset)}
.cal-grid .cal-day:hover{border-color:var(--accent);transform:translateY(-1px)}
.cal-grid .cal-day.other{color:var(--muted);opacity:.4}
.cal-grid .cal-day.checkin{background:rgba(127,176,105,.15);border-color:rgba(127,176,105,.4)}
.cal-grid .cal-day.checkin::after{content:"";position:absolute;bottom:2px;width:3px;height:3px;border-radius:50%;background:var(--good)}
.cal-grid .cal-day.today{border-color:var(--accent);box-shadow:0 0 0 2px rgba(232,184,99,.3) inset}
.cal-grid .cal-day.selected{background:var(--accent);color:var(--accent-ink);font-weight:700;border-color:var(--accent)}
.cal-grid .cal-day.selected::after{background:var(--accent-ink)}
.cal-grid .cal-empty{aspect-ratio:1;max-height:48px}

/* Contact A/B/C/D */
.cat-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink);
  margin:14px 0 6px;}
.cat-h .pill{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:600;
  background:var(--card-soft);color:var(--ink-2);}
.cat-A .pill{background:#E2E8DE;color:#3F5C2F;}
.cat-B .pill{background:#F4E5CC;color:#7A4E1E;}
.cat-C .pill{background:#EFE0E2;color:#7A2E2E;}
.cat-D .pill{background:#E1E2EC;color:#3E4374;}

/* ---- Heatmap ---- */
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px;}
.heat-cell{
  aspect-ratio:1;border-radius:4px;background:transparent;
  display:grid;place-items:center;font-size:10px;color:var(--muted);
  border:1px solid transparent;
}
.heat-cell.checked{background:var(--ink);color:var(--accent-ink);border-color:var(--ink);}
.heat-cell.today{outline:2px solid var(--warm);outline-offset:1px;}
.heat-legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;color:var(--muted);}
.heat-legend .lg{width:12px;height:12px;border-radius:3px;}

/* ---- Trend chart (SVG) ---- */
.trend-chart{background:var(--card-soft);border-radius:12px;padding:14px;margin-top:10px;}
.trend-chart svg{display:block;width:100%;height:auto;}

/* ---- Review card ---- */
.review-gen{
  background:var(--card-soft);border:1px dashed var(--line);
  border-radius:12px;padding:14px;margin-bottom:12px;
}
.review-gen .rg-h{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px;}
.review-gen .rg-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line-2);}
.review-gen .rg-row:last-child{border-bottom:none;}
.review-gen .rg-row .v{font-weight:600;color:var(--ink);}
.review-gen .rg-kw{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}

/* ---- Cold contact alert ---- */
.alert-card{
  background:#FFF4E8;border:1px solid #F0DCB5;border-radius:12px;
  padding:12px 14px;margin-bottom:12px;
}
body[data-theme="dark"] .alert-card{background:#3A2E20;border-color:#4A3D24;}
.alert-card .a-h{font-size:13px;font-weight:600;color:#A5641E;margin-bottom:6px;}
body[data-theme="dark"] .alert-card .a-h{color:#D8B68A;}
.alert-card .a-item{font-size:12.5px;color:#6B4F2A;padding:3px 0;display:flex;justify-content:space-between;}
body[data-theme="dark"] .alert-card .a-item{color:#C9A776;}

/* ---- Daily digest card ---- */
.digest-card{background:linear-gradient(135deg,#FFF6E8 0%,#FCEFD9 100%);border-color:#F0DCB5;}
body[data-theme="dark"] .digest-card{background:linear-gradient(135deg,#3A3020,#2E2618);border-color:#4A3D24;}
.digest-card .a-item{padding:4px 0;}
.digest-btn{background:var(--accent);color:var(--accent-ink);padding:3px 10px;border-radius:8px;font-size:11px;font-weight:600;white-space:nowrap;}

/* ---- Pomodoro ---- */
.pomo-box{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius);padding:18px;text-align:center;margin-bottom:14px;}
.pomo-display{font-size:48px;font-weight:700;color:var(--ink);letter-spacing:2px;font-variant-numeric:tabular-nums;margin-bottom:12px;}
.pomo-controls{display:flex;gap:8px;justify-content:center;margin-bottom:10px;}
.pomo-presets{display:flex;gap:6px;justify-content:center;margin-bottom:8px;}
.pomo-preset{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink-2);}
.pomo-preset.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.pomo-status{font-size:12px;color:var(--muted);}
.pomo-count{font-size:12px;color:var(--good);margin-top:6px;font-weight:600;}

/* ---- 冥想/呼吸计时器 ---- */
.meditate-box{background:var(--glass-bg);border:1px solid var(--glass-border);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:14px;box-shadow:var(--glass-inset);}
.breath-circle{width:140px;height:140px;border-radius:50%;margin:16px auto;background:radial-gradient(circle,rgba(232,184,99,0.3),rgba(127,176,105,0.15));border:2px solid rgba(232,184,99,0.4);display:flex;align-items:center;justify-content:center;transition:transform 4s ease-in-out,background 4s ease-in-out,border-color 4s ease-in-out;position:relative;}
.breath-circle.inhale{transform:scale(1.35);background:radial-gradient(circle,rgba(127,176,105,0.4),rgba(232,184,99,0.2));border-color:rgba(127,176,105,0.6);}
.breath-circle.hold{transform:scale(1.35);background:radial-gradient(circle,rgba(232,184,99,0.35),rgba(200,167,128,0.15));border-color:rgba(232,184,99,0.6);}
.breath-circle.exhale{transform:scale(0.85);background:radial-gradient(circle,rgba(212,106,106,0.25),rgba(127,176,105,0.1));border-color:rgba(212,106,106,0.4);}
.breath-text{font-size:14px;font-weight:600;color:var(--ink-2);}
.breath-count{font-size:36px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.meditate-presets{display:flex;gap:6px;justify-content:center;margin-bottom:8px;}
.meditate-preset{background:var(--glass-bg-soft);border:1px solid var(--glass-border);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink-2);cursor:pointer;}
.meditate-preset.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.meditate-status{font-size:12px;color:var(--muted);margin-top:4px;}
.meditate-count{font-size:12px;color:var(--good);margin-top:6px;font-weight:600;}

/* ---- 配色面板 ---- */
.palette-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:4px 0;}
.palette-opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius);border:2px solid var(--line);cursor:pointer;background:var(--card-soft);transition:all .2s;}
.palette-opt.active{border-color:var(--warm);background:var(--warm-soft);}
.palette-opt:active{transform:scale(0.97);}
.palette-swatch{width:32px;height:32px;border-radius:8px;flex-shrink:0;}
.palette-opt-name{font-size:13px;font-weight:600;color:var(--ink);}
.palette-opt-desc{font-size:11px;color:var(--muted);}

/* ---- 背景图片分区 ---- */
.sec-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:18px 2px 8px;}
.bg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.bg-opt{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid var(--line);aspect-ratio:4/3;background:var(--card-soft);transition:all .2s;display:flex;align-items:center;justify-content:center;}
.bg-opt.active{border-color:var(--warm);box-shadow:0 0 0 2px var(--warm-soft);}
.bg-opt:active{transform:scale(.97);}
.bg-opt .bg-thumb{width:100%;height:100%;object-fit:cover;display:block;}
.bg-opt .bg-grad{width:100%;height:100%;}
.bg-opt .bg-check{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:var(--warm);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}
.bg-opt .bg-del{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;border:none;}
.bg-opt .bg-label{position:absolute;bottom:0;left:0;right:0;font-size:10px;color:#fff;background:rgba(0,0,0,.5);text-align:center;padding:2px 0;}
.bg-opt.bg-none{align-items:center;justify-content:center;color:var(--muted);font-size:12px;font-weight:600;}
.bg-upload{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px;padding:12px;border:2px dashed var(--line);border-radius:12px;cursor:pointer;color:var(--warm);font-size:13px;font-weight:600;transition:all .2s;}
.bg-upload:active{transform:scale(.98);background:var(--warm-soft);}
.bg-sliders{margin-top:12px;background:var(--card-soft);border-radius:12px;padding:12px 14px;}
.bg-slider-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12px;color:var(--ink);}
.bg-slider-row span{width:34px;flex-shrink:0;color:var(--muted);}
.bg-slider-row input[type=range]{flex:1;accent-color:var(--warm);}
.bg-slider-row b{width:34px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);}
.bg-tip{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px;}

/* ---- 新版本更新横幅 ---- */
.update-banner{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:9999;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;background:var(--card);border:1px solid var(--warm);border-radius:999px;box-shadow:0 8px 28px rgba(0,0,0,.22);max-width:calc(100vw - 28px);transition:transform .35s cubic-bezier(.22,1,.36,1);}
.update-banner.show{transform:translate(-50%,0);}
.ub-text{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;}
.ub-btn{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;}
.ub-btn.ghost{background:var(--card-soft);color:var(--muted);}

/* ---- 灵感速记悬浮入口 ---- */
.qc-fab{position:fixed;right:18px;bottom:20px;z-index:9000;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--warm),#E0A85C);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(200,150,80,.45);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease;border:none;}
.qc-fab:hover{transform:scale(1.08) rotate(8deg);box-shadow:0 8px 26px rgba(200,150,80,.6);}
.qc-fab:active{transform:scale(.95);}
.qc-panel{position:fixed;right:18px;bottom:82px;z-index:9001;width:min(320px,calc(100vw - 36px));background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px;animation:qcPop .2s ease;}
.qc-panel.hidden{display:none;}
@keyframes qcPop{from{opacity:0;transform:translateY(8px) scale(.96);}to{opacity:1;transform:none;}}
.qc-head{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.qc-input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card-soft);color:var(--ink);padding:8px 10px;font-size:13px;resize:none;box-sizing:border-box;}
.qc-input:focus{outline:none;border-color:var(--warm);box-shadow:0 0 0 3px var(--warm-soft);}
.qc-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;}
.qc-cat{padding:6px 14px;border-radius:999px;background:var(--card-soft);border:1px solid var(--line);font-size:13px;color:var(--ink-2);font-weight:600;cursor:pointer;}
.qc-cat:hover{background:var(--warm-soft);}
/* 速记列表 */
.inbox-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
.inbox-item{background:var(--card-soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.inbox-item.catered{opacity:.6;}
.inbox-text{font-size:14px;color:var(--ink);white-space:pre-wrap;word-break:break-word;line-height:1.5;}
.inbox-meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
.inbox-cat{font-size:12px;font-weight:600;color:var(--warm);background:var(--warm-soft);padding:2px 10px;border-radius:999px;cursor:pointer;}
.inbox-time{font-size:11px;color:var(--muted);}
.ib-btn{font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;cursor:pointer;}
.ib-btn:hover{color:var(--ink);}
/* 心情日志 */
.mood-pick-wrap{display:flex;gap:10px;justify-content:center;margin:10px 0 14px;}
.mood-pick{font-size:28px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card-soft);border:2px solid transparent;cursor:pointer;transition:.15s;}
.mood-pick:hover{transform:scale(1.1);}
.mood-pick.active{border-color:var(--warm);background:var(--warm-soft);transform:scale(1.08);}
.mood-avg{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;}
.mood-corr{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px;background:var(--card-soft);border-radius:10px;padding:8px 10px;}

/* ---- 语音录入 ---- */
.top-icon.recording{background:#E0584A!important;color:#fff!important;animation:pulse-red 1s infinite;}
@keyframes pulse-red{0%,100%{opacity:1;}50%{opacity:0.6;}}

/* ---- 今日概览卡片 ---- */
.overview-card{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:14px;align-items:center;padding:18px 22px;}
.overview-ring{width:72px;height:72px;position:relative;flex-shrink:0;}
.overview-ring svg{width:100%;height:100%;transform:rotate(-90deg);}
.overview-ring .ring-bg{fill:none;stroke:var(--line);stroke-width:6;}
.overview-ring .ring-fg{fill:none;stroke:var(--warm);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .5s;}
.overview-ring .ring-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--ink);}
.overview-stat{text-align:center;}
.overview-stat .os-num{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.overview-stat .os-label{font-size:11px;color:var(--muted);margin-top:2px;}
.overview-stat .os-sub{font-size:10px;color:var(--warm);margin-top:1px;}
@media(max-width:600px){.overview-card{grid-template-columns:auto 1fr 1fr;}.overview-stat:nth-child(4){display:none;}}

/* ---- AI 小结 ---- */
.ai-card{padding:16px 18px;}
.ai-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.ai-badge{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--warm-soft);color:var(--warm);font-weight:700;letter-spacing:.5px;}
.ai-summary{font-size:13.5px;line-height:1.7;color:var(--ink-2);}
.ai-summary p{margin:4px 0;}
.ai-suggestion{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;background:var(--glass-bg-soft);border-radius:10px;margin-top:6px;border:1px solid var(--glass-border);}
.ai-suggestion .as-icon{flex-shrink:0;font-size:15px;}
.ai-suggestion .as-text{font-size:12.5px;color:var(--ink-2);line-height:1.5;}

/* ---- 天气 ---- */
.weather-row{display:flex;align-items:center;gap:12px;padding:10px 16px;}
.weather-icon{font-size:28px;}
.weather-temp{font-size:20px;font-weight:700;color:var(--ink);}
.weather-desc{font-size:12px;color:var(--muted);}
.weather-loc{font-size:11px;color:var(--faint);margin-left:auto;}

/* ---- 生命之树 ---- */
.tree-page{display:flex;flex-direction:column;align-items:center;padding:10px 0;min-height:500px;}
.tree-svg{max-width:420px;width:100%;height:auto;display:block;}
.tree-svg .trunk{animation:tree-sway 6s ease-in-out infinite alternate;transform-origin:50% 100%;}
.tree-svg .leaf-cluster{animation:tree-breathe 4s ease-in-out infinite alternate;transform-origin:50% 60%;}
.tree-svg .leaf{animation:leaf-twinkle 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;}
.tree-svg .particle{animation:particle-float 3s ease-in-out infinite;transform-box:fill-box;}
.tree-svg .fruit{animation:fruit-glow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;}
.tree-svg .flower{animation:flower-bloom 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;}
.tree-svg .root{animation:root-glow 5s ease-in-out infinite alternate;transform-box:fill-box;}
@keyframes tree-sway{0%{transform:rotate(-0.8deg);}100%{transform:rotate(0.8deg);}}
@keyframes tree-breathe{0%{transform:scale(1);}100%{transform:scale(1.03);}}
@keyframes leaf-twinkle{0%{opacity:0.8;}100%{opacity:1;}}
@keyframes particle-float{0%{opacity:0;transform:translateY(0);}50%{opacity:0.6;}100%{opacity:0;transform:translateY(-30px);}}
@keyframes fruit-glow{0%{filter:brightness(1);}100%{filter:brightness(1.2);}}
@keyframes flower-bloom{0%{transform:scale(0.95);}100%{transform:scale(1.05);}}
@keyframes root-glow{0%{opacity:0.3;}100%{opacity:0.6;}}

.tree-info{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:420px;margin-top:16px;}
.tree-stat{text-align:center;padding:12px 8px;background:var(--glass-bg-soft);border:1px solid var(--glass-border);border-radius:12px;backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));}
.tree-stat .ts-icon{font-size:20px;}
.tree-stat .ts-num{font-size:20px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.tree-stat .ts-label{font-size:11px;color:var(--muted);margin-top:2px;}

.tree-level-bar{width:100%;max-width:420px;margin-top:14px;}
.tree-level-bar .tlb-head{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-bottom:6px;}
.tree-level-bar .tlb-track{height:10px;background:var(--glass-bg-soft);border:1px solid var(--glass-border);border-radius:999px;overflow:hidden;}
.tree-level-bar .tlb-fill{height:100%;background:linear-gradient(90deg,var(--good),var(--warm));border-radius:999px;transition:width .8s ease;}

.tree-branches{width:100%;max-width:420px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.tree-branch-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--glass-bg-soft);border:1px solid var(--glass-border);border-radius:10px;}
.tree-branch-item .tbi-icon{font-size:16px;flex-shrink:0;}
.tree-branch-item .tbi-info{flex:1;min-width:0;}
.tree-branch-item .tbi-name{font-size:12px;font-weight:600;color:var(--ink);}
.tree-branch-item .tbi-val{font-size:11px;color:var(--muted);}
.tree-branch-item .tbi-bar{height:4px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden;}
.tree-branch-item .tbi-bar-fill{height:100%;border-radius:2px;transition:width .5s;}

/* 首页小树预览卡 */
.tree-preview{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;}
.tree-preview-svg{width:56px;height:56px;flex-shrink:0;}
.tree-preview-info{flex:1;min-width:0;}
.tree-preview-info .tpi-title{font-size:14px;font-weight:700;color:var(--ink);}
.tree-preview-info .tpi-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.tree-preview-info .tpi-bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;}
.tree-preview-info .tpi-bar-fill{height:100%;background:linear-gradient(90deg,var(--good),var(--warm));border-radius:3px;transition:width .5s;}
.tree-preview-arrow{font-size:18px;color:var(--muted);flex-shrink:0;}

/* ---- 白噪音 ---- */
.sound-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.sound-card{padding:14px 10px;border-radius:14px;background:var(--card-soft);text-align:center;cursor:pointer;transition:all 0.2s;border:2px solid transparent;}
.sound-card:hover{transform:translateY(-2px);}
.sound-card.playing{border-color:var(--warm);background:var(--card);box-shadow:0 4px 16px rgba(200,167,128,0.2);}
.sc-icon{font-size:28px;margin-bottom:6px;}
.sc-name{font-weight:700;font-size:14px;}
.sc-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.3;}
.sc-status{font-size:11px;margin-top:6px;color:var(--warm);font-weight:600;}
.alarm-item{display:flex;align-items:center;gap:10px;padding:10px 12px;}
.alarm-time{font-size:22px;font-weight:700;color:var(--warm);min-width:70px;}
.alarm-info{flex:1;display:flex;flex-direction:column;gap:2px;}
.alarm-repeat{font-size:11px;color:var(--muted);}
.alarm-toggle{padding:4px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:var(--card-soft);color:var(--muted);}
.alarm-toggle.on{background:var(--good);color:#fff;}
.al-edit{padding:4px 10px;border-radius:8px;font-size:13px;cursor:pointer;background:var(--card-soft);color:var(--ink-2);border:1px solid var(--line);}
.alarm-hint{margin-top:10px;font-size:12px;line-height:1.7;color:var(--warn);background:var(--warm-soft);border:1px solid var(--warm);border-radius:10px;padding:8px 10px;}
.alarm-log{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
.alarm-log-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:var(--card-soft);border-radius:8px;padding:6px 10px;}
.alarm-log-item.missed{color:var(--warn);}
.alarm-log-item b{color:var(--ink-2);}
.alarm-log-item .al-time{font-weight:700;color:var(--ink);}
.alarm-log-item .al-when{margin-left:auto;font-size:11px;}
/* 应用内响铃页 */
.alarm-ring{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;}
.alarm-ring.show{display:flex;}
.alarm-ring .ar-flash{position:absolute;inset:0;background:var(--warn);opacity:0;animation:arFlash 1.2s ease-in-out infinite;}
@keyframes arFlash{0%,100%{opacity:0}50%{opacity:.18}}
.alarm-ring .ar-inner{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-md);padding:34px 30px;text-align:center;max-width:340px;width:86%;animation:amPop .25s ease;}
.ar-bell{font-size:64px;animation:arRing 1s ease-in-out infinite;transform-origin:top center;}
@keyframes arRing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.ar-title{font-size:22px;font-weight:800;color:var(--ink);margin-top:8px;}
.ar-time{font-size:40px;font-weight:800;color:var(--warm);margin-top:4px;font-variant-numeric:tabular-nums;}
.ar-tip{font-size:13px;color:var(--muted);margin-top:6px;}
.ar-btns{display:flex;gap:10px;margin-top:22px;}
.ar-btns button{flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;}
.ar-snooze{background:var(--card-soft);color:var(--ink-2);border:1px solid var(--line)!important;}
.ar-stop{background:var(--good);color:#fff;}
.word-item{display:flex;align-items:center;gap:8px;padding:8px 10px;}
.word-main{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.word-text{font-size:15px;}
.word-meaning{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.word-cat{font-size:11px;color:var(--warm);padding:2px 6px;background:var(--card-soft);border-radius:4px;white-space:nowrap;}
.word-state{font-size:12px;padding:4px 8px;border-radius:6px;cursor:pointer;background:var(--card-soft);white-space:nowrap;}
.word-state.familiar{color:var(--warm);}
.word-state.mastered{color:var(--good);}
.quiz-card{padding:14px;background:var(--card-soft);border-radius:12px;margin-bottom:8px;cursor:pointer;text-align:center;transition:all 0.2s;}
.quiz-card:hover{transform:scale(1.02);}
.quiz-front b{font-size:18px;}
.quiz-back{font-size:15px;color:var(--warm);font-weight:600;}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:8px;}
.ach-card{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--card-soft);border:2px solid transparent;transition:all 0.2s;}
.ach-card.unlocked{border-color:var(--warm);background:var(--card);}
.ach-icon{font-size:24px;}
.ach-info{flex:1;display:flex;flex-direction:column;}
.ach-info b{font-size:13px;}
.ach-desc{font-size:11px;color:var(--muted);}
.ach-status{font-size:11px;color:var(--muted);}
.ach-card.unlocked .ach-status{color:var(--good);font-weight:600;}

/* ---- 通用 chip ---- */

/* ---- Habit week card (首页) ---- */
.habit-week-card{padding:16px 18px;}
.hw-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.hw-title{font-size:16px;font-weight:700;color:var(--ink);}
.hw-stats{font-size:13px;color:var(--muted);}
.hw-stats b{color:var(--ink);font-size:15px;}
.hw-week{display:flex;gap:8px;justify-content:space-between;}
.hw-day{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.hw-dot{width:28px;height:28px;border-radius:50%;background:transparent;border:2px solid transparent;}
.hw-day.done .hw-dot{background:var(--ink);border-color:var(--ink);}
.hw-day.today .hw-dot{box-shadow:0 0 0 3px var(--warm-soft);}
.hw-label{font-size:11px;color:var(--muted);font-weight:500;}
.hw-day.done .hw-label{color:var(--ink);font-weight:600;}

/* ---- Habit heatmap (趋势页) ---- */
.habit-heatmap{margin-top:10px;overflow-x:auto;}
.hhm-grid{min-width:600px;}
.hhm-months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:4px;}
.hhm-month{font-size:10px;color:var(--muted);}
.hhm-cells{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;}
.hhm-cell{aspect-ratio:1;border-radius:3px;background:transparent;}
.hhm-cell.lvl-0{background:transparent;}
.hhm-cell.lvl-1{background:#D8E0C8;}
.hhm-cell.lvl-2{background:#A8C088;}
.hhm-cell.lvl-3{background:#6B9858;}
.hhm-cell.lvl-4{background:var(--ink);}
.hhm-cell.today{outline:2px solid var(--warm);outline-offset:1px;}
.hhm-stats{display:flex;gap:20px;margin-top:12px;font-size:13px;color:var(--muted);}
.hhm-stats span{font-weight:500;}

/* ---- Onboarding ---- */
.onboard-card{
  background:linear-gradient(135deg,#FFF6E8 0%,#FCEDD7 100%);
  border:1px solid #F0DCB5;border-radius:14px;padding:16px;margin-bottom:14px;
}
body[data-theme="dark"] .onboard-card{background:linear-gradient(135deg,#3A3020,#2E2618);border-color:#4A3D24;}
.onboard-card h4{margin:0 0 8px;font-size:15px;}
.onboard-card p{font-size:13px;color:var(--ink-2);margin:4px 0;line-height:1.6;}
.onboard-card .ob-btn{
  background:var(--ink);color:var(--accent-ink);
  padding:8px 16px;border-radius:10px;font-weight:600;margin-top:10px;
}

/* ================== Responsive ================== */
/* ---- 周计划 ---- */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;}
.week-day{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 6px;display:flex;flex-direction:column;gap:4px;min-height:120px;}
.week-day.today{border-color:var(--warm);background:var(--warm-soft);}
.wd-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.wd-date{font-size:10px;color:var(--muted);}
.wd-body{flex:1;font-size:11px;display:flex;flex-direction:column;gap:3px;}
.wd-task{background:var(--card);border-radius:6px;padding:3px 6px;font-size:11px;line-height:1.3;border-left:2px solid var(--warm);}
.wd-task.done{text-decoration:line-through;color:var(--muted);}
.wd-empty{color:var(--faint);text-align:center;font-size:14px;padding:8px 0;}
.wd-assign{font-size:10px;color:var(--muted);background:none;border:1px dashed var(--line);border-radius:6px;padding:3px;cursor:pointer;}
/* ---- 笔记 ---- */
.note-card{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.note-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.note-badge{font-size:11px;color:var(--warm);background:var(--warm-soft);padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
.note-title{flex:1;font-size:14px;color:var(--ink);font-weight:600;}
.note-content{font-size:13px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;word-break:break-word;}
.note-tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;}
.note-related{margin-top:4px;font-size:11px;color:var(--muted);}
.note-date{margin-top:6px;font-size:11px;color:var(--faint);}
/* ---- 看板 ---- */
.chart-box{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px;margin-top:6px;}
.progress-bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;}
.progress-fill{height:100%;background:var(--warm);border-radius:3px;transition:width .3s;}
.li-tag{font-size:10px;color:var(--muted);background:var(--card-soft);padding:1px 6px;border-radius:10px;margin-left:4px;}
@media(max-width:780px){.week-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:780px){
  .sidebar{position:fixed;top:0;left:-220px;width:220px;z-index:91;height:100vh;height:100dvh;
    transition:left .25s ease;box-shadow:0 0 24px rgba(0,0,0,.18);}
  .sidebar.open{left:0;}
  .sb-overlay.show{display:block;}
  .mob-bar{display:flex;}
  .scroll{padding:6px 14px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom));}
  .main-top{padding:10px 14px;}
  .greet-h{font-size:22px;}
  .section-title{font-size:20px;}
}
/* 触屏设备兜底：iPad 桌面宽度被识别时也用抽屉式 */
@media (hover:none) and (pointer:coarse){
  .sidebar{position:fixed;top:0;left:-220px;width:220px;z-index:91;height:100vh;height:100dvh;
    transition:left .25s ease;box-shadow:0 0 24px rgba(0,0,0,.18);background:var(--bg);}
  .sidebar.open{left:0;}
  .sb-overlay.show{display:block;}
  .mob-bar{display:flex;}
  .app{padding-top:0;}
}
/* iPad 横屏及更大宽度：默认常驻展开侧边栏 */
@media (hover:none) and (pointer:coarse) and (min-width:1024px){
  .sidebar{left:0;box-shadow:2px 0 18px rgba(0,0,0,.08);}
  .sb-overlay.show{display:none;}
  .mob-bar{display:none;}
  .main{margin-left:220px;}
}
/* ===== 思考流 / 认知账本 / 时光胶囊 ===== */
.mood-row{display:flex;gap:8px;margin:8px 0;}
.mood{font-size:20px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;cursor:pointer;background:var(--card-soft);transition:.15s;}
.mood.active{border-color:var(--warm);background:var(--warm-soft);transform:scale(1.05);}
.refl-list,.tl-day{margin-top:10px;}
.tl-day{margin-bottom:14px;}
.tl-date{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;padding-left:2px;}
.refl-item{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.refl-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.refl-mood{font-size:16px;}
.refl-time{font-size:11px;color:var(--muted);}
.refl-del{margin-left:auto;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 4px;}
.refl-del:hover{color:var(--warn);}
.refl-text{font-size:14px;line-height:1.6;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;}
.refl-tags{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;}
.tag{font-size:11px;color:var(--warm);background:var(--warm-soft);padding:2px 8px;border-radius:20px;}
.ledger{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.ledger-chip{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:92px;transition:.15s;}
.ledger-chip:hover{border-color:var(--warm);}
.ledger-chip b{font-size:14px;}
.ledger-chip span{font-size:11px;color:var(--muted);}
.led-date{color:var(--faint)!important;}
.ledger-detail{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.led-e{background:var(--card-soft);border-left:3px solid var(--warm);padding:8px 10px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.led-ed{font-size:11px;color:var(--muted);margin-bottom:3px;}
.cap-item{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
.cap-sealed{border-style:dashed;}
.cap-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.cap-head b{font-size:14px;}
.cap-date{font-size:11px;color:var(--muted);margin-left:2px;}
.cap-lock{font-size:13px;color:var(--muted);text-align:center;padding:8px;}
.cap-body{font-size:14px;line-height:1.7;color:var(--ink-2);white-space:pre-wrap;}

/* ===== 课程表 / 项目 / 空闲块 ===== */
.tt-scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);margin-top:10px;}
.tt-grid{display:flex;min-width:780px;position:relative;}
.tt-time-col{width:52px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);position:sticky;left:0;z-index:3;}
.tt-corner{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.tt-time-label{position:absolute;left:0;right:0;font-size:11px;color:var(--muted);text-align:center;line-height:1;padding-top:2px;}
.tt-day-col{flex:1;min-width:100px;border-right:1px solid var(--line);position:relative;}
.tt-day-col:last-child{border-right:none;}
.tt-day-col.today{background:var(--warm-soft);}
.tt-day-head{height:40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;position:sticky;top:0;background:inherit;z-index:2;}
.tt-slots{position:relative;}
.tt-slot{height:32px;border-bottom:1px dashed var(--line-2);cursor:pointer;}
.tt-slot:hover{background:rgba(0,0,0,.03);}
.tt-course{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 5px;font-size:11px;color:#fff;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.1);cursor:pointer;z-index:1;line-height:1.35;}
.tt-course:hover{filter:brightness(1.08);}
.ttc-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ttc-time,.ttc-loc{font-size:10px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.today-courses{display:flex;flex-direction:column;gap:4px;margin:6px 0;}
.tc-item{font-size:13px;color:var(--ink-2);padding:4px 8px;background:var(--card-soft);border-radius:6px;}
.tc-item b{color:var(--ink);}
.free-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.free-slot{background:var(--card-soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:13px;color:var(--ink-2);transition:.15s;}
.free-slot:hover{border-color:var(--good);background:#eef5ee;}
.fs-dur{color:var(--good);font-size:11px;margin-left:4px;}
.ov-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--ink-2);padding:4px 8px;background:var(--card-soft);border-radius:6px;margin-top:4px;}
.proj-card{border-left:3px solid var(--warm);}
.proj-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.proj-head b{font-size:15px;}
.proj-type{font-size:11px;color:var(--warm);background:var(--warm-soft);padding:2px 8px;border-radius:20px;}
.proj-dl{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card-2);color:var(--muted);}
.proj-dl.soon{background:var(--warm-soft);color:var(--warn);}
.proj-dl.over{background:#f8e8e4;color:var(--warn);}
.proj-meta{font-size:12px;color:var(--muted);margin-top:4px;}
.outline-list{display:flex;flex-direction:column;gap:4px;margin-top:4px;}
.ol-item{display:flex;align-items:center;gap:6px;}
.ol-item input[type=checkbox]{flex-shrink:0;width:18px;height:18px;}
.ol-text{flex:1;font-size:13px;padding:4px 8px;}
.cd-tag{font-size:10px;color:var(--muted);background:var(--card-2);padding:1px 6px;border-radius:10px;margin-left:4px;}
.proj-course{font-size:11px;color:var(--warm);background:var(--warm-soft);padding:2px 8px;border-radius:20px;}
.cp-course{margin-bottom:14px;}
.cp-name{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.cp-count{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px;}
.cp-proj{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--card-soft);border-radius:8px;margin-bottom:4px;cursor:pointer;}
.cp-proj:hover{background:var(--card-2);}
.cp-pname{flex:1;font-size:13px;color:var(--ink-2);}
.cp-dl{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card-2);color:var(--muted);}
.cp-dl.soon{background:var(--warm-soft);color:var(--warn);}
.cp-dl.over{background:#f8e8e4;color:var(--warn);}

/* ---- 摘抄 / 观后感 ---- */
.quote-card{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;}
.quote-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.quote-badge{font-size:11px;padding:2px 9px;border-radius:20px;background:var(--warm-soft);color:var(--warm);font-weight:600;flex-shrink:0;}
.quote-badge.q-电影{background:#E7DEEF;color:#7E6BA8;}
.quote-badge.q-书{background:#E2EDE3;color:#5C7B5A;}
.quote-badge.q-段落{background:#EDE7DA;color:#9A8470;}
.quote-badge.q-其他{background:var(--card-2);color:var(--muted);}
.quote-src{font-size:14px;flex:1;color:var(--ink);}
.quote-excerpt{font-size:13.5px;line-height:1.7;color:var(--ink-2);border-left:3px solid var(--warm);padding:4px 0 4px 12px;margin:4px 0 8px;font-style:italic;}
.quote-reflection{font-size:13.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap;}
.quote-date{font-size:11px;color:var(--faint);margin-top:6px;}

/* ---- 目标 / OKR ---- */
.proj-goal{background:#E7DEEF;color:#7E6BA8;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;}
.goal-card{background:var(--card-soft);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;}
.goal-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.goal-head b{font-size:14px;flex:1;color:var(--ink);}
.goal-proj{margin-top:6px;}
.goal-pct{font-size:12px;color:var(--muted);margin-bottom:5px;}
.goal-proj-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;background:var(--card);margin-bottom:4px;font-size:13px;cursor:pointer;}
.goal-proj-item:hover{background:var(--card-2);}
.goal-proj-item span:first-child{color:var(--ink-2);}
/* 目标子任务（拆解看板） */
.goal-tasks{margin-top:8px;display:flex;flex-direction:column;gap:4px;}
.gt-item{display:flex;align-items:center;gap:8px;padding:4px 2px;}
.gt-cb{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;cursor:pointer;transition:all .15s;}
.gt-cb.on{background:var(--good);border-color:var(--good);}
.gt-text{flex:1;font-size:13px;color:var(--ink);}
.gt-item.done .gt-text{text-decoration:line-through;color:var(--muted);}
.gt-del{border:none;background:none;color:var(--muted);font-size:12px;padding:2px 4px;cursor:pointer;}
.gt-del:hover{color:var(--warn);}

/* ---- 复盘范围切换 ---- */
.scope-tabs{display:flex;gap:8px;margin:10px 0 4px;}
.scope-tab{padding:6px 16px;border-radius:20px;background:var(--card-soft);border:1px solid var(--line);font-size:13px;color:var(--ink-2);font-weight:600;}
.scope-tab.active{background:var(--ink);color:var(--accent-ink);border-color:var(--ink);}
.li-tag{font-size:10px;padding:1px 7px;border-radius:10px;background:var(--card-2);color:var(--muted);margin-left:6px;}
.interaction-list{border-top:1px dashed var(--line);padding-top:8px;}

/* ---- 备忘录 ---- */
.memo-card{background:var(--card-soft);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px;}
.memo-card.memo-done{opacity:.55;}
.memo-card.memo-done .memo-text{text-decoration:line-through;}
.memo-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.memo-cat{font-size:12px;font-weight:700;white-space:nowrap;}
.memo-title{font-size:14px;color:var(--ink);}
.memo-pin{margin-left:auto;background:none;border:none;font-size:15px;cursor:pointer;color:var(--muted);line-height:1;padding:0;}
.memo-pin.on{color:#E0B020;}
.memo-text{font-size:13px;color:var(--ink-2);white-space:pre-wrap;line-height:1.5;}
.memo-links{font-size:12px;color:var(--muted);margin-top:4px;}
.memo-link{font-size:12px;color:var(--warm);margin-top:4px;}
.memo-foot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap;}
.memo-date{font-size:11px;color:var(--faint);margin-left:auto;}
.btn-sm{padding:3px 10px;font-size:12px;}

/* ===== 休息模式 · 魁北克冬夜 ===== */
.rest-ambient{position:fixed;inset:0;z-index:40;display:none;overflow:hidden;pointer-events:none;
  background:
    radial-gradient(120% 80% at 50% -12%, rgba(150,70,55,.32), rgba(150,70,55,0) 55%),
    linear-gradient(180deg, #0d1b33 0%, #0b1626 46%, #0a1320 100%);
}
.rest-ambient .rest-glow{position:absolute;top:0;left:0;right:0;height:40vh;
  background:radial-gradient(100% 100% at 50% 0%, rgba(184,92,60,.30), rgba(184,92,60,0) 60%);}
#snowCanvas{position:absolute;inset:0;width:100%;height:100%;}
.rest-ambient .bokeh{position:absolute;border-radius:50%;filter:blur(16px);
  background:radial-gradient(circle, rgba(232,182,122,.92), rgba(232,182,122,0) 70%);
  animation:breathe 7s ease-in-out infinite;}
.rest-ambient .bokeh:nth-child(3){animation-delay:0s;}
.rest-ambient .bokeh:nth-child(4){animation-delay:1.2s;}
.rest-ambient .bokeh:nth-child(5){animation-delay:2.4s;}
.rest-ambient .bokeh:nth-child(6){animation-delay:3.1s;}
.rest-ambient .bokeh:nth-child(7){animation-delay:.6s;}
.rest-ambient .bokeh:nth-child(8){animation-delay:4.2s;}
.rest-ambient .bokeh:nth-child(9){animation-delay:2.0s;}
@keyframes breathe{0%,100%{opacity:.32;transform:scale(1)}50%{opacity:.72;transform:scale(1.14)}}
.rest-ambient .rest-xmas{position:absolute;top:0;left:0;right:0;height:50px;display:none;
  background:repeating-linear-gradient(90deg, rgba(232,182,110,0) 0 24px, rgba(232,182,110,.9) 24px 28px, rgba(232,182,110,0) 28px 54px);
  filter:blur(.4px);opacity:.75;animation:twinkle 3.2s ease-in-out infinite;}
.rest-ambient.xmas-on .rest-xmas{display:block;}
@keyframes twinkle{0%,100%{opacity:.5}50%{opacity:.9}}
/* 暴雪里的小木屋 */
.rest-ambient .rest-cabin{position:absolute;left:15%;bottom:0;width:210px;height:180px;pointer-events:none;}
.rest-ambient .cabin-ground{position:absolute;bottom:10px;left:-80px;right:-130px;height:64px;
  background:radial-gradient(60% 100% at 50% 100%, rgba(228,236,245,.18), rgba(228,236,245,0) 72%);
  filter:blur(8px);}
.rest-ambient .cabin{position:absolute;bottom:36px;left:18px;width:160px;height:124px;}
.rest-ambient .cabin-roof{position:absolute;top:0;left:-15px;right:-15px;height:54px;
  background:linear-gradient(180deg,#3c2b23,#231612);clip-path:polygon(50% 0,100% 100%,0 100%);}
.rest-ambient .cabin-roof .roof-snow{position:absolute;left:0;right:0;bottom:0;height:15px;
  background:linear-gradient(180deg,rgba(240,246,252,.94),rgba(240,246,252,.5));
  clip-path:polygon(50% 36%,100% 100%,0 100%);filter:blur(.3px);}
.rest-ambient .cabin-body{position:absolute;top:52px;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,#2e2019,#170e0b);border-radius:0 0 9px 9px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);}
.rest-ambient .cabin-window{position:absolute;left:24px;top:22px;width:32px;height:36px;
  background:radial-gradient(circle at 50% 38%, #ffe2a4, #e89a4e 68%, #c1742f);border-radius:4px;
  box-shadow:0 0 24px 9px rgba(232,154,78,.6), inset 0 0 7px rgba(255,236,200,.65);
  animation:breathe 6.5s ease-in-out infinite;}
.rest-ambient .cabin-window::before,.rest-ambient .cabin-window::after{content:"";position:absolute;background:rgba(110,62,26,.72);}
.rest-ambient .cabin-window::before{left:50%;top:3px;bottom:3px;width:2px;transform:translateX(-50%);}
.rest-ambient .cabin-window::after{top:50%;left:3px;right:3px;height:2px;transform:translateY(-50%);}
.rest-ambient .cabin-door{position:absolute;right:22px;top:28px;width:26px;height:56px;
  background:linear-gradient(180deg,#3c291f,#22160f);border-radius:5px 5px 0 0;}
.rest-ambient .cabin-glow{position:absolute;left:42px;bottom:22px;width:130px;height:96px;
  background:radial-gradient(circle, rgba(232,154,78,.30), rgba(232,154,78,0) 70%);filter:blur(11px);}

.rest-panel{position:fixed;z-index:45;left:50%;bottom:8%;transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#F2EBE0;pointer-events:auto;}
.rest-panel.hidden{display:none;}
#restClock{font-size:62px;font-weight:200;letter-spacing:5px;font-variant-numeric:tabular-nums;
  color:#F4ECDD;text-shadow:0 2px 34px rgba(0,0,0,.55);line-height:1;}
#restDate{font-size:14px;color:#C9BBA8;letter-spacing:2px;}
#restLine{font-size:14px;color:#D9A55B;max-width:82vw;opacity:.92;font-style:italic;}
.rest-panel .rp-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2px;}
.rest-panel .rp-btns .btn{background:rgba(217,165,91,.16);border:1px solid rgba(217,165,91,.42);color:#F2EBE0;backdrop-filter:blur(4px);}
.rest-panel .rp-btns .btn:active{background:rgba(217,165,91,.3);}

/* 休息模式下：世界沉下去，暖光浮上来 */
body.rest-mode{--warm:#D9A55B;--ink:#F2EBE0;}
body.rest-mode #scroll{filter:blur(.7px) brightness(.82);opacity:.9;transition:filter .7s ease,opacity .7s ease;}
body.rest-mode .sidebar,body.rest-mode .topbar{opacity:.5;transition:opacity .7s ease;}
body.rest-mode .card{background:rgba(18,28,46,.55)!important;backdrop-filter:blur(3px);border-color:rgba(217,165,91,.18)!important;}
body.rest-mode .top-icon{color:#E8DCC8;}
body.rest-mode #restAmbient{display:block;}

/* === MODULE CSS: yearreview === */
