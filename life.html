/* ---- 周/月/年 复盘 ---- */
function reviewRangeOf(scope){
  const d=new Date(currentDate);
  if(scope==="week")return weekRange(currentDate);
  if(scope==="month"){const y=d.getFullYear(),m=d.getMonth();return {start:fmtDate(new Date(y,m,1)),end:fmtDate(new Date(y,m+1,0))};}
  if(scope==="quarter"){const q=Math.floor(d.getMonth()/3);const y=d.getFullYear();return {start:fmtDate(new Date(y,q*3,1)),end:fmtDate(new Date(y,(q+1)*3,0))};}
  const y=d.getFullYear();return {start:fmtDate(new Date(y,0,1)),end:fmtDate(new Date(y,11,31))};
}
function reviewKeyOf(scope){
  if(scope==="week")return weekKey(currentDate);
  if(scope==="month")return currentDate.slice(0,7);
  if(scope==="quarter"){const d=new Date(currentDate);return d.getFullYear()+"-Q"+(Math.floor(d.getMonth()/3)+1);}
  return currentDate.slice(0,4);
}
function summarizeRange(start,end){
  const s=parseDate(start),e=parseDate(end);
  let vocal=0,english={words:0,read:0,listen:0};
  let inSum=0,outSum=0,checkinDays=0,tasksDone=0,tasksTotal=0;
  let allReview=[];
  Object.keys(state.entries).filter(k=>{const d=parseDate(k);return d>=s&&d<=e;}).forEach(k=>{
    const en=state.entries[k];
    if(en.checkIn)checkinDays++;
    if(en.study){vocal+=+(en.study.vocal&&en.study.vocal.vocal_time)||0;if(en.study.english){english.words+=+en.study.english.en_words||0;english.read+=+en.study.english.en_read||0;english.listen+=+en.study.english.en_listen||0;}}
    if(en.finance){(en.finance.in||[]).forEach(x=>inSum+=+x.amount||0);(en.finance.out||[]).forEach(x=>outSum+=+x.amount||0);}
    if(en.tasks){tasksDone+=en.tasks.filter(t=>t.done).length;tasksTotal+=en.tasks.length;}
    if(en.review&&en.review.text)allReview.push({date:k,text:en.review.text});
  });
  const keywords=extractKeywords(allReview.map(r=>r.text).join(" "));
  const contactsCount=state.contacts.filter(c=>c.time&&c.time>=start&&c.time<=end).length;
  return {start,end,checkinDays,vocalMinutes:vocal,englishWords:english.words,englishRead:english.read,englishListen:english.listen,inSum,outSum,tasksDone,tasksTotal,reviews:allReview,keywords,contactsCount};
}

  svg+=`<text x="${W/2}" y="${H-20}" fill="rgba(31,27,23,0.4)" font-size="11" text-anchor="middle">🐶 鹿7铭 · 人生工作台 · ${fmtDate(new Date())}</text>`;

  // 转 PNG 下载
  const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"});

  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement("canvas");
    canvas.width=W*2;canvas.height=H*2;

    },"image/png");
  };
  img.onerror=(e)=>{toast("导出失败，请重试");console.error(e);};
  img.src=url;
}
function escapeXml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
/* 纯 SVG 雷达图（用于导出） */
function buildRadarSvgPure(labels,values,w,h){
  const cx=80,cy=80;
  const r=Math.min(w,h)/2-20;
  const n=labels.length;
  const maxVal=5;
  let polygons="",axes="",dots="";
  for(let lv=1;lv<=maxVal;lv++){
    const pts=[];
    for(let i=0;i<n;i++){
      const angle=(Math.PI*2/n)*i-Math.PI/2;
      const lr=r*(lv/maxVal);
      pts.push((cx+lr*Math.cos(angle)).toFixed(1)+","+(cy+lr*Math.sin(angle)).toFixed(1));
    }
    polygons+=`<polygon points="${pts.join(" ")}" fill="none" stroke="#C8A780" stroke-opacity="${0.2+lv*0.1}" stroke-width="1"/>`;
  }
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2/n)*i-Math.PI/2;
    axes+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(angle)).toFixed(1)}" y2="${(cy+r*Math.sin(angle)).toFixed(1)}" stroke="#C8A780" stroke-opacity="0.4" stroke-width="1"/>`;
    const lx=cx+(r+18)*Math.cos(angle);
    const ly=cy+(r+18)*Math.sin(angle);
    axes+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#3A332D" font-weight="600">${labels[i]}</text>`;
  }
  const dataPts=[];
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2/n)*i-Math.PI/2;
    const dr=r*((values[i]||0)/maxVal);
    dataPts.push((cx+dr*Math.cos(angle)).toFixed(1)+","+(cy+dr*Math.sin(angle)).toFixed(1));
  }
  polygons+=`<polygon points="${dataPts.join(" ")}" fill="rgba(200,167,128,0.35)" stroke="#C8A780" stroke-width="2"/>`;
  dataPts.forEach(p=>{
    const[x,y]=p.split(",");
    dots+=`<circle cx="${x}" cy="${y}" r="3" fill="#C8A780"/>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${polygons}${axes}${dots}</svg>`;
}

/* GitHub 风格近 84 天打卡热力图 */
function habitHeatmapHtml(){
  const days=[];
  const today=new Date();
  for(let i=83;i>=0;i--){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-i);
    const ds=fmtDate(d);
    const e=state.entries[ds];
    let level=0;
    if(e&&e.checkIn){
      // 根据打卡项数+任务完成度算强度
      const checks=Object.keys(e.checks||{}).filter(k=>e.checks[k]).length;
      const tasks=(e.tasks||[]).filter(t=>t.done).length;
      level=Math.min(4,1+Math.floor((checks+tasks)/3));
    }else if(e){
      level=e.checkIn?1:0;
      if(!e.checkIn && Object.keys(e.checks||{}).some(k=>e.checks[k]))level=1;
    }
    const isToday=ds===fmtDate(today);
    days.push({ds,level,isToday,day:d.getDate(),month:d.getMonth()+1});
  }
  // 按周排列（7 列）
  let html='<div class="hhm-grid">';
  // 月份标签
  html+='<div class="hhm-months">';
  let lastMonth=-1;
  for(let i=0;i<days.length;i+=7){
    const m=days[i].month;
    if(m!==lastMonth){html+=`<span class="hhm-month">${m}月</span>`;lastMonth=m;}
    else html+='<span class="hhm-month"></span>';
  }
  html+='</div><div class="hhm-cells">';
  days.forEach(d=>{
    html+=`<div class="hhm-cell lvl-${d.level} ${d.isToday?'today':''}" title="${d.ds}"></div>`;
  });
  html+='</div></div>';
  // 统计
  const checked=days.filter(d=>d.level>=2).length;
  const streak=streakDays();
  const longest=longestStreak();
  html+=`<div class="hhm-stats"><span>🔥 连续 ${streak} 天</span><span>🏆 最长 ${longest} 天</span><span>📊 84天打卡 ${checked} 天</span></div>`;
  return html;
}

/* ============== 周计划模块 ============== */
function weekIdOf(dateStr){
  const d=parseDate(dateStr);
  const onejan=new Date(d.getFullYear(),0,1);
  const week=Math.ceil(((d-onejan)/86400000+onejan.getDay()+1)/7);
  return d.getFullYear()+"-W"+String(week).padStart(2,"0");
}
function weekRangeOf(dateStr){
  const d=parseDate(dateStr);
  const day=d.getDay()||7; // 周日=7
  const monday=new Date(d);monday.setDate(d.getDate()-day+1);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  return {start:iso(monday),end:iso(sunday),monday,sunday};
}
function getWeekPlan(dateStr){
  const wid=weekIdOf(dateStr);
  let p=state.weeklyPlans.find(x=>x.week_id===wid);
  if(!p){
    p={week_id:wid,start_date:weekRangeOf(dateStr).start,end_date:weekRangeOf(dateStr).end,
       weekly_goals:[],daily_assignments:{},week_review:{completion_rate:0,highlights:"",lowlights:"",next_week_focus:""}};
    state.weeklyPlans.push(p);
  }
  // 兜底：补全可能缺失的字段
  if(!Array.isArray(p.weekly_goals))p.weekly_goals=[];
  if(!p.daily_assignments)p.daily_assignments={};
  if(!p.week_review)p.week_review={completion_rate:0,highlights:"",lowlights:"",next_week_focus:""};
  return p;
}

function renderNoteListHTML(list,q){
  if(!list.length)return `<div class="empty">${q?"未找到匹配笔记":"还没有笔记，写第一条吧"}</div>`;
  return list.map(n=>{
    const type=NOTE_TYPES.find(t=>t.k===n.type)||{l:n.type,ico:"📄"};
    const tagsHtml=(n.tags||[]).map(t=>`<span class="tag">#${esc(t)}</span>`).join("");
    const related=[];
    (n.related&&n.related.projects||[]).forEach(id=>{const p=state.projects.find(x=>x.id===id);if(p)related.push("🎯 "+p.name);});
    (n.related&&n.related.goals||[]).forEach(id=>{const g=state.goals.find(x=>x.id===id);if(g)related.push("🏹 "+g.title);});
    return `<div class="note-card">
      <div class="note-head"><span class="note-badge">${type.ico} ${type.l}</span><b class="note-title">${esc(n.title||"无标题")}</b><button class="refl-del" data-note-del="${n.id}">✕</button></div>

      <div class="note-date">${(n.created_at||"").slice(0,16).replace("T"," ")}</div>
    </div>`;
  }).join("");
}
function renderNoteList(q){
  q=(q||"").toLowerCase().trim();
  let list=state.notes.slice();
  if(q)list=list.filter(n=>((n.title||"")+(n.content||"")+(n.tags||[]).join(" ")).toLowerCase().includes(q));
  list.sort((a,b)=>(b.created_at||"").localeCompare(a.created_at||""));
  const el=document.getElementById("noteList");
  if(el)el.innerHTML=renderNoteListHTML(list,q);
}

/* ============== 数据看板 / 仪表盘 ============== */
function svgLineChart(data,w,h){
  // data: [{label,value,color?}]
  if(!data.length)return `<div class="empty">暂无数据</div>`;
  const max=Math.max(...data.map(d=>d.value),1);
  const min=Math.min(...data.map(d=>d.value),0);
  const range=Math.max(max-min,1);
  const pad=24,padB=20,padT=10;
  const iw=w-pad*2,ih=h-padB-padT;
  const step=data.length>1?iw/(data.length-1):0;
  const pts=data.map((d,i)=>[pad+i*step,h-padB-(d.value-min)/range*ih]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  const area=path+` L${pts[pts.length-1][0]} ${h-padB} L${pts[0][0]} ${h-padB} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <path d="${area}" fill="rgba(200,167,128,.15)"/>
    <path d="${path}" fill="none" stroke="var(--warm)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--warm)"/><text x="${p[0]}" y="${h-4}" font-size="9" text-anchor="middle" fill="var(--muted)">${data[i].label}</text>`).join("")}
  </svg>`;
}
function svgBarChart(data,w,h){
  if(!data.length)return `<div class="empty">暂无数据</div>`;
  const max=Math.max(...data.map(d=>d.value),1);
  const pad=24,padB=20,padT=10;
  const iw=w-pad*2,ih=h-padB-padT;
  const bw=iw/data.length*.6;
  const gap=iw/data.length;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    ${data.map((d,i)=>{
      const x=pad+i*gap+(gap-bw)/2;
      const bh=d.value/max*ih;
      const y=h-padB-bh;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${d.color||"var(--warm)"}"/>
        <text x="${x+bw/2}" y="${h-4}" font-size="9" text-anchor="middle" fill="var(--muted)">${d.label}</text>
        <text x="${x+bw/2}" y="${y-3}" font-size="10" text-anchor="middle" fill="var(--ink)">${d.value}</text>`;
    }).join("")}
  </svg>`;
}
function svgPieChart(data,w,h){
  if(!data.length)return `<div class="empty">暂无数据</div>`;
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const cx=w/2,cy=h/2,r=Math.min(w,h)/2-10;
  let angle=-Math.PI/2;const slices=[];
  const colors=["var(--warm)","#9CB57A","#7BA5B0","#C5826B","#A78BB0","#B0A575"];
  data.forEach((d,i)=>{
    const slice=(d.value/total)*Math.PI*2;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    angle+=slice;
    const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
    const large=slice>Math.PI?1:0;
    slices.push(`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[i%colors.length]}"/>`);
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${slices.join("")}
    <circle cx="${cx}" cy="${cy}" r="${r*.55}" fill="var(--card)"/>
    <text x="${cx}" y="${cy-4}" font-size="13" text-anchor="middle" fill="var(--ink)" font-weight="700">${total}</text>
    <text x="${cx}" y="${cy+10}" font-size="9" text-anchor="middle" fill="var(--muted)">总计</text>
  </svg>`;
}
/* 五维雷达图 */
function svgRadarChart(labels,values,w,h){
  if(!labels.length)return '<div class="empty">暂无数据</div>';
  const cx=w/2,cy=h/2;
  const r=Math.min(w,h)/2-36;
  const n=labels.length;
  const maxVal=5;
  let bgPolygons="",axes="";
  // 背景多边形（5层）
  for(let lv=1;lv<=maxVal;lv++){
    const pts=[];
    for(let i=0;i<n;i++){
      const angle=(Math.PI*2/n)*i-Math.PI/2;
      const lr=r*(lv/maxVal);
      pts.push((cx+lr*Math.cos(angle)).toFixed(1)+","+(cy+lr*Math.sin(angle)).toFixed(1));
    }
    bgPolygons+=`<polygon points="${pts.join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  // 轴线 + 标签
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2/n)*i-Math.PI/2;
    axes+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(angle)).toFixed(1)}" y2="${(cy+r*Math.sin(angle)).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    const lx=cx+(r+20)*Math.cos(angle);
    const ly=cy+(r+20)*Math.sin(angle);
    axes+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--ink-2)" font-weight="600">${labels[i]}</text>`;
  }
  // 数据多边形
  const dataPts=[];
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2/n)*i-Math.PI/2;
    const dr=r*((values[i]||0)/maxVal);
    dataPts.push((cx+dr*Math.cos(angle)).toFixed(1)+","+(cy+dr*Math.sin(angle)).toFixed(1));
  }
  const dataPolygon=`<polygon points="${dataPts.join(" ")}" fill="rgba(200,167,128,.25)" stroke="var(--warm)" stroke-width="2"/>`;
  const dots=dataPts.map(p=>{
    const a=p.split(",");
    return `<circle cx="${a[0]}" cy="${a[1]}" r="4" fill="var(--warm)"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${bgPolygons}${axes}${dataPolygon}${dots}</svg>`;
}
function viewBoard(){
  // 收集最近 4 周数据
  const now=new Date();
  const weeks=[];
  for(let w=3;w>=0;w--){
    const ref=new Date(now);ref.setDate(now.getDate()-w*7);
    const r=weekRangeOf(ref.getFullYear()+"-"+String(ref.getMonth()+1).padStart(2,"0")+"-"+String(ref.getDate()).padStart(2,"0"));
    let tasksDone=0,tasksTotal=0,studyMin=0,income=0,expense=0,checkinDays=0;
    for(let d=new Date(r.monday);d<=r.sunday;d.setDate(d.getDate()+1)){
      const dk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
      const e=state.entries[dk];
      if(e){
        (e.tasks||[]).forEach(t=>{tasksTotal++;if(t.done)tasksDone++;});
        studyMin+=(+e.study&&+e.study.vocal&&+e.study.vocal.vocal_time||0);
        (e.finance&&e.finance.in||[]).forEach(x=>income+=(+x.amount||0));
        (e.finance&&e.finance.out||[]).forEach(x=>expense+=(+x.amount||0));
        if(e.checkIn)checkinDays++;
      }
    }
    weeks.push({label:"W"+(4-w),tasksDone,tasksTotal,studyMin,income,expense,checkinDays});
  }
  // 习惯连续打卡 TOP（基于最近 30 天）
  const habitStreaks=CATS.flatMap(cat=>{
    return (cat.items||[]).map(item=>{
      let streak=0;const d=new Date();
      for(let i=0;i<30;i++){
        const dk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
        const e=state.entries[dk];
        if(e&&e.checks&&e.checks[cat.id+"-"+item])streak++;
        else break;
        d.setDate(d.getDate()-1);
      }
      return {label:item,streak};
    });
  }).filter(x=>x.streak>0).sort((a,b)=>b.streak-a.streak).slice(0,5);
  // 学习时间分布（按类别，本月）
  const month=fmtMonth(now);
  const learnByCat={};
  Object.keys(state.entries).forEach(d=>{
    if(!d.startsWith(month))return;
    const e=state.entries[d];
    if(!e||!e.study)return;
    if(e.study.vocal&&e.study.vocal.vocal_time)learnByCat["声乐"]=(learnByCat["声乐"]||0)+(+e.study.vocal.vocal_time||0);
    if(e.study.english&&e.study.english.words)learnByCat["英语"]=(learnByCat["英语"]||0)+(+e.study.english.words||0)/60;
    if(e.study.piano&&e.study.piano.piano_time)learnByCat["钢琴"]=(learnByCat["钢琴"]||0)+(+e.study.piano.piano_time||0);
  });
  const learnData=Object.keys(learnByCat).map(k=>({label:k,value:Math.round(learnByCat[k])}));
  // 目标进度
  const goalsProgress=state.goals.map(g=>{
    const linkedProjects=state.projects.filter(p=>p.goalRef===g.id);
    const totalSteps=linkedProjects.reduce((s,p)=>s+(p.outline||[]).length,0);
    const doneSteps=linkedProjects.reduce((s,p)=>s+(p.outline||[]).filter(x=>x.done).length,0);
    return {title:g.title,level:g.level,rate:totalSteps?Math.round(doneSteps/totalSteps*100):0};
  });
  // 本月关键数字
  let mTaskDone=0,mTaskTotal=0,mStudyMin=0,mIncome=0,mExpense=0;
  Object.keys(state.entries).forEach(d=>{
    if(!d.startsWith(month))return;
    const e=state.entries[d];if(!e)return;
    (e.tasks||[]).forEach(t=>{mTaskTotal++;if(t.done)mTaskDone++;});
    mStudyMin+=(+e.study&&+e.study.vocal&&+e.study.vocal.vocal_time||0);
    (e.finance&&e.finance.in||[]).forEach(x=>mIncome+=(+x.amount||0));
    (e.finance&&e.finance.out||[]).forEach(x=>mExpense+=(+x.amount||0));
  });
  return `
   <div class="card">
     <div class="section-eyebrow">DASHBOARD · ${month}</div>
     <div class="section-title">📈 数据看板</div>
     <p class="section-desc">一眼全局：习惯 · 学习 · 任务 · 财务 · 目标</p>

     <div class="kpi-grid">
       <div class="kpi"><div class="kpi-head">✅ 任务完成</div><div class="kpi-value">${mTaskDone}<span class="unit">/${mTaskTotal}</span></div></div>
       <div class="kpi"><div class="kpi-head">⏱ 学习时长</div><div class="kpi-value">${Math.round(mStudyMin)}<span class="unit">分</span></div></div>
       <div class="kpi"><div class="kpi-head">📈 本月收入</div><div class="kpi-value" style="color:var(--good)">${mIncome}<span class="unit">¥</span></div></div>
       <div class="kpi"><div class="kpi-head">📉 本月支出</div><div class="kpi-value" style="color:var(--warn)">${mExpense}<span class="unit">¥</span></div></div>
     </div>

     <div class="section-eyebrow" style="margin-top:14px">📊 任务完成趋势（近 4 周）</div>
     <div class="chart-box">${svgLineChart(weeks.map(w=>({label:w.label,value:w.tasksDone})),320,140)}</div>

     <div class="section-eyebrow" style="margin-top:14px">⏱ 学习时长趋势（近 4 周，分钟）</div>
     <div class="chart-box">${svgBarChart(weeks.map(w=>({label:w.label,value:w.studyMin})),320,140)}</div>

     ${learnData.length?`<div class="section-eyebrow" style="margin-top:14px">📚 学习时间分布（本月）</div>
     <div class="chart-box">${svgPieChart(learnData,200,180)}</div>`:""}

     ${habitStreaks.length?`<div class="section-eyebrow" style="margin-top:14px">🔥 连续打卡 TOP 5</div>
     <div class="list">${habitStreaks.map(h=>`<div class="list-item"><div class="li-row"><span style="flex:1">${esc(h.label)}</span><b style="color:var(--warm)">${h.streak} 天 🔥</b></div></div>`).join("")}</div>`:""}

     ${goalsProgress.length?`<div class="section-eyebrow" style="margin-top:14px">🎯 目标进度</div>

function weightSvg(pts){
  const w=300,h=120,pad=20;
  const xs=pts.map((p,i)=>pad+i*(w-2*pad)/(pts.length-1));
  const ys=pts.map(p=>h-pad-(p.weight-minW)*((h-2*pad)/(maxW-minW)));
  const minW=Math.min(...pts.map(p=>p.weight))-1;
  const maxW=Math.max(...pts.map(p=>p.weight))+1;
  const path=pts.map((p,i)=>(i===0?"M":"L")+xs[i]+" "+(h-pad-(p.weight-minW)*((h-2*pad)/(maxW-minW)))).join(" ");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" stroke="var(--ink)" stroke-width="2" fill="none"/>
    ${pts.map((p,i)=>`<circle cx="${xs[i]}" cy="${h-pad-(p.weight-minW)*((h-2*pad)/(maxW-minW))}" r="3" fill="var(--ink)"/>`).join("")}
    <text x="${w-pad}" y="${pad+8}" text-anchor="end" fill="var(--muted)" font-size="10">${last.weight} kg</text>
  </svg>`;
}

/* ---- 全年学习强度热力图（类似 GitHub 贡献图） ---- */
function studyYearHeatmap(){
  const now=new Date();
  const y=now.getFullYear();
  // 计算今年的每一天学习时长（声乐+英语+阅读+听力+冥想）
  const days=[];
  for(let m=0;m<12;m++){
    const last=new Date(y,m+1,0).getDate();
    for(let d=1;d<=last;d++){
      const ds=fmtDate(new Date(y,m,d));
      const e=state.entries[ds];
      let mins=0;
      if(e&&e.study){
        mins+=(e.study.vocal&&+e.study.vocal.vocal_time||0);
        mins+=(e.study.piano&&e.study.piano.piano_song?30:0); // 钢琴按文本记录算30分钟
        if(e.study.english){
          mins+=(+e.study.english.en_read||0);
          mins+=(+e.study.english.en_listen||0);
        }
        if(e.study.reading)mins+=(+e.study.reading.minutes||0);
      }
      if(e&&e.health&&e.health.meditation){
        mins+=e.health.meditation.reduce((s,m)=>s+(m.duration||0)/60,0);
      }
      // 加上番茄钟分钟数
      if(e&&e.focusSessions){
        mins+=e.focusSessions.reduce((s,fs)=>s+(fs.duration||0)/60,0);
      }
      days.push({date:ds,mins:Math.round(mins)});
    }
  }
  const maxMins=Math.max(...days.map(d=>d.mins),1);
  // 按周分列（GitHub 风格：列=周，行=周日历上的星期几）
  // 这里用按月分组，每月一行，每行最多 31 天
  const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  // 颜色等级：0=无，1=少(<30min), 2=中(30-60), 3=多(60-120), 4=很多(>120)
  const getColor=(mins)=>{
    if(mins===0)return "var(--card-soft)";
    if(mins<30)return "#E8DCC8";
    if(mins<60)return "#C8B080";
    if(mins<120)return "var(--warm)";
    return "#1F1B17";
  };
  // 计算每月格子数组（31列）
  let html=`<div style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)">`;
  for(let m=0;m<12;m++){
    const last=new Date(y,m+1,0).getDate();
    html+=`<div style="display:flex;align-items:center;gap:6px">
      <div style="width:24px;flex-shrink:0">${monthNames[m]}</div>
      <div style="display:flex;gap:2px;flex:1;overflow-x:auto">`;
    for(let d=1;d<=31;d++){
      if(d>last){
        html+=`<div style="width:14px;height:14px"></div>`;
      }else{
        const ds=fmtDate(new Date(y,m,d));
        const mins=days.find(x=>x.date===ds).mins;
        html+=`<div title="${ds}: ${mins} 分钟" style="width:14px;height:14px;border-radius:2px;background:${getColor(mins)}"></div>`;
      }
    }
    html+=`</div></div>`;
  }
  // 图例
  html+=`<div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)">
    <span>少</span>
    <div style="width:14px;height:14px;border-radius:2px;background:var(--card-soft)"></div>
    <div style="width:14px;height:14px;border-radius:2px;background:#E8DCC8"></div>
    <div style="width:14px;height:14px;border-radius:2px;background:#C8B080"></div>
    <div style="width:14px;height:14px;border-radius:2px;background:var(--warm)"></div>
    <div style="width:14px;height:14px;border-radius:2px;background:#1F1B17"></div>
    <span>多</span>
    <span style="margin-left:auto">本年累计：${Math.round(days.reduce((s,d)=>s+d.mins,0))} 分钟</span>
  </div>`;
  html+=`</div>`;
  return html;
}

/* ---- 30 天情绪曲线 ---- */
function moodLineChart(){
  const now=new Date();
  const data=[];
  const moodVal={
    "😊":5,"😄":5,"😁":5,"😃":5,"😀":5,
    "🙂":4,"😌":4,
    "😐":3,"😑":3,
    "🤔":3,
    "😟":2,"😔":2,"😞":2,"😣":2,"😤":2,
    "😢":1,"😭":1,
    "😡":1,"😠":1
  };
  for(let i=29;i>=0;i--){
    const ds=fmtDate(new Date(now.getFullYear(),now.getMonth(),now.getDate()-i));
    const rfs=state.reflections[ds]||[];
    let avg=null;
    if(rfs.length){
      const vals=rfs.map(r=>moodVal[r.mood]||3).filter(v=>v);
      if(vals.length)avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    }
    data.push({label:ds.slice(5),value:avg===null?0:Math.round(avg*10)/10,date:ds});
  }
  const max=5;
  const w=720,h=200;
  const padL=30,padR=10,padT=10,padB=24;
  const iw=w-padL-padR,ih=h-padT-padB;
  // 背景：横线分隔（1-5 刻度）
  let svg=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <line x1="${padL}" y1="${padT}" x2="${w-padR}" y2="${padT}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${padT+ih*0.25}" x2="${w-padR}" y2="${padT+ih*0.25}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${padT+ih*0.5}" x2="${w-padR}" y2="${padT+ih*0.5}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${padT+ih*0.75}" x2="${w-padR}" y2="${padT+ih*0.75}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--line)"/>
    <text x="${padL-4}" y="${padT+4}" text-anchor="end" font-size="9" fill="var(--muted)">5</text>
    <text x="${padL-4}" y="${padT+ih*0.5+3}" text-anchor="end" font-size="9" fill="var(--muted)">3</text>
    <text x="${padL-4}" y="${h-padB+2}" text-anchor="end" font-size="9" fill="var(--muted)">0</text>
  `;
  // 折线（跳过0值）
  const step=data.length>1?iw/(data.length-1):0;
  let path="",dots="";
  data.forEach((d,i)=>{
    const x=padL+i*step;
    if(d.value>0){
      const y=padT+ih-(d.value/max)*ih;
      if(path)path+="L";else path="M";
      path+=x.toFixed(1)+" "+y.toFixed(1);
      dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--warm)"/>`;
    }
  });
  if(path){
    svg+=`<path d="${path}" fill="none" stroke="var(--warm)" stroke-width="2" stroke-linejoin="round"/>`;
    svg+=dots;
  }
  // 底部日期标签（每5天一个）
  data.forEach((d,i)=>{
    if(i%5===0||i===data.length-1){
      const x=padL+i*step;
      svg+=`<text x="${x.toFixed(1)}" y="${h-6}" font-size="9" text-anchor="middle" fill="var(--muted)">${d.label}</text>`;
    }
  });
  svg+=`</svg>`;
  const avg=data.filter(d=>d.value>0);
  const avgVal=avg.length?(avg.reduce((s,d)=>s+d.value,0)/avg.length).toFixed(1):"--";
  const recordDays=avg.length;
  return svg+`<div style="margin-top:6px;font-size:11px;color:var(--muted);display:flex;gap:14px">
    <span>📊 30 天平均情绪：${avgVal}/5</span>
    <span>📝 有记录：${recordDays}/30 天</span>
  </div>`;
}

/* ============== 思考流 / 认知账本 ============== */
function fmtTime(ts){if(!ts)return"";const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function addReflection(date,obj){
  if(!state.reflections[date])state.reflections[date]=[];
  state.reflections[date].push({id:uid(),text:obj.text,mood:obj.mood||"",tags:extractKeywords(obj.text),createdAt:Date.now()});
}
/* 认知账本：把所有思考按主题聚合，记录出现次数与首末时间 */
function cognitiveLedger(){
  const map={};
  Object.keys(state.reflections).sort().forEach(d=>{
    (state.reflections[d]||[]).forEach(rf=>{
      extractKeywords(rf.text).forEach(k=>{
        const o=map[k]||(map[k]={count:0,first:d,last:d,samples:[]});
        o.count++;
        if(d<o.first)o.first=d;
        if(d>o.last)o.last=d;
        if(o.samples.length<2)o.samples.push(rf.text.slice(0,50));
      });
    });
  });
  let arr=Object.keys(map).map(k=>({k,count:map[k].count,first:map[k].first,last:map[k].last}));
  // 去噪：按包含关系分组，每组选最优代表（count 最高；平局取最短），丢弃噪声 n-gram
  const groups=[];
  arr.forEach(a=>{
    for(const g of groups){
      if(g.some(x=>x.k.indexOf(a.k)>=0||a.k.indexOf(x.k)>=0)){g.push(a);return;}
    }
    groups.push([a]);
  });
  arr=groups.map(g=>g.reduce((best,x)=>x.count>best.count||(x.count===best.count&&x.k.length<best.k.length)?x:best));
  return arr.sort((a,b)=>b.count-a.count);
}
function reflectItemHtml(rf,date){

      <button class="refl-del" data-refl-del="${rf.id}" data-date="${date}">✕</button></div>
    <div class="refl-text">${esc(rf.text)}</div>
    ${rf.tags&&rf.tags.length?`<div class="refl-tags">`+rf.tags.map(t=>`<span class="tag">#${esc(t)}</span>`).join("")+`</div>`:""}
  </div>`;
}

/* ============== 课程表 / 课余空闲 ============== */
const WD_NAMES=["日","一","二","三","四","五","六"];
const WD_FULL=["周日","周一","周二","周三","周四","周五","周六"];
function toMin(t){const a=String(t).split(":").map(Number);return a[0]*60+a[1];}
function fmtMin(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
const COURSE_PALETTE=["#C8A780","#7B9E87","#7E8FAF","#B88A9A","#A89C7B","#8A7BA8","#9A8470","#7BA89C"];
function courseColor(name){
  let h=0;
  for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%10000;
  return COURSE_PALETTE[h%COURSE_PALETTE.length];
}
/* 检测同一天内重叠课程，分配横向宽度 */
function layoutCourses(list){
  const sorted=list.map(c=>({...c,start:toMin(c.start),end:toMin(c.end)})).sort((a,b)=>a.start-b.start);
  const lanes=[];
  for(const c of sorted){
    let placed=false;
    for(const lane of lanes){
      const last=lane[lane.length-1];
      if(last.end<=c.start){lane.push(c);placed=true;break;}
    }
    if(!placed)lanes.push([c]);
  }
  const out=[];
  lanes.forEach((lane,li)=>{
    lane.forEach(c=>out.push({...c,left:(li/lanes.length)*100,width:100/lanes.length,total:lanes.length,lane:li}));
  });
  return out.sort((a,b)=>a.start-b.start);
}
/* 给定日期，返回当天所有占用时段（周课 ∪ 临时覆盖） */
function busySlots(date){
  const dn=parseDate(date).getDay();
  return ((state.courses[String(dn)]||[]).concat(state.courseOverrides[date]||[]))
    .map(c=>({id:c.id,name:c.name,start:toMin(c.start),end:toMin(c.end),loc:c.loc||""}));
}
/* 获取所有课程的去重列表（用于项目关联） */
function allCoursesList(){
  const map={};
  for(let d=1;d<=7;d++){
    (state.courses[String(d)]||[]).forEach(c=>{
      if(!map[c.name])map[c.name]={id:c.id,name:c.name};
    });
  }
  return Object.values(map);
}
/* 根据课程名查找相关的项目/作业 */
function projectsForCourse(courseName){
  return state.projects.filter(p=>p.courseRef===courseName);
}
/* 课余空闲：返回 ≥30 分钟的空闲块 */
function freeSlots(date,winStart,winEnd){
  winStart=toMin(winStart||"07:00");winEnd=toMin(winEnd||"23:00");
  const busy=busySlots(date).slice().sort((a,b)=>a.start-b.start);
  const free=[];let cur=winStart;
  for(const b of busy){
    if(b.start>cur)free.push({start:cur,end:Math.min(b.start,winEnd)});
    cur=Math.max(cur,b.end);
  }
  if(cur<winEnd)free.push({start:cur,end:winEnd});
  return free.filter(f=>f.end-f.start>=30);
}
function viewCourses(){

  const totalMin=(END-START)*60;

  const totalH=slots*SLOT_H;
  const dn=parseDate(currentDate).getDay();
  const todayDay=dn===0?7:dn;
  const HEAD_H=40;
  let timeLabels="";
  for(let i=0;i<=slots;i++){
    const m=START*60+i*30;
    timeLabels+=`<div class="tt-time-label" style="top:${HEAD_H+i*SLOT_H}px">${fmtMin(m)}</div>`;
  }
  let daysHtml="";
  for(let d=1;d<=7;d++){
    const list=(state.courses[String(d)]||[]).slice();
    const layout=layoutCourses(list);
    const isToday=d===todayDay;
    const dayName=WD_FULL[d%7];
    const blocks=layout.map(c=>{
      const top=((c.start-START*60)/totalMin)*totalH;
      const h=Math.max(((c.end-c.start)/totalMin)*totalH,22);
      return `<div class="tt-course" style="top:${top}px;height:${h}px;left:${c.left+1}%;width:${c.width-2}%;background:${courseColor(c.name)}" data-course-del="${d}:${c.id}">

     </div>
   </div>
   <div class="card">
     <div class="section-title">📌 ${currentDate}（${WD_FULL[todayDay%7]}）今日课程与空闲</div>
     ${busySlots(currentDate).sort((a,b)=>a.start-b.start).map(c=>`<div class="tc-item"><b>${fmtMin(c.start)}–${fmtMin(c.end)}</b> ${esc(c.name)}${c.loc?" · 📍"+esc(c.loc):""}</div>`).join("") || `<div class="empty">今天无课</div>`}
     <div class="section-eyebrow" style="margin-top:12px">🟢 课余空闲（点一下填入任务）</div>

    const prog=linked.reduce((a,p)=>{const o=p.outline||[];return a+o.filter(x=>x.done).length;},0);

     ${levels.map(lv=>{
       const gs=state.goals.filter(g=>g.level===lv.k);
       return `<div class="section-eyebrow" style="margin-top:14px">${lv.t}（${gs.length}）</div>
         <div class="list">${gs.length?gs.map(goalCard).join(""):`<div class="empty">还没有${lv.t}</div>`}</div>
         <div class="input-row"><input class="tl-input" id="newGoal-${lv.k}" placeholder="新增${lv.t}…"/><button class="btn" data-action="add-goal" data-level="${lv.k}">添加</button></div>`;
     }).join("")}
   </div>
   ${uncat.length?`<div class="card">
     <div class="section-eyebrow">UNCATEGORIZED</div>
     <div class="section-title" style="font-size:18px">📋 未归类项目（${uncat.length}）</div>
     <div class="list">${uncat.sort((a,b)=>(a.deadline||"9999").localeCompare(b.deadline||"9999")).map(p=>{
       const days=p.deadline?diffDays(currentDate,p.deadline):null;
       return `<div class="goal-proj-item" data-nav="project"><span>${esc(p.name)}</span>${p.deadline?`<span class="cp-dl ${days<0?"over":days<=3?"soon":""}">${days<0?"已过期":"剩"+days+"天"}</span>`:""}</div>`;
     }).join("")}</div>
   </div>`:""}
  `;
}

function render(){
  renderTop();
  const sc=document.getElementById("scroll");
  let html="";
  switch(activeNav){
   case"home":html=viewHome();break;
   case"learn":html=viewLearn();break;
   case"health":html=viewHealthModule();break;
   case"finance":html=viewFinance();break;
   case"relate":html=viewRelate();break;
   case"book":html=viewBooks();break;
   case"course":html=viewCourses();break;
   case"project":html=viewProjects();break;
   case"goals":html=viewGoals();break;
   case"reflect":html=viewReflect();break;
   case"capsule":html=viewCapsule();break;
   case"quote":html=viewQuotes();break;
   case"review":html=viewReview();break;
   case"week":html=viewWeek();break;
   case"note":html=viewNotes();break;
   case"board":html=viewBoard();break;
   case"tree":html=viewTree();break;
   case"trends":html=viewTrends();break;
   default:html=viewHome();
  }
  // 工具区始终追加在最后
  html+=viewTools();
  sc.innerHTML=html;
  bindDateNav();
}

/* ============== 交互 ============== */
function bindDateNav(){
  const sc=document.getElementById("scroll");
  sc.onscroll=null;
}
function onClick(e){
  const t=e.target;
  // nav 切换
  if(t.closest("[data-nav]")){
    activeNav=t.closest("[data-nav]").dataset.nav;
    activeTool=null;
    render();
    // 移动端收起侧栏
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sbOverlay").classList.remove("show");
    return;
  }
  if(t.dataset.nav){activeNav=t.dataset.nav;activeTool=null;render();return;}
  // 日历：点日期切换到那一天
  if(t.dataset.calDate){
    currentDate=t.dataset.calDate;
    // 同步日历游标月份
    calCursor=currentDate;
    render();
    return;
  }
  // 日历：翻月 / 回今天
  if(t.dataset.calNav){
    const a=t.dataset.calNav;
    if(a==="prev"){const d=parseDate(calCursor);calCursor=fmtDate(new Date(d.getFullYear(),d.getMonth()-1,1));}
    else if(a==="next"){const d=parseDate(calCursor);calCursor=fmtDate(new Date(d.getFullYear(),d.getMonth()+1,1));}
    else if(a==="today"){calCursor=fmtDate(new Date());currentDate=fmtDate(new Date());}
    render();
    return;
  }
  // 番茄钟
  if(t.dataset.pomoAction){
    if(t.dataset.pomoAction==="start")startPomo();
    else if(t.dataset.pomoAction==="pause")pausePomo();
    else if(t.dataset.pomoAction==="reset")resetPomo();
    return;
  }
  if(t.dataset.pomoSet!=null){setPomoDuration(+t.dataset.pomoSet);return;}
  // 冥想/呼吸计时器
  if(t.dataset.medAction){
    if(t.dataset.medAction==="start")startMeditate();
    else if(t.dataset.medAction==="stop")stopMeditate(false);
    return;
  }
  if(t.dataset.medSet!=null){setMedDuration(+t.dataset.medSet);return;}
  // 顶栏
  if(t.dataset.top){
    const a=t.dataset.top;
    if(a==="search")openSearch("");
    else if(a==="data")openData();
    else if(a==="theme")toggleTheme();
    return;
  }
  // 打卡签到
  if(t.id==="checkinBtn"){
    getDay(currentDate).checkIn=true;
    save();render();
    toast("已签到 ✓ 连续 +1 天");
    return;
  }
  if(t.dataset.check!=null){
    const k=t.dataset.check;
    const r=getDay(currentDate);
    r.checks[k]=!r.checks[k];
    save();render();
    return;
  }
  if(t.dataset.checkDel!=null){
    delete getDay(currentDate).checks[t.dataset.checkDel];
    save();render();return;
  }
  if(t.dataset.water!=null){
    const r=getDay(currentDate);
    r.health.water[t.dataset.water]=!r.health.water[t.dataset.water];
    save();render();return;
  }
  if(t.dataset.task!=null){
    getDay(currentDate).tasks[+t.dataset.task].done=!getDay(currentDate).tasks[+t.dataset.task].done;
    save();render();return;
  }
  if(t.dataset.taskDel!=null){
    getDay(currentDate).tasks.splice(+t.dataset.taskDel,1);
    save();render();return;
  }
  if(t.dataset.action==="add-task"){
    const i=document.getElementById("newTask");const v=(i&&i.value.trim())||"";if(!v)return;
    getDay(currentDate).tasks.push({text:v,done:false});
    save();render();return;
  }
  if(t.dataset.action==="export-review-image"){
    exportReviewImage(t.dataset.key);return;
  }
  if(t.dataset.action==="export-year-report"){
    exportYearReportImage();return;

  if(t.dataset.action==="add-contact"){
    const i=document.getElementById("newContact-"+t.dataset.cat);const v=(i&&i.value.trim())||"";if(!v)return;
    state.contacts.push({id:uid(),category:t.dataset.cat,name:v,note:"",time:"",interactions:[]});
    save();render();return;

    return;
  }

    if(ct){

    let h=`<div class="list-item"><div class="li-name">${d}</div>`;
    if(e.checkIn)h+='<div class="li-meta">✓ 已签到</div>';

    if(e.study&&e.study.vocal&&e.study.vocal.vocal_time)h+='<div class="li-meta">声乐：'+e.study.vocal.vocal_time+' 分钟</div>';

  if(t.dataset.capDel!=null){
    state.capsules=state.capsules.filter(c=>c.id!==t.dataset.capDel);save();render();return;

    if(!p.daily_assignments[date])p.daily_assignments[date]=[];

      day=d;startHint=time;

  if(t.dataset.courseDel!=null){

    state.courses[day]=(state.courses[day]||[]).filter(c=>c.id!==id);

    if(!state.courseOverrides[currentDate])state.courseOverrides[currentDate]=[];
    state.courseOverrides[currentDate].push({id:uid(),name:nm.value.trim(),start:st.value,end:en.value});
    save();render();return;
  }
  if(t.dataset.ovDel!=null){
    state.courseOverrides[currentDate]=(state.courseOverrides[currentDate]||[]).filter(o=>o.id!==t.dataset.ovDel);
    if(!state.courseOverrides[currentDate].length)delete state.courseOverrides[currentDate];
    save();render();return;
  }
  /* ---- 空闲块 → 任务 ---- */
  if(t.dataset.useSlot!=null){
    const [s,e]=t.dataset.useSlot.split("|");
    getDay(currentDate).tasks.push({text:"（空闲时段）",done:false,start:s,end:e});
    save();render();return;
  }
  /* ---- 项目 ---- */
  if(t.dataset.action==="add-project"){
    const nm=document.getElementById("newProjName"),ty=document.getElementById("newProjType"),dl=document.getElementById("newProjDl");
    const courseSel=document.getElementById("newProjCourse");
    const goalSel=document.getElementById("newProjGoal");
    if(!nm.value.trim()){toast("请填写项目名称");return;}
    state.projects.push({id:uid(),name:nm.value.trim(),type:ty.value,deadline:dl.value,outline:[],materials:[],courseRef:courseSel?courseSel.value:"",goalRef:goalSel?goalSel.value:"",createdAt:Date.now()});
    save();render();return;
  }
  if(t.dataset.projDel!=null){
    state.projects=state.projects.filter(p=>p.id!==t.dataset.projDel);save();render();return;
  }
  if(t.dataset.action==="add-outline"){
    const pid=t.dataset.pid;const inp=document.getElementById("olAdd-"+pid);const v=(inp&&inp.value.trim())||"";
    if(!v)return;
    const p=state.projects.find(x=>x.id===pid);if(!p)return;
    p.outline=p.outline||[];p.outline.push({text:v,done:false});
    save();render();return;
  }
  if(t.dataset.outlineDel!=null){
    const [pid,idx]=t.dataset.outlineDel.split(":");
    const p=state.projects.find(x=>x.id===pid);if(!p)return;
    p.outline.splice(+idx,1);save();render();return;

  if(t.dataset.outlineCheck!=null){
    const [pid,idx]=t.dataset.outlineCheck.split(":");
    const p=state.projects.find(x=>x.id===pid);if(!p)return;
    if(p.outline&&p.outline[+idx])p.outline[+idx].done=t.checked;
    save();return;
  }
  if(t.dataset.toolJump!=null){
    const el=document.getElementById("tool-"+t.dataset.toolJump);
    if(el && el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(t.dataset.tool!=null){
    activeTool=activeTool===t.dataset.tool?null:t.dataset.tool;
    render();return;
  }
  if(t.dataset.reviewScope!=null){
    reviewScope=t.dataset.reviewScope;render();return;
  }
}
const markSaved=debounce(()=>save(),350);
function onInput(e){
  const t=e.target;
  if(t.dataset.taskText!=null){getDay(currentDate).tasks[+t.dataset.taskText].text=t.value;markSaved();return;}
  if(t.dataset.review!=null){getDay(currentDate).review.text=t.value;markSaved();return;}
  if(t.dataset.growth!=null){getDay(currentDate).growth.text=t.value;markSaved();return;}
  if(t.dataset.q!=null){getDay(currentDate).questions[+t.dataset.q]=t.value;markSaved();return;}
  if(t.dataset.goalText!=null){const g=state.goals.find(x=>x.id===t.dataset.goalText);if(g)g.title=t.value;markSaved();return;}
  if(t.dataset.contact!=null){const c=state.contacts.find(x=>x.id===t.dataset.contact);if(c)c[t.dataset.field]=t.value;markSaved();return;}
  if(t.dataset.interaction!=null){
    const [cid,idx]=t.dataset.interaction.split("-");
    const ct=state.contacts.find(c=>c.id===cid);
    if(ct&&ct.interactions&&ct.interactions[+idx]){
      const f=t.dataset.field;
      ct.interactions[+idx][f]=(f==="feeling")?(+t.value||3):t.value;
      if(f==="date"){
        const sorted=ct.interactions.map(i=>i.date).sort().reverse();
        ct.time=sorted[0]||ct.time;
      }
      markSaved();
    }
    return;
  }
  if(t.dataset.book!=null){const b=state.books.find(x=>x.id===t.dataset.book);if(b)b[t.dataset.field]=t.value;markSaved();return;}
  if(t.dataset.study!=null){
    const a=t.dataset.study.split("-");
    const r=getDay(currentDate);
    if(a[0]==="s"&&a.length>=4){
      // s-vocal-vocal_time / s-mood
      if(a[1]==="mood"){r.study.mood=t.value;markSaved();return;}
      const key=a[1];const field=a.slice(2).join("-");
      if(!r.study[key])r.study[key]={};
      r.study[key][field]=t.value;
      markSaved();return;
    }
    return;
  }
  if(t.dataset.exercise!=null){
    const r=getDay(currentDate);
    const v=t.dataset.exercise==="minutes"?+t.value||0:t.value;
    r.health.exercise[t.dataset.exercise]=v;markSaved();return;
  }
  if(t.dataset.sleep!=null){
    getDay(currentDate).health.sleep[t.dataset.sleep]=t.value;markSaved();return;
  }
  if(t.dataset.feeling!=null){getDay(currentDate).health.feeling=t.value;markSaved();return;}
  if(t.dataset.context!=null){getDay(currentDate).context=t.value;markSaved();return;}
  if(t.dataset.outlineText!=null){
    const [pid,idx]=t.dataset.outlineText.split(":");
    const p=state.projects.find(x=>x.id===pid);if(!p)return;
    if(p.outline&&p.outline[+idx])p.outline[+idx].text=t.value;
    markSaved();return;
  }
  if(t.dataset.material!=null){
    const p=state.projects.find(x=>x.id===t.dataset.material);if(!p)return;
    p.materials=t.value.split("\n").filter(s=>s.trim());
    markSaved();return;
  }
  if(t.dataset.balance!=null){getDay(currentDate).finance.balance=t.value;markSaved();recalcFinanceBalance();updateFinanceKpi();return;}
  if(t.dataset.initialBalance!=null){state.financeInitialBalance=(+t.value||0);save();recalcFinanceBalance();updateFinanceKpi();return;}
  if(t.dataset.budgetInput!=null){
    state.financeBudget=state.financeBudget||{};
    state.financeBudget[t.dataset.budgetInput]=(+t.value||0);
    markSaved();return;
  }
  if(t.dataset.fin!=null){
    const a=t.dataset.fin.split("-");const k=a[0];const i=+a[1];const f=a.slice(2).join("-");
    const r=getDay(currentDate);
    if(r.finance[k]&&r.finance[k][i]){
      const numField=(f==="amount"||f==="income");
      r.finance[k][i][f]=numField?(+t.value||0):t.value;
      markSaved();
      recalcFinanceBalance();
      updateFinanceKpi();
    }
    return;
  }
  if(t.dataset.trend!=null){
    const m=document.getElementById("trendMonth");
    state.trends=state.trends||{};
    state.trends[m.value]=t.value;markSaved();return;
  }
  /* ---- 周计划 ---- */
  if(t.dataset.weekGoal!=null){
    const p=getWeekPlan(currentDate);const i=+t.dataset.weekGoal;
    if(p.weekly_goals[i])p.weekly_goals[i].goal=t.value;
    markSaved();return;
  }
  if(t.dataset.weekStatus!=null){
    const p=getWeekPlan(currentDate);const i=+t.dataset.weekStatus;
    if(p.weekly_goals[i])p.weekly_goals[i].status=t.value;
    save();render();return;
  }
  if(t.dataset.weekPrio!=null){
    const p=getWeekPlan(currentDate);const i=+t.dataset.weekPrio;
    if(p.weekly_goals[i])p.weekly_goals[i].priority=+t.value;
    markSaved();return;
  }
  if(t.dataset.weekRev!=null){
    const p=getWeekPlan(currentDate);
    p.week_review[t.dataset.weekRev]=t.value;
    markSaved();return;
  }
  /* ---- 笔记 ---- */
  if(t.dataset.noteSearch!=null){
    renderNoteList(t.value);
    return;
  }
  if(t.dataset.metric!=null){
    if(!state.metrics[currentDate])state.metrics[currentDate]={};
    state.metrics[currentDate][t.dataset.metric]=t.value?+t.value:"";
    markSaved();return;
  }
  if(t.dataset.reviewPeriod!=null){
    const wk=t.dataset.reviewPeriod;
    const f=t.dataset.field;
    if(!state.reviews[wk])state.reviews[wk]={};
    state.reviews[wk][f]=t.value;
    markSaved();return;
  }
  if(t.dataset.radar!=null&&t.dataset.dim!=null){
    const wk=t.dataset.radar;
    const dim=t.dataset.dim;
    if(!state.reviews[wk])state.reviews[wk]={};
    if(!state.reviews[wk].radar)state.reviews[wk].radar={};
    state.reviews[wk].radar[dim]=+t.value||1;
    save();render();return;
  }
  if(t.dataset.focusEdit!=null){
    const arr=getFocusThree();
    arr[+t.dataset.focusEdit]=t.value;
    setFocusThree(arr);
    markSaved();return;
  }
}
function onChange(e){
  const t=e.target;
  if(t.id==="trendMonth"){render();return;}
  if(t.dataset.pomoTask!=null){
    const idx=+t.value;
    const r=getDay(currentDate);
    if(idx>=0&&r.tasks[idx]){pomoTaskRef={taskIndex:idx,taskText:r.tasks[idx].text};}
    else{pomoTaskRef=null;}

  }
}
function onKey(e){
  if(e.key==="Enter"){
    const t=e.target;
    if(t.id==="qcInput"){e.preventDefault();document.querySelector('[data-action="quick-capture"]').click();return;}
    if(t.id==="newFocus"){
      e.preventDefault();

    }
    if(t.id==="newTask"){e.preventDefault();t.previousElementSibling&&t.click();}

}

/* ============== 搜索 ============== */
function openSearch(preset){
 document.getElementById("searchOverlay").classList.remove("hidden");
 const i=document.getElementById("searchInput");i.value=preset||"";i.focus();runSearch();
}
function closeSearch(){document.getElementById("searchOverlay").classList.add("hidden");}
function runSearch(){
 const q=document.getElementById("searchInput").value.trim().toLowerCase();
 const box=document.getElementById("searchResults");
 if(!q){box.innerHTML='<div class="empty">输入关键词跨板块检索</div>';return;}
 const res=[];
 const push=(modL,disp,search,full,jump)=>{if(!search)return;if(search.toLowerCase().includes(q))res.push({modL,disp:String(disp),full:full||String(disp),jump});};
 Object.keys(state.entries).forEach(date=>{
  const r=state.entries[date];
  (r.tasks||[]).forEach((t,i)=>push("任务",t.text,t.text,t.text,"tasks:"+date+":"+i));
  if(r.review&&r.review.text)push("复盘",r.review.text,r.review.text,r.review.text,"review:"+date);
  if(r.growth&&r.growth.text)push("精进",r.growth.text,r.growth.text,r.growth.text,"growth:"+date);
  Object.values(r.questions||{}).forEach((a,i)=>{if(a)push("八问",a,a,a,"q:"+date+":"+i);});
 });
 state.contacts.forEach(c=>push("联系人",c.name+" "+c.note,c.name+" "+c.note,c.name+" "+c.note,"contact:"+c.id));
 state.books.forEach(b=>push("书架",b.title+" "+b.author+" "+b.note,b.title+" "+b.author+" "+b.note,b.title+" "+b.author+" "+b.note,"book:"+b.id));
 Object.keys(state.reflections).forEach(date=>{
  (state.reflections[date]||[]).forEach(rf=>push("思考",rf.text,rf.text,rf.text,"reflect:"+date));
 });
 state.capsules.forEach(c=>push("胶囊",c.title+" "+c.text,c.title+" "+c.text,c.title+" "+c.text,"capsule:"+c.id));
 state.quotes.forEach(q=>push("摘抄",(q.source||"")+" "+(q.excerpt||"")+" "+(q.reflection||""),(q.source||"")+" "+(q.excerpt||"")+" "+(q.reflection||""),(q.source||"")+" "+(q.excerpt||""),"quote:"+q.id));
 state.projects.forEach(p=>push("项目",p.name+" "+p.type+" "+(p.materials||[]).join(" "),p.name+" "+(p.materials||[]).join(" "),p.name+" "+(p.materials||[]).join(" "),"project:"+p.id));
 state.notes.forEach(n=>push("笔记",(n.title||"")+" "+(n.content||"")+" "+(n.tags||[]).join(" "),(n.title||"")+" "+(n.content||"")+" "+(n.tags||[]).join(" "),(n.content||"").slice(0,80),"note:"+n.id));
 state.weeklyPlans.forEach(w=>{w.weekly_goals.forEach(g=>push("周计划",g.goal||"",g.goal||"",g.goal||"","week:"+w.week_id));});
 if(!res.length){box.innerHTML='<div class="empty">未找到匹配内容</div>';return;}
 box.innerHTML=res.slice(0,80).map(r=>`<div class="sr" data-jump="${r.jump}"><div class="sr-meta"><span class="sr-mod">${r.modL}</span></div><div class="sr-snip">${snippet(r.full,q)}</div></div>`).join("");
 box.querySelectorAll(".sr").forEach(el=>el.onclick=()=>jump(el.dataset.jump));
}
function snippet(text,q){
 text=String(text);const low=text.toLowerCase();const idx=low.indexOf(q);
 if(idx<0)return esc(text.slice(0,120));
 const a=Math.max(0,idx-40),b=Math.min(text.length,idx+q.length+80);
 let s=(a>0?"…":"")+esc(text.slice(a,b))+(b<text.length?"…":"");
 const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
 s=s.replace(re,"<mark>$1</mark>");
 return s;
}
function jump(spec){
 const [type,...rest]=spec.split(":");
 closeSearch();
 const scrollTo=(id)=>{setTimeout(()=>{const el=document.getElementById(id);if(el && el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"start"});},50);};
 if(type==="tasks"){activeNav="home";currentDate=rest[0];render();setTimeout(()=>document.getElementById("scroll").scrollIntoView(),50);}
 else if(type==="review"){activeNav="home";if(rest[0])currentDate=rest[0];render();scrollTo("tool-review");}
 else if(type==="growth"){activeNav="home";if(rest[0])currentDate=rest[0];render();scrollTo("tool-growth");}
 else if(type==="q"){activeNav="home";if(rest[0])currentDate=rest[0];render();scrollTo("tool-questions");}
 else if(type==="contact"){activeNav="relate";render();}
 else if(type==="book"){activeNav="book";render();}
 else if(type==="reflect"){activeNav="reflect";render();}
 else if(type==="capsule"){activeNav="capsule";render();}
 else if(type==="quote"){activeNav="quote";render();}
 else if(type==="project"){activeNav="project";render();}
 else if(type==="note"){activeNav="note";render();}
 else if(type==="week"){activeNav="week";render();}
}

/* ============== 语音录入 ============== */
let voiceRec=null,voiceActive=false;
function toggleVoice(){
  const btn=document.getElementById("voiceBtn");
  if(!btn)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("当前浏览器不支持语音识别");return;}
  if(voiceActive){
    try{voiceRec&&voiceRec.stop();}catch(e){}
    voiceActive=false;
    btn.classList.remove("recording");
    return;
  }
  voiceRec=new SR();
  voiceRec.lang="zh-CN";
  voiceRec.continuous=false;
  voiceRec.interimResults=false;
  voiceRec.onstart=()=>{voiceActive=true;btn.classList.add("recording");toast("🎤 正在听… 说完后自动录入");}
  voiceRec.onend=()=>{voiceActive=false;btn.classList.remove("recording");}
  voiceRec.onerror=(e)=>{voiceActive=false;btn.classList.remove("recording");toast("语音识别失败："+(e.error||"未知错误"));}
  voiceRec.onresult=(e)=>{
    const txt=e.results[0][0].transcript;
    const input=document.getElementById("qcInput");
    if(input){input.value=txt;input.focus();}
    toast("识别完成："+txt.slice(0,20)+(txt.length>20?"…":""));
  };
  try{voiceRec.start();}catch(e){toast("无法启动语音识别");}
}

/* ============== 本地推送提醒 ============== */
function initNotifications(){
  if(!("Notification" in window))return;
  if(Notification.permission==="default"&&settings.notifEnabled){
    Notification.requestPermission().then(p=>{
      if(p==="granted")scheduleNotifCheck();
    });
  }else if(Notification.permission==="granted"&&settings.notifEnabled){
    scheduleNotifCheck();
  }
}
function enableNotifications(){
  if(!("Notification" in window)){toast("当前浏览器不支持推送通知");return false;}
  if(Notification.permission==="granted"){settings.notifEnabled=true;saveSettings();scheduleNotifCheck();toast("✅ 已开启推送提醒");return true;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){
      settings.notifEnabled=true;saveSettings();scheduleNotifCheck();
      toast("✅ 已开启推送提醒");
    }else{
      toast("需要在浏览器设置中允许通知");
    }
  });
  return true;
}
function scheduleNotifCheck(){
  // 每小时检查一次提醒
  if(window._notifTimer)clearInterval(window._notifTimer);
  window._notifTimer=setInterval(()=>{
    if(!settings.notifEnabled||Notification.permission!=="granted")return;
    const today=fmtDate(new Date());
    if(settings.lastNotifDay===today+"h"+new Date().getHours())return;
    const alerts=dailyAlerts();
    if(alerts.length){
      settings.lastNotifDay=today+"h"+new Date().getHours();
      saveSettings();
      const body=alerts.slice(0,3).map(a=>a.icon+" "+a.text).join("\n");
      try{
        new Notification("📋 人生工作台提醒",{
          body:body,
          icon:"icons/apple-touch-icon.png",
          tag:"life-notif-"+today
        });
      }catch(e){}
    }
  },3600000); // 1小时
}

/* ============== 智能建议引擎（离线） ============== */
function smartSuggestions(){
  const sugs=[];
  const today=fmtDate(new Date());
  // 1. 学习趋势：对比本周和上周
  const thisWeek=weekStats(today);
  const lastWeekStart=addDays(weekRange(today).start,-7);
  const lastWeek=weekStats(lastWeekStart);
  if(thisWeek.studyMin!=null&&lastWeek.studyMin!=null){
    if(lastWeek.studyMin>0&&thisWeek.studyMin<lastWeek.studyMin*0.7){
      const drop=Math.round((1-thisWeek.studyMin/lastWeek.studyMin)*100);
      sugs.push({icon:"📉",text:`本周学习时间较上周下降了 ${drop}%，是否需要调整安排？`});
    }else if(thisWeek.studyMin>lastWeek.studyMin*1.3){
      const rise=Math.round((thisWeek.studyMin/(lastWeek.studyMin||1)*100-100));
      sugs.push({icon:"📈",text:`学习时间较上周增长 ${rise}%，势头很好，继续保持！`});
    }
  }
  // 2. 联系人冷落
  const cold=coldContacts(30);
  if(cold.length>=3){
    sugs.push({icon:"🤝",text:`${cold.length} 位联系人超 30 天未联系，建议今天联系 ${cold.slice(0,2).map(c=>esc(c.name)).join("、")}`});
  }
  // 3. 情绪走势
  let moodLow=0;
  for(let i=0;i<3;i++){
    const d=addDays(today,-i);
    const refls=state.reflections[d]||[];
    if(refls.length&&refls[0].mood){
      const mv={"😊":5,"🙂":4,"😐":3,"😟":2,"😢":1};
      if((mv[refls[0].mood]||3)<=2)moodLow++;
    }
  }
  if(moodLow>=2)sugs.push({icon:"🌧️",text:"近 3 天情绪偏低，建议出门散步或做点喜欢的事"});
  // 4. 打卡连续中断
  const streak=streakDays();
  const yest=addDays(today,-1);
  const yEntry=state.entries[yest];
  if(streak===0&&(!yEntry||!yEntry.checkIn))sugs.push({icon:"🔥",text:"连续打卡中断了，今天重新开始吧"});
  // 5. 备份提醒
  if(shouldRemindBackup())sugs.push({icon:"💾",text:"已超过 7 天未备份数据，建议导出一份"});
  // 6. 读书
  const reading=state.books.filter(b=>b.status==="在读");
  if(reading.length){
    const stale=reading.filter(b=>{
      if(!b.start)return false;
      const days=diffDays(b.start,today);
      return days>30&&(!b.progress||b.progress<50);
    });
    if(stale.length)sugs.push({icon:"📚",text:`《${esc(stale[0].title)}》已开始 ${diffDays(stale[0].start,today)} 天，进度 ${stale[0].progress||0}%，继续读吧`});
  }
  return sugs;
}

/* ============== 天气（联网缓存） ============== */
let weatherCache=null;
async function fetchWeather(){
  // 尝试从 sessionStorage 获取缓存
  const cached=sessionStorage.getItem("weatherCache");
  if(cached){
    weatherCache=JSON.parse(cached);
  }
  // 如果缓存是今天的，直接用
  if(weatherCache&&weatherCache.date===fmtDate(new Date()))return weatherCache;
  // 在线获取
  try{
    const pos=await new Promise((res,rej)=>{
      if(!navigator.geolocation)return rej("no geo");
      navigator.geolocation.getCurrentPosition(p=>res(p),e=>rej(e),{timeout:5000,maximumAge:600000});
    });
    const lat=pos.coords.latitude.toFixed(2);
    const lon=pos.coords.longitude.toFixed(2);
    const res=await fetch(`https://wttr.in/${lat},${lon}?format=j1`,{signal:AbortSignal.timeout?AbortSignal.timeout(6000):undefined});
    const data=await res.json();
    const cur=data.current_condition&&data.current_condition[0];
    if(!cur)throw new Error("no data");
    const code=parseInt(cur.weatherCode);
    let icon="🌤️";
    if(code<=3)icon=parseInt(cur.weatherCode)===1?"☀️":"⛅";
    else if(code<=48)icon="🌫️";
    else if(code<=67||code>=80&&code<=82)icon="🌧️";
    else if(code>=71&&code<=77)icon="❄️";
    else if(code>=95)icon="⛈️";
    weatherCache={
      date:fmtDate(new Date()),
      icon:icon,
      temp:parseInt(cur.temp_C),
      desc:cur.lang_zh&&cur.lang_zh[0]?cur.lang_zh[0].value:cur.weatherDesc&&cur.weatherDesc[0]?cur.weatherDesc[0].value:"",
      loc:data.nearest_area&&data.nearest_area[0]?data.nearest_area[0].areaName[0].value:""
    };
    sessionStorage.setItem("weatherCache",JSON.stringify(weatherCache));
  }catch(e){
    // 离线或失败：使用缓存或默认
    if(!weatherCache)weatherCache=null;
  }
  return weatherCache;
}
function weatherHtml(){
  if(!weatherCache)return"";
  return `<div class="weather-row">
    <span class="weather-icon">${weatherCache.icon}</span>
    <span class="weather-temp">${weatherCache.temp}°</span>
    <span class="weather-desc">${esc(weatherCache.desc)}</span>
    <span class="weather-loc">${esc(weatherCache.loc)}</span>
  </div>`;
}

/* 计算今日养分：从各模块数据中提取 */
function calcTreeNutrients(){
  const today=fmtDate(new Date());
  const r=getDay(today);
  let water=0,sunlight=0,fertilizer=0;
  const num=(v)=>+(v||0);

  // 打卡 → 水
  const dn=CHECK_TPL.reduce((a,c)=>a+c.items.filter(it=>r.checks[c.cat+"-"+it]).length,0);
  water+=dn*10;

  // 喝水记录 → 水
  if(r.health&&r.health.water){
    const w=r.health.water;
    if(typeof w==="object"){
      water+=Object.values(w).filter(v=>v===true).length*5;
    }else{
      water+=num(w)*5;
    }
  }

  // 学习 → 肥
  const fs=r.focusSessions||[];
  const studyMin=fs.reduce((s,f)=>s+Math.round(num(f.duration)/60),0);
  fertilizer+=studyMin*2;
  if(r.study&&r.study.vocal&&r.study.vocal.vocal_time)fertilizer+=num(r.study.vocal.vocal_time);
  if(r.study&&r.study.english&&(r.study.english.en_words||r.study.english.en_read))fertilizer+=num(r.study.english.en_words)+num(r.study.english.en_read);

  // 运动 → 阳光
  if(r.health&&r.health.exercise){
    const ex=r.health.exercise;
    if(typeof ex==="object")sunlight+=num(ex.minutes);
    else sunlight+=num(ex);
  }
  if(r.health&&r.health.meditation)sunlight+=r.health.meditation.reduce((s,m)=>s+Math.round(num(m.duration)/60),0);
  if(r.health&&r.health.sleep&&num(r.health.sleep)>=7)sunlight+=20;

  // 思考 → 肥
  const refls=state.reflections[today]||[];
  fertilizer+=refls.length*20;

  // 连续打卡 → 额外养分
  const streak=streakDays();
  if(streak>=7)fertilizer+=50;
  if(streak>=30){water+=100;sunlight+=100;}

  return {water,sunlight,fertilizer,total:water+sunlight+fertilizer};
}

/* 更新树数据（每次 render 时调用，确保养分实时） */
function updateTreeData(){
  const today=fmtDate(new Date());
  const td=state.treeData;
  if(!td)state.treeData={nutrients:0,water:0,sunlight:0,fertilizer:0,level:1,lastCalcDate:"",history:{}};
  // 如果今天还没计算过，累加今日养分
  if(td.lastCalcDate!==today){
    const n=calcTreeNutrients();
    td.nutrients=(+td.nutrients||0)+(+n.total||0);
    td.water=(+td.water||0)+(+n.water||0);
    td.sunlight=(+td.sunlight||0)+(+n.sunlight||0);
    td.fertilizer=(+td.fertilizer||0)+(+n.fertilizer||0);
    td.history[today]={water:+n.water,sunlight:+n.sunlight,fertilizer:+n.fertilizer,total:+n.total};
    td.lastCalcDate=today;
    // 更新等级
    for(let i=TREE_LEVELS.length-1;i>=0;i--){
      if(td.nutrients>=TREE_LEVELS[i].min){td.level=TREE_LEVELS[i].lv;break;}
    }
    save();
  }
}

    // 小苗
    svg+=`<g class="trunk">
      <path d="M${cx},${h-30} Q${cx-3},${h-100} ${cx},${h-120}" stroke="url(#trunk)" stroke-width="6" fill="none" stroke-linecap="round"/>
      <g class="leaf-cluster">
        <ellipse cx="${cx-18}" cy="${h-90}" rx="14" ry="9" fill="url(#leaf1)" transform="rotate(-25 ${cx-18} ${h-90})"/>
        <ellipse cx="${cx+18}" cy="${h-95}" rx="14" ry="9" fill="url(#leaf1)" transform="rotate(25 ${cx+18} ${h-95})"/>
        <ellipse cx="${cx-10}" cy="${h-115}" rx="12" ry="8" fill="url(#leaf2)" transform="rotate(-15 ${cx-10} ${h-115})"/>
        <ellipse cx="${cx+10}" cy="${h-115}" rx="12" ry="8" fill="url(#leaf2)" transform="rotate(15 ${cx+10} ${h-115})"/>
        <circle cx="${cx}" cy="${h-125}" r="8" fill="url(#leaf1)"/>
      </g>
    </g>`;
  }else{
    // 小树到大树（level 4-7）
    const scale=0.6+(level-3)*0.12; // 树越来越大
    const trunkH=120*scale;
    const crownR=50*scale;
    const crownY=h-30-trunkH;

    svg+=`<g class="trunk">`;
    // 树干（分叉）
    svg+=`<path d="M${cx},${h-30} Q${cx-4},${h-trunkH*0.6} ${cx-2},${crownY+10}" stroke="url(#trunk)" stroke-width="${8*scale}" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx},${h-30} Q${cx+4},${h-trunkH*0.6} ${cx+2},${crownY+10}" stroke="url(#trunk)" stroke-width="${8*scale}" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx},${h-30} L${cx},${crownY+15}" stroke="url(#trunk)" stroke-width="${6*scale}" stroke-linecap="round"/>`;
    // 分枝
    svg+=`<path d="M${cx},${crownY+20} Q${cx-30*scale},${crownY+5} ${cx-40*scale},${crownY-5}" stroke="url(#trunk)" stroke-width="${4*scale}" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx},${crownY+20} Q${cx+30*scale},${crownY+5} ${cx+40*scale},${crownY-5}" stroke="url(#trunk)" stroke-width="${4*scale}" fill="none" stroke-linecap="round"/>`;
    svg+=`</g>`;

    // 树冠（多团叶子）
    svg+=`<g class="leaf-cluster">`;
    const clusters=[
      {x:cx,y:crownY,r:crownR,grad:"leaf1"},
      {x:cx-crownR*0.7,y:crownY+crownR*0.3,r:crownR*0.7,grad:"leaf2"},
      {x:cx+crownR*0.7,y:crownY+crownR*0.3,r:crownR*0.7,grad:"leaf1"},
      {x:cx-crownR*0.3,y:crownY-crownR*0.5,r:crownR*0.6,grad:"leaf2"},
      {x:cx+crownR*0.3,y:crownY-crownR*0.5,r:crownR*0.6,grad:"leaf1"},
      {x:cx,y:crownY-crownR*0.7,r:crownR*0.55,grad:"leaf2"},
    ];
    if(level>=5){
      clusters.push({x:cx-crownR*1.1,y:crownY,r:crownR*0.5,grad:"leaf1"});
      clusters.push({x:cx+crownR*1.1,y:crownY,r:crownR*0.5,grad:"leaf2"});
    }
    clusters.forEach((c,i)=>{
      svg+=`<circle class="leaf" cx="${c.x}" cy="${c.y}" r="${c.r}" fill="url(#${c.grad})" opacity="${0.8+0.2*(i%2)}"/>`;
    });

    // 果实（level >= 4）
    if(level>=4){
      const fruits=[
        {x:cx-crownR*0.4,y:crownY+crownR*0.2},
        {x:cx+crownR*0.5,y:crownY-crownR*0.1},
        {x:cx-crownR*0.1,y:crownY+crownR*0.4},
      ];
      if(level>=5)fruits.push({x:cx+crownR*0.2,y:crownY+crownR*0.3});
      if(level>=6)fruits.push({x:cx-crownR*0.6,y:crownY-crownR*0.3});
      fruits.forEach(f=>{
        svg+=`<circle class="fruit" cx="${f.x}" cy="${f.y}" r="${6*scale}" fill="url(#fruit)"/>`;
      });
    }

    // 花朵（level >= 6）
    if(level>=6){
      const flowers=[
        {x:cx+crownR*0.6,y:crownY-crownR*0.4},
        {x:cx-crownR*0.8,y:crownY+crownR*0.1},
        {x:cx+crownR*0.1,y:crownY-crownR*0.6},
      ];
      if(level>=7)flowers.push({x:cx-crownR*0.3,y:crownY+crownR*0.5});
      flowers.forEach(f=>{
        for(let p=0;p<5;p++){
          const ang=p*72*Math.PI/180;
          const px=f.x+Math.cos(ang)*5*scale;
          const py=f.y+Math.sin(ang)*5*scale;
          svg+=`<circle class="flower" cx="${px}" cy="${py}" r="${4*scale}" fill="url(#flower)" opacity="0.9"/>`;
        }
        svg+=`<circle cx="${f.x}" cy="${f.y}" r="${3*scale}" fill="#FFE5A0"/>`;
      });
    }

    // 星星（level 7）
    if(level>=7){
      svg+=`<text x="${cx}" y="${crownY-crownR*0.9}" text-anchor="middle" font-size="20" filter="url(#glow)">🌟</text>`;
      svg+=`<text x="${cx-crownR}" y="${crownY-crownR*0.4}" text-anchor="middle" font-size="14" filter="url(#glow)">✨</text>`;
      svg+=`<text x="${cx+crownR}" y="${crownY-crownR*0.4}" text-anchor="middle" font-size="14" filter="url(#glow)">✨</text>`;
    }
    svg+=`</g>`;
  }

  // 根系（level >= 2）
  if(level>=2){
    svg+=`<g class="root" opacity="0.4">`;
    svg+=`<path d="M${cx-8},${h-30} Q${cx-20},${h-20} ${cx-30},${h-12}" stroke="#6B5435" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx+8},${h-30} Q${cx+20},${h-20} ${cx+30},${h-12}" stroke="#6B5435" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx},${h-30} L${cx},${h-10}" stroke="#6B5435" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    if(level>=4){
      svg+=`<path d="M${cx-15},${h-25} Q${cx-30},${h-15} ${cx-40},${h-8}" stroke="#6B5435" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
      svg+=`<path d="M${cx+15},${h-25} Q${cx+30},${h-15} ${cx+40},${h-8}" stroke="#6B5435" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
    }
    svg+=`</g>`;
  }

  // 飘浮粒子（养分粒子）
  if(level>=3){
    for(let i=0;i<5;i++){
      const px=cx+(Math.random()-0.5)*100;
      const py=h-100-Math.random()*80;
      svg+=`<circle class="particle" cx="${px}" cy="${py}" r="2" fill="#FFE5A0" opacity="0" style="animation-delay:${i*0.6}s"/>`;
    }
  }

  svg+=`</svg>`;
  return svg;
}

function download(name,content){const b=new Blob([content],{type:"application/json;charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

/* ============== 番茄钟 ============== */
function fmtPomoTime(sec){
  sec=Math.max(0,Math.floor(sec));
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function updatePomoDisplay(){
  const el=document.getElementById("pomoDisplay");
  if(el)el.textContent=fmtPomoTime(pomoRemain);
  const status=document.getElementById("pomoStatus");
  if(status)status.textContent=pomoRunning?"专注中…保持心流":"选一个时长，坐下来开始专注";
  const startBtn=document.getElementById("pomoStart");
  const pauseBtn=document.getElementById("pomoPause");
  if(startBtn&&pauseBtn){
    startBtn.style.display=pomoRunning?"none":"inline-block";
    pauseBtn.style.display=pomoRunning?"inline-block":"none";
  }
  const taskLabel=document.getElementById("pomoTaskLabel");
  if(taskLabel)taskLabel.textContent=pomoTaskRef?"关联任务: "+pomoTaskRef.taskText:"未关联任务";
}
function startPomo(){
  if(pomoRunning)return;
  if(pomoRemain<=0)pomoRemain=pomoDuration;
  // 记录开始时间和关联任务
  pomoStartTime=new Date().toISOString();
  if(!pomoTaskRef){
    const r=getDay(currentDate);
    const undone=r.tasks.filter(t=>!t.done);
    if(undone.length){
      const idx=r.tasks.indexOf(undone[0]);
      pomoTaskRef={taskIndex:idx,taskText:undone[0].text};
    }
  }
  pomoRunning=true;
  updatePomoDisplay();
  pomoTimer=setInterval(()=>{
    pomoRemain--;
    if(pomoRemain<=0){
      clearInterval(pomoTimer);pomoTimer=null;
      pomoRunning=false;
      pomoRemain=0;
      // 完成一个番茄
      const r=getDay(currentDate);
      r.pomodoros=(r.pomodoros||0)+1;
      // 记录专注会话
      r.focusSessions=r.focusSessions||[];
      r.focusSessions.push({id:uid(),startTime:pomoStartTime,duration:pomoDuration,taskText:pomoTaskRef?pomoTaskRef.taskText:"",completed:true});
      pomoTaskRef=null;
      pomoStartTime=null;
      save();
      toast("🍅 番茄完成！休息一下吧");
      updatePomoDisplay();
      render();
      // 播放提示音（简单 beep）
      try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();o.frequency.value=800;o.connect(ac.destination);o.start();setTimeout(()=>{o.stop();ac.close();},300);}catch(e){}
    }else{
      updatePomoDisplay();
    }
  },1000);
}
function pausePomo(){
  if(!pomoRunning)return;
  pomoRunning=false;
  clearInterval(pomoTimer);pomoTimer=null;
  updatePomoDisplay();
}
function resetPomo(){
  pomoRunning=false;
  clearInterval(pomoTimer);pomoTimer=null;
  pomoRemain=pomoDuration;
  pomoTaskRef=null;
  pomoStartTime=null;
  updatePomoDisplay();
}
function setPomoDuration(sec){
  pomoDuration=sec;
  if(!pomoRunning){pomoRemain=sec;updatePomoDisplay();}
  render();
}

/* ============== 冥想/呼吸计时器 ============== */
let medDuration=300;      // 总时长秒数，默认5分钟
let medRemain=300;        // 剩余秒数
let medRunning=false;     // 是否运行
let medTimer=null;        // setInterval ID
let medBreathPhase=0;     // 0=吸气4s 1=憋气7s 2=呼气8s
let medBreathTimer=null;  // 呼吸阶段计时器
let medStartTime=null;     // 开始时间
function fmtMedTime(s){const m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;}
function breathPhaseLabel(p){return ["吸气","憋气","呼气"][p]||"";}
function breathPhaseDuration(p){return [4,7,8][p]||4;}
function updateMeditateDisplay(){
  const el=document.getElementById("medDisplay");
  if(el)el.textContent=fmtMedTime(medRemain);
  const status=document.getElementById("medStatus");
  if(status)status.textContent=medRunning?"跟随节奏呼吸…":"选一个时长，开始放松";
  const startBtn=document.getElementById("medStart");
  const stopBtn=document.getElementById("medStop");
  if(startBtn&&stopBtn){
    startBtn.style.display=medRunning?"none":"inline-block";
    stopBtn.style.display=medRunning?"inline-block":"none";
  }
}
function updateBreathPhase(){
  const circle=document.getElementById("breathCircle");
  if(!circle)return;
  const phase=medBreathPhase;
  circle.className="breath-circle "+["inhale","hold","exhale"][phase];
  const text=circle.querySelector(".breath-text");
  const count=circle.querySelector(".breath-count");
  if(text)text.textContent=breathPhaseLabel(phase);
  let remain=breathPhaseDuration(phase);
  if(count)count.textContent=remain;
  // 倒数
  if(medBreathTimer)clearInterval(medBreathTimer);
  medBreathTimer=setInterval(()=>{
    remain--;
    if(remain<=0){
      medBreathPhase=(medBreathPhase+1)%3;
      updateBreathPhase();
    }else{
      if(count)count.textContent=remain;
    }
  },1000);
}
function startMeditate(){
  if(medRunning)return;
  if(medRemain<=0)medRemain=medDuration;
  medStartTime=new Date().toISOString();
  medRunning=true;
  medBreathPhase=0;
  updateMeditateDisplay();
  updateBreathPhase();
  medTimer=setInterval(()=>{
    medRemain--;
    if(medRemain<=0){
      stopMeditate(true);
    }else{
      updateMeditateDisplay();
    }
  },1000);
}
function stopMeditate(completed){
  medRunning=false;
  clearInterval(medTimer);medTimer=null;
  clearInterval(medBreathTimer);medBreathTimer=null;
  // 记录到健康数据
  if(completed&&medStartTime){
    const h=getDay(currentDate).health;
    h.meditation=h.meditation||[];
    h.meditation.push({id:uid(),startTime:medStartTime,duration:medDuration,completed:true});
    // 也勾选健康-运动签到
    const r=getDay(currentDate);
    r.checks["健康-运动"]=true;
    save();
    toast("🧘 冥想完成 "+Math.round(medDuration/60)+" 分钟，身心放松");
  }
  medRemain=medDuration;
  medBreathPhase=0;
  const circle=document.getElementById("breathCircle");
  if(circle){circle.className="breath-circle";}
  updateMeditateDisplay();
  if(completed)render();
}
function setMedDuration(sec){
  medDuration=sec;
  if(!medRunning){medRemain=sec;updateMeditateDisplay();}
  render();
}

/* ============== Toast ============== */
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("hidden"),2200);}

/* ============== 全局 ============== */
function bind(){
 document.getElementById("scroll").addEventListener("click",onClick);
 document.getElementById("scroll").addEventListener("input",onInput);
 document.getElementById("scroll").addEventListener("change",onChange);
 document.getElementById("scroll").addEventListener("keydown",onKey);
 document.getElementById("checkinBtn").addEventListener("click",()=>{
   getDay(currentDate).checkIn=true;save();render();
   toast("已签到 ✓ 连续 +1 天");
 });
 document.getElementById("sbNav").addEventListener("click",e=>{
  const t=e.target.closest("[data-nav]");if(!t)return;
  activeNav=t.dataset.nav;activeTool=null;render();
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sbOverlay").classList.remove("show");
 });
 document.querySelectorAll("[data-top]").forEach(el=>el.addEventListener("click",()=>{
  const a=el.dataset.top;
  if(a==="search")openSearch("");
  else if(a==="data")openData();
  else if(a==="theme")toggleTheme();
  else if(a==="palette")openPalette();
  else if(a==="voice")toggleVoice();
  else if(a==="refresh"){
    // 按钮转圈反馈
    el.style.transition="transform .6s";
    el.style.transform="rotate(360deg)";
    setTimeout(()=>{el.style.transform="";},600);
    // 注销 Service Worker 缓存后强制刷新（拉最新版本）
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(regs=>{
        Promise.all(regs.map(r=>r.unregister())).then(()=>location.reload(true));
      });
    }else{
      location.reload(true);
    }
  }
 }));
 document.getElementById("mobBtn").onclick=()=>{
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("sbOverlay").classList.toggle("show");
 };
 document.getElementById("sbOverlay").onclick=()=>{
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("sbOverlay").classList.remove("show");
 };
 document.getElementById("searchClose").onclick=closeSearch;
 document.getElementById("searchOverlay").onclick=e=>{if(e.target.id==="searchOverlay")closeSearch();};
 document.getElementById("searchInput").addEventListener("input",debounce(runSearch,150));
 document.getElementById("paletteClose").onclick=()=>document.getElementById("paletteOverlay").classList.add("hidden");
 document.getElementById("paletteOverlay").onclick=e=>{if(e.target.id==="paletteOverlay")e.target.classList.add("hidden");};
 document.getElementById("dataClose").onclick=()=>document.getElementById("dataOverlay").classList.add("hidden");
 document.getElementById("dataOverlay").onclick=e=>{if(e.target.id==="dataOverlay")e.target.classList.add("hidden");};
 document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="k"){e.preventDefault();openSearch("");}
  if(e.key==="Escape"){closeSearch();document.getElementById("dataOverlay").classList.add("hidden");document.getElementById("paletteOverlay").classList.add("hidden");document.getElementById("sidebar").classList.remove("open");document.getElementById("sbOverlay").classList.remove("show");}
 });
}

/* ============== 启动 ============== */
async function init(){
 try{
  load();
  // 打开 IndexedDB 并尝试恢复（如果 localStorage 丢失）
  await openIDB();
  if(idbDB && !localStorage.getItem(STORE_KEY)){
    const restored=await tryRestoreFromIDB();
    if(restored)toast("已从 IndexedDB 恢复数据");
  }
  // 修补可能缺失的倒计时默认
  if(!state.countdowns||state.countdowns.length===0){
   state.countdowns=[
    {id:"cd1",name:"本周复盘（每周六）",date:nextSaturdayISO(),createdAt:Date.now()},
    {id:"cd2",name:"2027 年",date:"2027-01-01",createdAt:Date.now()}
   ];
  }
  applyTheme();
  render();
  bind();
  // 初始化生命之树
  updateTreeData();
  // 初始化推送提醒
  setTimeout(()=>{try{initNotifications();}catch(e){}},2000);
  // 异步获取天气（不阻塞渲染）
  setTimeout(()=>{try{fetchWeather().then(w=>{if(w)render();});}catch(e){}},1500);
  // 每分钟刷新一次问候/连续打卡
  setInterval(()=>{renderTop();},60000);
  // 启动时检查是否需要自动备份
  setTimeout(()=>{try{autoBackupCheck();}catch(e){}},3000);
 // 注册 Service Worker（file:// 协议下不会注册，安全失败）
 if("serviceWorker" in navigator){
   try{
     navigator.serviceWorker.register("service-worker.js").then((reg)=>{
       reg.addEventListener("updatefound",()=>{
         const newWorker=reg.installing;
         if(newWorker){
           newWorker.addEventListener("statechange",()=>{
             if(newWorker.state==="installed" && navigator.serviceWorker.controller){
               if(confirm("发现新版本，是否立即刷新？"))location.reload();
             }
           });
         }
       });
     }).catch(()=>{});
   }catch(e){}
 }
 }catch(err){
  const sa=document.getElementById("scroll");
  const msg=(err&&err.stack)?(err.stack):String(err);
  if(sa)sa.innerHTML=`<div class="card"><h3 style="margin:0 0 8px;color:var(--warn)">⚠️ 启动失败</h3><pre style="white-space:pre-wrap;color:var(--ink-2);font-size:12.5px;line-height:1.6">${esc(msg||"未知错误")}\n\nUA：${esc(navigator.userAgent.slice(0,90))}</pre><button class="btn" style="margin-top:12px" onclick="location.reload()">重新加载</button></div>`;
  console.error("[init] failed:",err);
 }
}
window.addEventListener("error",function(e){
 const sa=document.getElementById("scroll");
 const m=(e&&(e.message||(e.error&&e.error.message)))||"未知错误";
 const where=(e&&e.filename?" · "+e.filename+":"+e.lineno+":"+e.colno:"");
 if(sa)sa.innerHTML=`<div class="card"><h3 style="margin:0 0 8px;color:var(--warn)">⚠️ 运行出错</h3><pre style="white-space:pre-wrap;color:var(--ink-2);font-size:12.5px;line-height:1.6">${esc(m)}${esc(where)}\n\nUA：${esc(navigator.userAgent.slice(0,90))}</pre><button class="btn" style="margin-top:12px" onclick="location.reload()">重新加载</button></div>`;
});
window.addEventListener("unhandledrejection",function(e){
 console.error("[unhandledrejection]",e.reason);
});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
