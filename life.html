/* === 年度回顾 yearreview 模块样式 === */
.yr-pad{padding:2px;}
.yr-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.yr-head h2{font-size:24px;margin:0;color:var(--ink);font-weight:700;letter-spacing:.5px;}
.yr-head .yr-sub{font-size:12px;color:var(--muted);margin-top:4px;}
.yr-ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.yr-ctrls select{max-width:150px;}
.yr-ctrls .btn-ghost:disabled{opacity:.4;cursor:not-allowed;}

.yr-summary{font-size:15px;line-height:1.75;color:var(--ink-2);margin:0;}
.yr-summary b{color:var(--ink);}

.yr-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:12px;margin-bottom:14px;}
.dash-stat{
  background:var(--glass-bg);border:1px solid var(--glass-border);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.2);-webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.2);
  border-radius:var(--radius);padding:14px;text-align:center;
  box-shadow:var(--glass-shadow),var(--glass-inset);
  transition:transform .18s ease,box-shadow .18s ease;
}
.dash-stat:hover{transform:translateY(-2px);box-shadow:var(--shadow-md),var(--glass-inset);}
.dash-stat .ds-ico{font-size:18px;line-height:1;}
.dash-stat .ds-num{font-size:27px;font-weight:800;color:var(--ink);margin:5px 0 2px;letter-spacing:-.5px;}
.dash-stat .ds-label{font-size:12px;color:var(--muted);}

.yr-card-title{font-size:16px;font-weight:700;color:var(--ink);margin:0 0 8px;display:flex;align-items:center;gap:6px;}

.yr-ot-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2);}
.yr-ot-item:last-child{border-bottom:none;}
.yr-ot-date{font-weight:800;color:var(--warm);min-width:44px;font-size:13px;line-height:1.5;}
.yr-ot-icon{font-size:16px;line-height:1.5;}
.yr-ot-body{flex:1;min-width:0;}
.yr-ot-text{font-size:14px;color:var(--ink-2);line-height:1.5;word-break:break-word;}
.yr-ot-text.quote{border-left:3px solid var(--warm-soft);padding-left:8px;color:var(--ink-2);font-style:italic;}
.yr-ot-sub{font-size:13px;color:var(--muted);}
.yr-ot-mood{font-size:12px;color:var(--muted);margin-left:6px;}

.li-row{display:flex;gap:9px;align-items:baseline;padding:7px 0;font-size:14px;color:var(--ink-2);border-bottom:1px dashed var(--line-2);}
.li-row:last-child{border-bottom:none;}
.li-dot{font-size:14px;flex-shrink:0;}
.li-row .yr-meta{color:var(--muted);font-size:12.5px;margin-left:auto;white-space:nowrap;}
.yr-empty{color:var(--muted);text-align:center;padding:22px;font-size:13.5px;}
.yr-hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:680px){.yr-hl-grid{grid-template-columns:1fr;}}
.empty{color:var(--muted);text-align:center;padding:22px;font-size:13.5px;}

@media(prefers-reduced-motion:reduce){
  .dash-stat,.dash-stat:hover{transition:none;transform:none;}
}
body[data-theme="dark"] .dash-stat{background:rgba(255,255,255,.04);}
/* === MODULE CSS: heatmap === */
.hm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.hm-year{font-size:18px;font-weight:700;color:var(--ink);}
.hm-nav{display:flex;align-items:center;gap:8px;}
.hm-nav .btn-ghost:disabled{opacity:.4;cursor:not-allowed;}
.hm-stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.hm-stat{background:var(--card-soft);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--muted);min-width:96px;}
.hm-stat b{display:block;font-size:18px;color:var(--ink);font-weight:700;margin-top:2px;}
.hm-wrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;}
.hm-days{display:grid;grid-template-rows:repeat(7,11px);gap:3px;font-size:9px;color:var(--muted);align-content:start;padding-top:0;}
.hm-days span{height:11px;line-height:11px;display:flex;align-items:center;}
.hm-main{flex:1;min-width:0;}
.hm-months{position:relative;height:16px;margin-bottom:4px;}
.hm-months span{position:absolute;top:0;font-size:10px;color:var(--muted);white-space:nowrap;}
.hm-grid{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:3px;}
.hm-cell{width:11px;height:11px;border-radius:3px;background:var(--line);cursor:default;transition:transform .12s ease;}
.hm-cell.in{cursor:pointer;}
.hm-cell.in:hover{transform:scale(1.3);outline:1px solid var(--warm);}
.hm-cell.l0,.hm-legend .sq.l0{background:var(--line);}
.hm-cell.l1,.hm-legend .sq.l1{background:color-mix(in srgb,var(--good) 15%,transparent);}
.hm-cell.l2,.hm-legend .sq.l2{background:color-mix(in srgb,var(--good) 35%,transparent);}
.hm-cell.l3,.hm-legend .sq.l3{background:color-mix(in srgb,var(--good) 60%,transparent);}
.hm-cell.l4,.hm-legend .sq.l4{background:color-mix(in srgb,var(--good) 90%,transparent);}
.hm-cell.out{background:transparent;}
.hm-legend{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--muted);}
.hm-legend .sq{width:11px;height:11px;border-radius:3px;}
.hm-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px;}
.hm-chip{font-size:12px;padding:4px 12px;border-radius:999px;background:var(--card-soft);border:1px solid var(--line);color:var(--ink-2);cursor:pointer;transition:all .15s;white-space:nowrap;}
.hm-chip:hover{border-color:var(--warm);}
.hm-chip.active{background:var(--warm);border-color:var(--warm);color:#fff;font-weight:600;}
@media (prefers-reduced-motion:reduce){
  .hm-cell{transition:none;}
  .hm-cell.in:hover{transform:none;}
}
/* === MODULE CSS: tomgarden === */
.tg-stats{display:flex;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.tg-stat{flex:1 1 130px;background:var(--card-soft,var(--card));border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tg-stat .v{font-size:26px;font-weight:700;color:var(--ink);line-height:1.1}
.tg-stat .l{font-size:12px;color:var(--muted);margin-top:4px}

.tg-garden{width:100%;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.tg-svg{display:block;width:100%;height:auto}

/* 花园画面（所有颜色走 CSS 变量，明暗主题自适应） */
.tg-sky{fill:var(--card)}
.tg-sun{fill:var(--warm);opacity:.40}
.tg-sun2{fill:var(--warm);opacity:.60}
.tg-ground{fill:var(--line);opacity:.40}
.tg-grass{fill:var(--good);opacity:.55}
.tg-empty{fill:var(--muted);font-size:16px}

/* 植物 */
.tg-stem{stroke:var(--good);stroke-width:2.4;stroke-linecap:round;fill:none}
.tg-leaf{fill:var(--good);opacity:.92}
.tg-blossom{fill:var(--good)}
.tg-c0 .tg-blossom{fill:var(--good)}
.tg-c1 .tg-blossom{fill:var(--warm)}
.tg-c2 .tg-blossom{fill:var(--accent)}
.tg-center{fill:var(--card)}

/* 轻微摇曳（尊重 prefers-reduced-motion） */
.tg-plant{transform-box:fill-box;transform-origin:50% 100%;animation:tgSway 4s ease-in-out infinite}
@keyframes tgSway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
@media (prefers-reduced-motion:reduce){.tg-plant{animation:none}}

.tg-note{font-size:12px;color:var(--muted);align-self:center;margin-left:4px}
/* === MODULE CSS: spaced === */
.spaced-wrap{display:block;}
.view-pad{padding:2px 0;}
.view-head{margin-bottom:14px;}
.view-title{font-size:24px;font-weight:700;color:var(--ink);margin:0 0 6px;letter-spacing:-.5px;line-height:1.2;}
.view-desc{font-size:13px;color:var(--muted);line-height:1.6;margin:0;}

/* 统计条 */
.sr-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0;}
.dash-stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:14px 10px;text-align:center;transition:background .2s ease,border-color .2s ease;
}
.dash-stat .ds-num{font-size:28px;font-weight:800;color:var(--ink);line-height:1.1;}
.dash-stat .ds-label{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.5px;}
.dash-stat.s-due .ds-num{color:var(--warn);}
.dash-stat.s-master .ds-num{color:var(--good);}

/* 顶部操作行 */
.sr-topbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}

/* 复习卡 */
.sr-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.sr-card .sr-kind{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;
  padding:2px 8px;border-radius:999px;margin-bottom:10px;
  background:var(--bg);color:var(--muted);border:1px solid var(--line);
}
.sr-card.k-memo .sr-kind{color:var(--warm);}
.sr-card.k-quote .sr-kind{color:var(--accent);}
.sr-card.k-note  .sr-kind{color:var(--good);}
.sr-front{font-size:17px;line-height:1.6;color:var(--ink);font-weight:600;word-break:break-word;}
.sr-back{
  font-size:15px;line-height:1.7;color:var(--ink);margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--line);white-space:pre-wrap;word-break:break-word;
  animation:srFade .25s ease;
}
.sr-meta{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6;}
.sr-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.sr-grade-good{background:var(--good);border-color:var(--good);color:#fff;}
.sr-grade-bad{background:transparent;border:1px solid var(--warn);color:var(--warn);}

/* 进度/空状态 */
.sr-progress{font-size:12px;color:var(--muted);margin-bottom:8px;}
.sr-empty{
  text-align:center;padding:34px 16px;color:var(--muted);
  background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);
}
.sr-empty .big{font-size:18px;color:var(--ink);font-weight:700;margin-bottom:6px;}

/* 卡列表 */
.sr-list{margin-top:6px;}
.sr-row{
  display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);
  font-size:13px;
}
.sr-row:last-child{border-bottom:none;}
.sr-row .sr-row-main{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);}
.sr-row .sr-box{
  flex:none;font-size:11px;font-weight:700;color:var(--muted);
  background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;
}
.sr-row .sr-box.mastered{color:var(--good);border-color:var(--good);}
.sr-row .sr-row-next{flex:none;font-size:11px;color:var(--faint);min-width:64px;text-align:right;}

@keyframes srFade{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){
  .sr-back{animation:none;}
  .dash-stat,.sr-card{transition:none;}
  *{scroll-behavior:auto;}
}
/* === MODULE CSS: remind === */
/* 提醒中心模块样式：全部使用主题变量，尊重 prefers-reduced-motion */
.rm-hint{line-height:1.45;}
.rm-toggle{cursor:pointer;}
.rm-list-empty{
  padding:18px 14px;text-align:center;color:var(--muted);
  background:var(--card-soft);border:1px dashed var(--line);border-radius:12px;
  font-size:13px;
}
#rmInt,#rmDate{transition:opacity .15s ease;}
.remind-card input.tl-input,.remind-card select.tl-input{
  transition:border-color .15s ease,background .15s ease;
}
@media (prefers-reduced-motion: reduce){
  #rmInt,#rmDate,.remind-card input.tl-input,.remind-card select.tl-input,.btn,.btn-ghost{
    transition:none !important;
  }
}
/* === MODULE CSS: graph === */
.graph-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 0 14px;}
.graph-legend{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.graph-legend .lg-line{display:inline-block;width:22px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;}
.graph-svg-wrap{width:100%;overflow:hidden;}
.graph-svg{display:block;width:100%;height:auto;max-height:78vh;touch-action:manipulation;}
.graph-node{cursor:default;}

/* === MODULE CSS: shopping === */
.shop-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.shop-tab{padding:6px 14px;border-radius:999px;font-size:13px;background:var(--card-soft);color:var(--ink-2);cursor:pointer;border:1px solid var(--line);}
.shop-tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.shop-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line-2);}
.shop-item:last-child{border-bottom:none;}
.shop-cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:13px;color:transparent;}
.shop-cb.on{background:var(--good);border-color:var(--good);color:#fff;}
.shop-name{flex:1;font-size:14px;}
.shop-item.done .shop-name{text-decoration:line-through;color:var(--muted);}
.shop-qty{font-size:12px;color:var(--muted);background:var(--card-soft);padding:2px 8px;border-radius:999px;}
.shop-del{font-size:16px;color:var(--muted);cursor:pointer;width:24px;text-align:center;}
.shop-del:active{color:var(--warn);}
.shop-add{display:flex;gap:8px;margin-bottom:14px;}
.shop-add input{flex:1;}
.shop-empty{text-align:center;color:var(--muted);padding:30px 0;font-size:13px;}

/* === MODULE CSS: body === */
.body-metric-input{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.body-chart-box{background:var(--card-soft);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
.body-latest{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin-bottom:14px;}
.body-latest-item{background:var(--card-soft);border-radius:var(--radius);padding:12px;text-align:center;}
.body-latest-item .v{font-size:20px;font-weight:700;color:var(--ink);}
.body-latest-item .l{font-size:11px;color:var(--muted);margin-top:2px;}
.body-latest-item .d{font-size:10px;color:var(--faint);margin-top:2px;}
.body-history-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px;}
.body-history-row:last-child{border-bottom:none;}
.graph-node circle{transition:r .18s ease, stroke-width .18s ease, opacity .18s ease; transform-box:fill-box; transform-origin:center;}
.graph-node:hover circle{stroke-width:3.5; opacity:1;}
.graph-label{font-size:13px;font-weight:600;fill:var(--ink);pointer-events:none;user-select:none;}
.graph-count{font-size:11px;font-weight:700;fill:var(--muted);}
.graph-edge,.graph-edge-dyn{transition:opacity .18s ease;}
.graph-note{margin-top:10px;font-size:12px;color:var(--muted);}
@media (prefers-reduced-motion: reduce){
  .graph-node circle,.graph-edge,.graph-edge-dyn{transition:none;}
}

/* === MODULE CSS: 工具箱 / 备工作台 === */
.tb-search{position:relative;margin:8px 0 4px;}
.tb-search .tb-s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.6;pointer-events:none;}
.tb-search input{width:100%;padding:12px 16px 12px 38px;border-radius:999px;border:1px solid var(--line-2);
  background:var(--card-soft);font-size:15px;color:var(--ink);outline:none;box-shadow:var(--shadow-sm);}
.tb-search input:focus{border-color:var(--warm);box-shadow:0 0 0 3px var(--warm-soft);}
.tb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
@media(min-width:560px){.tb-grid{grid-template-columns:repeat(3,1fr);}}
.tb-item{position:relative;}
.tb-card{display:block;background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;
  text-decoration:none;color:var(--ink);transition:.15s;box-shadow:var(--shadow-sm);}
.tb-card:hover{transform:translateY(-2px);border-color:var(--warm);box-shadow:0 6px 18px rgba(150,110,70,.18);}
.tb-card .tb-n{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;padding-right:22px;}
.tb-card .tb-u{font-size:11px;color:var(--muted);margin-top:3px;word-break:break-all;}
.tb-card .tb-d{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45;}
.tb-tag{font-size:10px;background:var(--warm-soft);color:var(--warm);border-radius:6px;padding:1px 6px;font-weight:600;white-space:nowrap;}
.tb-fav{position:absolute;top:8px;right:8px;width:26px;height:26px;border:none;border-radius:50%;
  background:var(--card-soft);color:var(--faint);font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;z-index:2;}
.tb-fav:hover{background:var(--warm-soft);color:var(--warm);}
.tb-fav.on{color:#F5A623;background:var(--warm-soft);}
.tb-fav-empty{font-size:13px;color:var(--muted);background:var(--card-soft);border-radius:12px;padding:14px 16px;line-height:1.6;}
/* 主页快捷条 */
.tb-quick .tb-q-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center;}
.tb-q{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;
  background:var(--card-soft);border:1px solid var(--line-2);text-decoration:none;color:var(--ink);
  font-size:13.5px;font-weight:600;transition:.15s;box-shadow:var(--shadow-sm);}
.tb-q:hover{transform:translateY(-2px);border-color:var(--warm);color:var(--warm);}
.tb-q-more{margin-left:auto;padding:9px 14px;border-radius:999px;border:1px dashed var(--warm);
  background:transparent;color:var(--warm);font-size:13px;font-weight:600;cursor:pointer;}
.tb-q-more:hover{background:var(--warm-soft);}

</style>
</head>

function fmtDate(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${dd}`;}
function fmtMonth(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function parseDate(s){const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);}
function addDays(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);}

 d.setDate(d.getDate()+add);return fmtDate(d);

function debounce(fn,ms){let t;return function(){clearTimeout(t);const a=arguments,c=this;t=setTimeout(()=>fn.apply(c,a),ms);};}
function setPath(o,path,v){const p=path.split(".");let x=o;for(let i=0;i<p.length-1;i++){if(x[p[i]]==null)x[p[i]]={};x=x[p[i]];}x[p[p.length-1]]=v;}

/* ============== 持久化 ============== */
/* IndexedDB 作为备份副本：localStorage 是主存储（同步快），IndexedDB 容量大（几十MB）做安全网 */
let idbDB=null;
function openIDB(){
  return new Promise((resolve)=>{
    if(!window.indexedDB){resolve(null);return;}
    try{
      const req=indexedDB.open("life_workbench",1);
      req.onupgradeneeded=(e)=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");
      };
      req.onsuccess=(e)=>{idbDB=e.target.result;resolve(idbDB);};
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}
function idbSet(key,val){
  if(!idbDB)return;
  try{
    const tx=idbDB.transaction("kv","readwrite");
    tx.objectStore("kv").put(val,key);
  }catch(e){}
}
function idbGet(key){
  return new Promise((resolve)=>{
    if(!idbDB){resolve(null);return;}
    try{
      const tx=idbDB.transaction("kv","readonly");
      const req=tx.objectStore("kv").get(key);
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}
let _saveTimer=null;
function save(immediate){
  // 非立即保存时使用防抖：合并 200ms 内的多次调用
  if(!immediate){
    if(_saveTimer)return;
    _saveTimer=setTimeout(()=>{_saveTimer=null;_doSave();},200);
    return;
  }
  clearTimeout(_saveTimer);_saveTimer=null;
  _doSave();
}
function _doSave(){
  try{
    state._savedAt=Date.now(); // 记录本地最后保存时间，供云同步冲突检测
    const json=JSON.stringify(state);
    localStorage.setItem(STORE_KEY,json);
    idbSet("state",json); // 异步备份到 IndexedDB
  }catch(e){
    // localStorage 满了，尝试只用 IndexedDB
    try{idbSet("state",JSON.stringify(state));toast("存储空间告急，已备份到 IndexedDB");}catch(e2){toast("保存失败：空间已满");}
  }
  bumpDataVersion();
  // 自动云同步：保存后 30 秒防抖推送（iOS 后台会挂起定时器，pagehide 时兜底补全）
  if(settings.cloud&&settings.cloud.autoSync&&settings.githubToken){
    scheduleCloudPush();
  }
}

function streakDays(){

  return n;

/* 历史最长连续打卡 */
function longestStreak(){
  const dates=Object.keys(state.entries).filter(k=>state.entries[k].checkIn).sort();
  if(!dates.length)return 0;
  let max=1,cur=1;
  for(let i=1;i<dates.length;i++){
    if(dates[i]===addDays(dates[i-1],1)){cur++;if(cur>max)max=cur;}
    else cur=1;
  }
  return max;
}
/* 本周打卡数据 (周一到周日) */
function weekRange(ref){
  const d=ref?parseDate(ref):new Date();
  const w=d.getDay();const offset=(w===0?6:w-1);
  const monday=new Date(d);monday.setDate(d.getDate()-offset);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  return {start:fmtDate(monday),end:fmtDate(sunday)};
}
function weekKey(ref){
  const r=weekRange(ref);
  return r.start.slice(0,4)+"-W"+weekNum(ref);
}
function weekNum(ref){
  const r=weekRange(ref);
  const startMs=parseDate(r.start).getTime();
  const yearStart=new Date(parseDate(r.start).getFullYear(),0,1);
  const firstMonday=new Date(yearStart);
  const fw=yearStart.getDay();const fo=(fw===0?6:fw-1);
  firstMonday.setDate(yearStart.getDate()-fo);
  return Math.floor((startMs-firstMonday.getTime())/86400000/7)+1;
}
/* 本周打卡明细 */
function weekStats(ref){
  const r=weekRange(ref);
  const days=[];
  for(let i=0;i<7;i++){
    const ds=addDays(r.start,i);
    const e=state.entries[ds];
    days.push({date:ds,checkIn:!!(e&&e.checkIn),hasData:!!e});
  }
  const checked=days.filter(d=>d.checkIn).length;
  return {days,checked,total:7,range:r};
}

/* 月度汇总：学习时长 / 收支 / 打卡天数 */
function monthSummary(year,month){
  const prefix=fmtMonth(new Date(year,month,1))+"-";
  let vocal=0,piano=0,english={words:0,read:0,listen:0};
  let inSum=0,outSum=0,checkinDays=0;
  let tasksDone=0,tasksTotal=0;
  Object.keys(state.entries).filter(k=>k.startsWith(prefix)).forEach(k=>{
    const e=state.entries[k];
    if(e.checkIn)checkinDays++;
    if(e.study){
      vocal+=+(e.study.vocal&&e.study.vocal.vocal_time)||0;
      /* 钢琴为文本记录（技术进展），不计入分钟数 */
      if(e.study.english){
        english.words+=+e.study.english.en_words||0;
        english.read+=+e.study.english.en_read||0;
        english.listen+=+e.study.english.en_listen||0;
      }
    }
    if(e.finance){
      (e.finance.in||[]).forEach(x=>inSum+=+x.amount||0);
      (e.finance.out||[]).forEach(x=>outSum+=+x.amount||0);
    }
    if(e.tasks){tasksDone+=e.tasks.filter(t=>t.done).length;tasksTotal+=e.tasks.length;}
  });
  return {vocal,english,inSum:round2(inSum),outSum:round2(outSum),checkinDays,tasksDone,tasksTotal,prefix};
}
/* 联系人关系健康度评分（0-100） */
function contactHealthScore(c){
  const interactions=c.interactions||[];
  const today=fmtDate(new Date());
  if(!interactions.length){
    const days=c.time?diffDays(c.time,today):9999;
    if(days>180)return 10;
    if(days>90)return 30;
    if(days>60)return 50;
    if(days>30)return 70;
    return 85;
  }
  const sorted=interactions.map(i=>({...i,days:diffDays(i.date,today)})).sort((a,b)=>a.days-b.days);
  const lastDays=sorted[0].days;
  const count30d=sorted.filter(i=>i.days<=30).length;
  const avgFeeling=interactions.reduce((s,i)=>s+(i.feeling||3),0)/interactions.length;
  let score=50;
  if(lastDays<=7)score+=20;
  else if(lastDays<=30)score+=10;
  else if(lastDays<=60)score+=0;
  else if(lastDays<=90)score-=15;
  else score-=30;
  score+=Math.min(20,count30d*5);
  score+=(avgFeeling-3)*5;
  return Math.max(0,Math.min(100,Math.round(score)));
}

/* 关系冷联系检测：返回超 N 天未联系的联系人 */
function coldContacts(threshold){
  threshold=threshold||30;
  const today=fmtDate(new Date());
  return state.contacts.map(c=>{
    const interactions=c.interactions||[];
    const sorted=interactions.slice().sort((a,b)=>b.date.localeCompare(a.date));
    const lastDate=sorted.length?sorted[0].date:(c.time||"");
    const days=lastDate?diffDays(lastDate,today):9999;
    return Object.assign({},c,{daysSince:days});
  }).filter(c=>c.daysSince>=threshold).sort((a,b)=>b.daysSince-a.daysSince);
}
/* ============== 今日提醒引擎：扫描所有模块，主动推送待处理项 ============== */
function dailyAlerts(){

  state.projects.forEach(p=>{

  if(!r.checkIn&&total-dn>=5)alerts.push({icon:"✅",text:`今日还有 ${total-dn} 项习惯未打卡`,action:"home"});
  // 6. 胶囊开启 / 临近开启
  state.capsules.forEach(c=>{

    else{const dd=diffDays(today,c.unlockDate);if(dd>0&&dd<=3)alerts.push({icon:"🔜",text:`时光胶囊「${c.title}」还有 ${dd} 天开启`,action:"capsule"});}
  });

  if(shouldRemindBackup())alerts.push({icon:"💾",text:"已超 7 天未备份数据，建议导出一份",action:null});
  return alerts;
}
/* 自动生成周复盘草稿 */
function generateWeekReview(ref){
  const ws=weekStats(ref);
  const ms=monthSummary(parseDate(weekRange(ref).start).getFullYear(),parseDate(weekRange(ref).start).getMonth());
  const r=weekRange(ref);
  const prefix=r.start.slice(0,7);
  // 收集本周八问和复盘文本
  let allQ={},allReview=[];
  for(let i=0;i<7;i++){
    const ds=addDays(r.start,i);
    const e=state.entries[ds];
    if(!e)continue;
    if(e.questions)Object.keys(e.questions).forEach(k=>{if(e.questions[k])allQ[k]=(allQ[k]||[]).concat([e.questions[k]]);});
    if(e.review&&e.review.text)allReview.push({date:ds,text:e.review.text});
  }
  // 关键词提取（简单：取所有复盘文本中出现≥2次的2-4字词）
  const corpus=allReview.map(r=>r.text).join(" ");
  const keywords=extractKeywords(corpus);
  // 联系人本周互动
  const weekContacts=state.contacts.filter(c=>c.time&&c.time>=r.start&&c.time<=r.end);
  return {
    range:r,checkinDays:ws.checked,
    vocalMinutes:ms.vocal,englishWords:ms.english.words,
    inSum:ms.inSum,outSum:ms.outSum,
    tasksDone:ms.tasksDone,tasksTotal:ms.tasksTotal,
    reviews:allReview,keywords,
    contactsCount:weekContacts.length,
    weekKey:weekKey(ref)
  };
}
function extractKeywords(text){
  if(!text)return[];
  const freq={};
  // 简单二元/三元词频
  for(let n=2;n<=4;n++){
    for(let i=0;i<=text.length-n;i++){
      const w=text.slice(i,i+n);
      if(/^[\u4e00-\u9fa5]{2,4}$/.test(w)){freq[w]=(freq[w]||0)+1;}
    }
  }
  return Object.keys(freq).filter(k=>freq[k]>=2).sort((a,b)=>freq[b]-freq[a]).slice(0,8);
}
/* 备份提醒：每 7 天提醒一次 */

  const now=Date.now();
  if(now-settings.lastBackupRemind>7*86400000)return true;
  return false;
}

/* ============== 全局快速录入：自然语言解析 ============== */
function parseQuickCapture(raw){
  const text=raw.trim();
  if(!text)return null;
  const r=getDay(currentDate);

  // 1. 支出：包含 ¥ 或 元 或 纯数字开头的消费关键词
  //    "买咖啡 28" / "午餐 ¥35" / "打车 18元"
  const moneyMatch=text.match(/^(.+?)[\s]*[¥￥]?\s*(\d+(?:\.\d+)?)\s*元?$/);
  if(moneyMatch&&(text.match(/买|花|餐|咖啡|打车|地铁|外卖|超市|购物|票|费|充值|订阅/) || text.match(/[¥￥]/))){
    const cat=guessExpenseCategory(moneyMatch[1]);
    r.finance.out.push({cat:cat,amount:moneyMatch[2],date:currentDate});
    return {mod:"支出",detail:cat+" ¥"+moneyMatch[2],raw:text};
  }

  // 2. 体重：体重/称重 + 数字
  const weightMatch=text.match(/(?:体重|称重|称)\s*(\d+(?:\.\d+)?)\s*(?:kg|公斤|斤)?/);
  if(weightMatch){
    if(!state.metrics[currentDate])state.metrics[currentDate]={};
    state.metrics[currentDate].weight=+weightMatch[1];
    return {mod:"健康",detail:"体重 "+weightMatch[1]+" kg",raw:text};
  }

  // 3. 练声/声乐：包含 练声/声乐 + 时长
  const vocalMatch=text.match(/(?:练声|声乐|气息)\s*(\d+)\s*(?:分钟|分|min)?/);
  if(vocalMatch){
    r.study.vocal=r.study.vocal||{};
    r.study.vocal.vocal_time=vocalMatch[1];
    r.checks["学习-声乐练习"]=true;  // 跨模块联动：同时勾选打卡
    return {mod:"学习",detail:"声乐 "+vocalMatch[1]+" 分钟（已勾选打卡）",raw:text};
  }

  // 4. 钢琴
  const pianoMatch=text.match(/(?:钢琴|琴)\s*(\d+)\s*(?:分钟|分|min)?/);
  if(pianoMatch){
    r.study.piano=r.study.piano||{};
    r.study.piano.piano_song=(r.study.piano.piano_song||"")+pianoMatch[1]+"分钟 ";
    r.checks["学习-钢琴练习"]=true;
    return {mod:"学习",detail:"钢琴 "+pianoMatch[1]+" 分钟（已勾选打卡）",raw:text};
  }

  // 5. 英语单词
  const enMatch=text.match(/(?:英语|单词|背词)\s*(\d+)\s*(?:个|词)?/);
  if(enMatch){
    r.study.english=r.study.english||{};
    r.study.english.en_words=(+r.study.english.en_words||0)+(+enMatch[1]);
    r.checks["学习-英语学习"]=true;
    return {mod:"学习",detail:"英语 "+enMatch[1]+" 个单词（已勾选打卡）",raw:text};
  }

  // 6. 喝水
  if(text.match(/^(?:喝水|饮水|water)\s*(\d+)\s*(?:ml|毫升)?/) || text.match(/^(早起水|上午水|下午水|晚间水)/)){
    const wm=text.match(/(\d+)\s*(?:ml|毫升)?/);
    if(text.includes("早起")){r.health.water.morning=true;return {mod:"健康",detail:"早起水已打卡",raw:text};}
    if(text.includes("上午")){r.health.water.am=true;return {mod:"健康",detail:"上午水已打卡",raw:text};}
    if(text.includes("下午")){r.health.water.noon=true;return {mod:"健康",detail:"下午水已打卡",raw:text};}
    if(text.includes("晚间")){r.health.water.evening=true;return {mod:"健康",detail:"晚间水已打卡",raw:text};}
    if(wm){
      const ml=+wm[1];
      if(ml>=300){r.health.water.morning=true;r.health.water.am=true;}
      else if(ml>=200){r.health.water.morning=true;}
      return {mod:"健康",detail:"饮水 "+ml+"ml（已自动勾选）",raw:text};
    }
  }

  // 7. 联系人："联系 XXX" / "打电话给 XXX"
  const contactMatch=text.match(/(?:联系|打电话给|致电|见)\s*(.+)/);
  if(contactMatch){
    const name=contactMatch[1].trim();
    // 尝试匹配已有联系人
    const existing=state.contacts.find(c=>c.name.includes(name)||name.includes(c.name));
    if(existing){
      existing.time=currentDate;
      existing.interactions=existing.interactions||[];
      existing.interactions.push({id:uid(),date:currentDate,method:"微信",summary:"快速录入",feeling:3});
      return {mod:"关系",detail:"已更新 "+existing.name+"（"+existing.category+"类）的互动时间",raw:text};
    }else{
      // 新建为 B 类（认知型）待分类
      state.contacts.push({id:uid(),category:"B",name:name,note:"",time:currentDate,interactions:[{id:uid(),date:currentDate,method:"微信",summary:"快速录入",feeling:3}]});
      return {mod:"关系",detail:"已新建联系人 "+name+"（B类，可去关系板块调整）",raw:text};
    }
  }

  // 8. 收入："收入 XXX 元" / "收款 XXX"
  const inMatch=text.match(/(?:收入|收款|到账|进账)\s*(\d+(?:\.\d+)?)/);
  if(inMatch){
    r.finance.in.push({source:"快速录入",amount:inMatch[1],date:currentDate});
    return {mod:"资产",detail:"收入 ¥"+inMatch[1],raw:text};
  }

  // 9. 时光胶囊："胶囊 标题 | 内容 | 2027-01-01"
  const capMatch=text.match(/^胶囊\s+(.+?)\s*\|\s*(.+?)\s*\|\s*(\d{4}-\d{2}-\d{2})/);
  if(capMatch){
    state.capsules.push({id:uid(),title:capMatch[1].trim(),text:capMatch[2].trim(),unlockDate:capMatch[3],createdAt:Date.now(),sealed:true});
    return {mod:"胶囊",detail:"已封存，开启于 "+capMatch[3],raw:text};
  }

  // 10. 思考流："记/反思/感悟/思考 ..." —— 一句自由记录汇入思考流
  const reflMatch=text.match(/^(?:记|反思|感悟|思考)[:：]?\s*(.+)/);
  if(reflMatch){
    addReflection(currentDate,{text:reflMatch[1].trim(),mood:""});
    return {mod:"思考",detail:"已记入思考流",raw:text};
  }

  // 11. 读书："读 《XXX》30分钟" / "读书 XXX 60分钟"
  const bookMatch=text.match(/^(?:读书?|阅读|看书)\s*[《\"\'「]?(.+?)[》\"\'」]?\s*(\d+)\s*(?:分钟|分|min)/);
  if(bookMatch){
    const title=bookMatch[1].trim();
    const minutes=+bookMatch[2];
    let book=state.books.find(b=>b.title&&title&&(b.title.includes(title)||title.includes(b.title)));
    if(book){
      if(!book.start)book.start=currentDate;
      book.progress=Math.min(100,(book.progress||0)+Math.round(minutes/30));
      if(book.progress>=100){book.status="done";book.end=currentDate;}
    }else{
      state.books.push({id:uid(),title:title,author:"",status:"reading",progress:Math.min(20,Math.round(minutes/30)),start:currentDate,end:"",note:"快速录入",summary:""});
    }
    r.study.reading=r.study.reading||{minutes:0};
    r.study.reading.minutes=(+r.study.reading.minutes||0)+minutes;
    r.checks["学习-英语学习"]=true;
    return {mod:"学习",detail:`读书《${title}》${minutes}分钟（已勾选打卡）`,raw:text};
  }

  // 12. 跑步/运动："跑步 5km" / "跑步 30分钟" / "运动 1小时"
  const runMatch=text.match(/^(?:跑步|运动|锻炼)\s*(\d+(?:\.\d+)?)\s*(km|公里|分钟|分|小时|h)?/);
  if(runMatch){
    const val=+runMatch[1];
    const unit=runMatch[2]||"分钟";
    const minutes=unit==="小时"||unit==="h"?val*60:(unit==="km"||unit==="公里"?Math.round(val*6):val);
    r.health.exercise=r.health.exercise||{};
    r.health.exercise.type=unit==="km"||unit==="公里"?"跑步":"运动";
    r.health.exercise.minutes=(+r.health.exercise.minutes||0)+minutes;
    r.checks["健康-运动"]=true;
    return {mod:"健康",detail:`运动${minutes}分钟（已勾选打卡）`,raw:text};
  }

  // 13. 睡眠："睡眠 7.5小时" / "睡了 8小时" / "昨晚睡 6h"
  const sleepMatch=text.match(/^(?:睡了?|睡眠|昨晚睡)\s*(\d+(?:\.\d+)?)\s*(?:小时|h|个小时)/);
  if(sleepMatch){
    const hours=+sleepMatch[1];
    r.health.sleep=r.health.sleep||{};
    r.health.sleep.hours=hours;
    if(hours>=7)r.checks["健康-23 点前睡"]=true;
    return {mod:"健康",detail:`睡眠 ${hours} 小时${hours>=7?"（已勾选打卡）":""}`,raw:text};
  }

  // 14. 冥想："冥想 10分钟"
  const medMatch=text.match(/^(?:冥想|静坐|打坐|meditate)\s*(\d+)\s*(?:分钟|分|min)?/);
  if(medMatch){
    const minutes=+medMatch[1];
    r.health.meditation=r.health.meditation||[];
    r.health.meditation.push({id:uid(),startTime:new Date().toISOString(),duration:minutes*60,completed:true,source:"quick"});
    r.checks["健康-运动"]=true;
    return {mod:"健康",detail:`冥想 ${minutes} 分钟（已勾选打卡）`,raw:text};
  }

  // 15. 项目进度："项目 XXX 进度 50%" / "项目 XXX 进度更新 80%"
  const projMatch=text.match(/^项目\s+(.+?)\s*进度\s*(\d+)\s*%/);
  if(projMatch){
    const name=projMatch[1].trim();
    const progress=+projMatch[2];
    let proj=state.projects.find(p=>p.name&&p.name.includes(name));
    if(proj){
      proj.progress=progress;
    }else{
      state.projects.push({id:uid(),name:name,deadline:"",progress:progress,outline:[],goalRef:"",courseRef:"",note:"快速录入",createdAt:Date.now()});
    }
    return {mod:"项目",detail:`项目「${name}」进度更新到 ${progress}%`,raw:text};
  }

  // 16. 情绪记录："😊 今天很开心" / "开心 XXX" / "焦虑 XXX"
  const moodMatch=text.match(/^(?:😊|😄|😁|😃|🙂|😌|😢|😭|😣|😟|😔|😞|😤|😡|🤔|😐|😑)\s*(.+)/) ||
                   text.match(/^(开心|快乐|高兴|兴奋|平静|焦虑|难过|伤心|沮丧|愤怒|压力|幸福|满足)\s*[:：]?\s*(.+)/);
  if(moodMatch){
    const emotionMap={开心:"😊",快乐:"😊",高兴:"😊",兴奋:"😊",幸福:"😊",满足:"😊",平静:"😌",焦虑:"😣",难过:"😢",伤心:"😢",沮丧:"😔",愤怒:"😡",压力:"😟"};
    let mood="";
    let content="";
    if(moodMatch[1]&&/[\u{1F600}-\u{1F6FF}]/u.test(moodMatch[1])){
      mood=moodMatch[1].trim();
      content=moodMatch[2]||"";
    }else{
      mood=emotionMap[moodMatch[1]]||"🙂";
      content=moodMatch[2]||moodMatch[1];
    }
    if(typeof addReflection==="function"){
      addReflection(currentDate,{text:content,mood:mood});
    }else{
      // 退化方案：直接写 state
      state.reflections[currentDate]=state.reflections[currentDate]||[];
      state.reflections[currentDate].push({id:uid(),text:content,mood:mood,tags:[],createdAt:Date.now()});
    }
    return {mod:"思考",detail:`情绪 ${mood} 已记入思考流`,raw:text};
  }

  // 17. 默认：未匹配其它模块 → 归入备忘录（自动归类，贯穿全局）
  const mcls=autoClassifyMemo(text);
  state.memos=state.memos||[];
  state.memos.push({id:uid(),text:text,title:"",cat:mcls.cat,links:mcls.links,pinned:false,done:false,created:Date.now(),linkedNote:null});
  const mc=memoCat(mcls.cat);
  return {mod:"备忘录",detail:mc.ico+" "+mc.l+" · "+text,raw:text};
}

function guessExpenseCategory(text){
  if(text.match(/餐|饭|面|外卖|咖啡|早|午|晚|食/))return "餐饮";
  if(text.match(/车|地铁|公交|打车|出租|滴滴/))return "交通";
  if(text.match(/书|笔|本|文具/))return "学习";
  if(text.match(/超|日用|纸|洗/))return "日用";
  return "其他";
}

function getFocusThree(){
  // 从今天任务里取前 3 条未完成；不够 3 条则从目标里补
  const r=getDay(currentDate);
  let focus=r.focus3||[];
  if(!focus.length){
    // 自动推荐：未完成任务优先
    const undone=r.tasks.filter(t=>!t.done).slice(0,3).map(t=>t.text);
    focus=undone;
  }
  return focus;
}
function setFocusThree(arr){
  const r=getDay(currentDate);
  r.focus3=arr.filter(x=>x&&x.trim());
  save();
}

function applyTheme(){
  document.body.setAttribute("data-theme",settings.theme);
  document.documentElement.setAttribute("data-theme",settings.theme);
  if(settings.palette&&settings.palette!=="default"){
    document.body.setAttribute("data-palette",settings.palette);
    document.documentElement.setAttribute("data-palette",settings.palette);
  }else{
    document.body.removeAttribute("data-palette");
    document.documentElement.removeAttribute("data-palette");
  }
  // 同步底部背景色，防止刷新白边
  var dark=settings.theme==="dark";
  var pal=settings.palette||"default";
  var bgMap={
    "default":dark?"#1A1825":"#E8C8A8",
    "forest":dark?"#0F1810":"#B8D9A8",
    "ocean":dark?"#0F1E30":"#A8C8E8",
    "sunset":dark?"#1A0E08":"#E8B898",
    "lavender":dark?"#0E0A18":"#C8B0E0"
  };
  var bg=bgMap[pal]||(dark?"#1A1825":"#E8C8A8");
  document.documentElement.style.background=bg;
  var m=document.getElementById("meta-theme-color");
  if(m)m.setAttribute("content",bg);
  applyBackground();
}
/* 应用自定义背景（照片图层） */
function applyBackground(){
  var b=settings.bg||{mode:"gradient",sel:-1,blur:6,dim:0.3};
  var layer=document.getElementById("bgLayer");
  var ov=document.getElementById("bgOverlay");
  if(!layer||!ov)return;
  var photo=(b.mode==="photo"&&b.sel>=0&&settings.bgGallery&&settings.bgGallery[b.sel])?settings.bgGallery[b.sel].data:null;
  if(photo){
    layer.style.backgroundImage='url("'+photo+'")';
    layer.style.filter='blur('+(b.blur||0)+'px)';
    ov.style.background='rgba(0,0,0,'+(b.dim!=null?b.dim:0.3)+')';
    document.body.classList.add("bg-photo");
  }else{
    layer.style.backgroundImage="";
    layer.style.filter="";
    ov.style.background="";
    document.body.classList.remove("bg-photo");
  }
}
/* 上传图片压缩为 dataURL（限制尺寸，避免 localStorage 超限） */
function compressImage(file,maxW,quality){
  maxW=maxW||1600;quality=quality==null?0.82:quality;
  return new Promise(function(res,rej){
    try{
      var url=URL.createObjectURL(file);
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        var c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        try{res(c.toDataURL("image/jpeg",quality));}catch(e){res(c.toDataURL());}
      };
      img.onerror=function(){URL.revokeObjectURL(url);rej(e);};
      img.src=url;
    }catch(e){rej(e);}
  });
}

/* ---- 局部更新：喝水进度 ---- */
function updateWaterProgress(){
  const r=getDay(currentDate);
  const w=r.health.water;
  const cups=Object.values(w).filter(v=>v===true).length;
  const ml=cups*250;
  const target=2000;
  const pct=Math.min(100,Math.round(ml*100/target));
  // SVG 圆环
  const svg=document.querySelector(".card svg circle[stroke=\"var(--ink)\"]");
  if(svg){const C=2*Math.PI*80;svg.setAttribute("stroke-dashoffset",C*(1-pct/100));}
  // 数字
  const texts=document.querySelectorAll(".card svg text");
  if(texts.length>=3)texts[1].textContent=ml; // y=120 的数字
  // 还需饮水
  const needEl=document.querySelectorAll(".card div div");
  needEl.forEach(el=>{
    if(el.textContent.includes("还需饮水")&&el.nextElementSibling){
      el.nextElementSibling.innerHTML=`${Math.max(0,target-ml)}<span style="font-size:11px;color:var(--muted)"> ml</span>`;
    }
  });
}

/* ---- 资产 ---- */
function round2(n){return Math.round((n+Number.EPSILON)*100)/100;}
function recalcFinanceBalance(){
  let totalIn=0,totalOut=0;
  Object.values(state.entries).forEach(e=>{
    if(!e||!e.finance)return;
    (e.finance.in||[]).forEach(x=>totalIn+=(+x.amount||0));
    (e.finance.out||[]).forEach(x=>totalOut+=(+x.amount||0));
  });
  state.financeCurrentBalance=round2((state.financeInitialBalance||0)+totalIn-totalOut);
}
function updateFinanceKpi(){
  const r=getDay(currentDate);
  const sumIn=round2((r.finance.in||[]).reduce((a,b)=>a+(+b.amount||0),0));
  const sumOut=round2((r.finance.out||[]).reduce((a,b)=>a+(+b.amount||0),0));
  const todayNet=round2(sumIn-sumOut);
  const curBal=round2(state.financeCurrentBalance||0);
  const balColor=curBal<0?"var(--warn)":(curBal>0?"var(--good)":"var(--ink)");
  const setVal=(id,v)=>{const el=document.getElementById(id);if(el)el.innerHTML=`${v}<span class="unit">¥</span>`;};
  setVal("kpi-in",sumIn);
  setVal("kpi-out",sumOut);
  const netEl=document.getElementById("kpi-net");
  if(netEl){netEl.innerHTML=`${todayNet}<span class="unit">¥</span>`;netEl.style.color=todayNet<0?"var(--warn)":(todayNet>0?"var(--good)":"var(--ink-2)");}
  const balEl=document.getElementById("kpi-bal");
  if(balEl){balEl.innerHTML=`${curBal}<span class="unit">¥</span>`;balEl.style.color=balColor;}
  const rowEl=document.getElementById("cur-bal-row");
  if(rowEl){rowEl.innerHTML=`¥ ${curBal}`;rowEl.style.color=balColor;}
}

  const prefix=fmtMonth(new Date(year,month,1))+"-";
  const catSum={};
  Object.keys(state.entries).filter(k=>k.startsWith(prefix)).forEach(k=>{
    const e=state.entries[k];
    if(e&&e.finance&&e.finance.out){
      e.finance.out.forEach(o=>{
        const cat=o.cat||"其他";
        catSum[cat]=(catSum[cat]||0)+(+o.amount||0);
      });
    }
  });
  return catSum;
}
/* 近N月月末余额趋势 */
function getMonthBalanceHistory(months){
  months=months||6;
  const now=new Date();
  const result=[];
  let runningBalance=state.financeInitialBalance||0;
  for(let i=months-1;i>=0;i--){
    const m=now.getMonth()-i;
    const actualM=((m%12)+12)%12;
    const actualY=now.getFullYear()+Math.floor(m/12);
    const prefix=fmtMonth(new Date(actualY,actualM,1))+"-";
    let monthIn=0,monthOut=0;
    Object.keys(state.entries).filter(k=>k.startsWith(prefix)).forEach(k=>{
      const e=state.entries[k];
      if(e&&e.finance){
        (e.finance.in||[]).forEach(x=>monthIn+=(+x.amount||0));
        (e.finance.out||[]).forEach(x=>monthOut+=(+x.amount||0));
      }
    });
    runningBalance=round2(runningBalance+monthIn-monthOut);
    result.push({label:(actualM+1)+"月",value:runningBalance});
  }
  return result;
}

  if(scope==="week")return weekRange(currentDate);
  if(scope==="month"){const y=d.getFullYear(),m=d.getMonth();return {start:fmtDate(new Date(y,m,1)),end:fmtDate(new Date(y,m+1,0))};}
  if(scope==="quarter"){const q=Math.floor(d.getMonth()/3);const y=d.getFullYear();return {start:fmtDate(new Date(y,q*3,1)),end:fmtDate(new Date(y,(q+1)*3,0))};}
  const y=d.getFullYear();return {start:fmtDate(new Date(y,0,1)),end:fmtDate(new Date(y,11,31))};
}
function reviewKeyOf(scope){
  if(scope==="week")return weekKey(currentDate);
  if(scope==="month")return currentDate.slice(0,7);
  if(scope==="quarter"){const d=new Date(currentDate);return d.getFullYear()+"-Q"+(Math.floor(d.getMonth()/3)+1);}
  return currentDate.slice(0,4);
}
function summarizeRange(start,end){
  const s=parseDate(start),e=parseDate(end);
  let vocal=0,english={words:0,read:0,listen:0};
  let inSum=0,outSum=0,checkinDays=0,tasksDone=0,tasksTotal=0;
  let allReview=[];
  Object.keys(state.entries).filter(k=>{const d=parseDate(k);return d>=s&&d<=e;}).forEach(k=>{
    const en=state.entries[k];
    if(en.checkIn)checkinDays++;
    if(en.study){vocal+=+(en.study.vocal&&en.study.vocal.vocal_time)||0;if(en.study.english){english.words+=+en.study.english.en_words||0;english.read+=+en.study.english.en_read||0;english.listen+=+en.study.english.en_listen||0;}}
    if(en.finance){(en.finance.in||[]).forEach(x=>inSum+=+x.amount||0);(en.finance.out||[]).forEach(x=>outSum+=+x.amount||0);}
    if(en.tasks){tasksDone+=en.tasks.filter(t=>t.done).length;tasksTotal+=en.tasks.length;}
    if(en.review&&en.review.text)allReview.push({date:k,text:en.review.text});
    // 八问数据纳入关键词提取
    if(en.questions){Object.values(en.questions).forEach(q=>{if(q)allReview.push({date:k,text:q});});}
  });
  const keywords=extractKeywords(allReview.map(r=>r.text).join(" "));
  const contactsCount=state.contacts.filter(c=>c.time&&c.time>=start&&c.time<=end).length;
  // 八问统计
  let qCount=0;const qAnswers=[];
  Object.keys(state.entries).filter(k=>{const d=parseDate(k);return d>=s&&d<=e;}).forEach(k=>{
    const q=state.entries[k].questions||{};
    Object.keys(q).forEach(i=>{if(q[i]){qCount++;qAnswers.push({date:k,idx:i,text:q[i]});}});
  });
  return {start,end,checkinDays,vocalMinutes:vocal,englishWords:english.words,englishRead:english.read,englishListen:english.listen,inSum:round2(inSum),outSum:round2(outSum),tasksDone,tasksTotal,reviews:allReview,keywords,contactsCount,questionCount:qCount,questionAnswers:qAnswers};
}

      kx+=w+8;
    });
    y+=30;
  }

  // 底部水印
  svg+=`<text x="${W/2}" y="${H-20}" fill="rgba(31,27,23,0.4)" font-size="11" text-anchor="middle">🐶 鹿7铭 · 人生工作台 · ${fmtDate(new Date())}</text>`;
  svg+=`</svg>`;

  // 转 PNG 下载
  const blob=new Blob([svg],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const canvas=document.createElement("canvas");
    canvas.width=W*2;canvas.height=H*2;
    const ctx=canvas.getContext("2d");
    ctx.scale(2,2);
    ctx.drawImage(img,0,0);
    canvas.toBlob((b)=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      a.download=`周报_${key}.png`;

      toast("📷 周报已保存为图片");
    },"image/png");
  };
  img.onerror=(e)=>{toast("导出失败，请重试");console.error(e);};
  img.src=url;
}
function escapeXml(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
/* 纯 SVG 雷达图（用于导出） */
function buildRadarSvgPure(labels,values,w,h){
  const cx=80,cy=80;
  const r=Math.min(w,h)/2-20;
  const n=labels.length;
  const maxVal=5;
  let polygons="",axes="",dots="";
  for(let lv=1;lv<=maxVal;lv++){
    const pts=[];
    for(let i=0;i<n;i++){
      const angle=(Math.PI*2/n)*i-Math.PI/2;
      const lr=r*(lv/maxVal);
      pts.push((cx+lr*Math.cos(angle)).toFixed(1)+","+(cy+lr*Math.sin(angle)).toFixed(1));
    }
    polygons+=`<polygon points="${pts.join(" ")}" fill="none" stroke="#C8A780" stroke-opacity="${0.2+lv*0.1}" stroke-width="1"/>`;
  }
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2/n)*i-Math.PI/2;
    axes+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(angle)).toFixed(1)}" y2="${(cy+r*Math.sin(angle)).toFixed(1)}" stroke="#C8A780" stroke-opacity="0.4" stroke-width="1"/>`;
    const lx=cx+(r+18)*Math.cos(angle);
    const ly=cy+(r+18)*Math.sin(angle);
    axes+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#3A332D" font-weight="600">${labels[i]}</text>`;
  }
  const dataPts=[];
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2/n)*i-Math.PI/2;
    const dr=r*((values[i]||0)/maxVal);
    dataPts.push((cx+dr*Math.cos(angle)).toFixed(1)+","+(cy+dr*Math.sin(angle)).toFixed(1));
  }
  polygons+=`<polygon points="${dataPts.join(" ")}" fill="rgba(200,167,128,0.35)" stroke="#C8A780" stroke-width="2"/>`;
  dataPts.forEach(p=>{
    const[x,y]=p.split(",");
    dots+=`<circle cx="${x}" cy="${y}" r="3" fill="#C8A780"/>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${polygons}${axes}${dots}</svg>`;
}

/* GitHub 风格近 84 天打卡热力图 */
function habitHeatmapHtml(){
  const days=[];
  const today=new Date();
  for(let i=83;i>=0;i--){
    const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()-i);
    const ds=fmtDate(d);
    const e=state.entries[ds];
    let level=0;
    if(e&&e.checkIn){
      // 根据打卡项数+任务完成度算强度
      const checks=Object.keys(e.checks||{}).filter(k=>e.checks[k]).length;
      const tasks=(e.tasks||[]).filter(t=>t.done).length;
      level=Math.min(4,1+Math.floor((checks+tasks)/3));
    }else if(e){
      level=e.checkIn?1:0;
      if(!e.checkIn && Object.keys(e.checks||{}).some(k=>e.checks[k]))level=1;
    }
    const isToday=ds===fmtDate(today);
    days.push({ds,level,isToday,day:d.getDate(),month:d.getMonth()+1});
  }
  // 按周排列（7 列）
  let html='<div class="hhm-grid">';
  // 月份标签
  html+='<div class="hhm-months">';
  let lastMonth=-1;
  for(let i=0;i<days.length;i+=7){
    const m=days[i].month;
    if(m!==lastMonth){html+=`<span class="hhm-month">${m}月</span>`;lastMonth=m;}
    else html+='<span class="hhm-month"></span>';
  }
  html+='</div><div class="hhm-cells">';
  days.forEach(d=>{
    html+=`<div class="hhm-cell lvl-${d.level} ${d.isToday?'today':''}" title="${d.ds}" data-jump-date="${d.ds}" style="cursor:pointer"></div>`;
  });
  html+='</div></div>';
  // 统计
  const checked=days.filter(d=>d.level>=2).length;
  const streak=streakDays();
  const longest=longestStreak();
  html+=`<div class="hhm-stats"><span>🔥 连续 ${streak} 天</span><span>🏆 最长 ${longest} 天</span><span>📊 84天打卡 ${checked} 天</span></div>`;
  return html;
}

/* ============== 周计划模块 ============== */
function weekIdOf(dateStr){
  const d=parseDate(dateStr);
  const onejan=new Date(d.getFullYear(),0,1);
  const week=Math.ceil(((d-onejan)/86400000+onejan.getDay()+1)/7);
  return d.getFullYear()+"-W"+String(week).padStart(2,"0");
}
function weekRangeOf(dateStr){
  const d=parseDate(dateStr);
  const day=d.getDay()||7; // 周日=7
  const monday=new Date(d);monday.setDate(d.getDate()-day+1);
  const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  return {start:iso(monday),end:iso(sunday),monday,sunday};
}
function getWeekPlan(dateStr){
  const wid=weekIdOf(dateStr);
  if(!state.weeklyPlans)state.weeklyPlans=[];
  let p=state.weeklyPlans.find(x=>x.week_id===wid);
  if(!p){
    p={week_id:wid,start_date:weekRangeOf(dateStr).start,end_date:weekRangeOf(dateStr).end,
       weekly_goals:[],daily_assignments:{},week_review:{completion_rate:0,highlights:"",lowlights:"",next_week_focus:""}};
    state.weeklyPlans.push(p);
  }
  // 兜底：补全可能缺失的字段
  if(!Array.isArray(p.weekly_goals))p.weekly_goals=[];
  if(!p.daily_assignments)p.daily_assignments={};
  if(!p.week_review)p.week_review={completion_rate:0,highlights:"",lowlights:"",next_week_focus:""};
  return p;
}

function autoClassifyMemo(text){
  const t=String(text||"").toLowerCase();
  const score={};MEMO_CATS.forEach(c=>score[c.k]=0);
  for(const k in MEMO_KW){
    MEMO_KW[k].forEach(kw=>{ if(t.includes(kw.toLowerCase())) score[k]+=(k==="important"?3:1); });
  }
  let best="misc",bestScore=0;
  const prio=["important","todo","work","idea","shopping","study","health","life","misc"];
  prio.forEach(k=>{ if(score[k]>bestScore){bestScore=score[k];best=k;} });
  if(bestScore===0)best="misc";
  // 跨模块关联：自动识别项目 / 目标 / 联系人
  const links={projects:[],goals:[],contacts:[]};
  (state.projects||[]).forEach(p=>{ if(p.name&&text.includes(p.name))links.projects.push(p.id); });
  (state.goals||[]).forEach(g=>{ if(g.title&&text.includes(g.title))links.goals.push(g.id); });
  (state.contacts||[]).forEach(c=>{ if(c.name&&text.includes(c.name))links.contacts.push(c.id); });
  return {cat:best,score:bestScore,links};
}
function memoCat(k){return MEMO_CATS.find(c=>c.k===k)||MEMO_CATS[MEMO_CATS.length-1];}

/* ============== 数据看板 / 仪表盘 ============== */
function svgLineChart(data,w,h){
  // data: [{label,value,color?}]
  if(!data.length)return `<div class="empty">暂无数据</div>`;
  const max=Math.max(...data.map(d=>d.value),1);
  const min=Math.min(...data.map(d=>d.value),0);
  const range=Math.max(max-min,1);
  const pad=24,padB=20,padT=10;
  const iw=w-pad*2,ih=h-padB-padT;
  const step=data.length>1?iw/(data.length-1):0;
  const pts=data.map((d,i)=>[pad+i*step,h-padB-(d.value-min)/range*ih]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(" ");
  const area=path+` L${pts[pts.length-1][0]} ${h-padB} L${pts[0][0]} ${h-padB} Z`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <path d="${area}" fill="rgba(200,167,128,.15)"/>
    <path d="${path}" fill="none" stroke="var(--warm)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--warm)"/><text x="${p[0]}" y="${h-4}" font-size="9" text-anchor="middle" fill="var(--muted)">${data[i].label}</text>`).join("")}
  </svg>`;
}
function svgBarChart(data,w,h){
  if(!data.length)return `<div class="empty">暂无数据</div>`;
  const max=Math.max(...data.map(d=>d.value),1);
  const pad=24,padB=20,padT=10;
  const iw=w-pad*2,ih=h-padB-padT;
  const bw=iw/data.length*.6;
  const gap=iw/data.length;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    ${data.map((d,i)=>{
      const x=pad+i*gap+(gap-bw)/2;
      const bh=d.value/max*ih;
      const y=h-padB-bh;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${d.color||"var(--warm)"}"/>
        <text x="${x+bw/2}" y="${h-4}" font-size="9" text-anchor="middle" fill="var(--muted)">${d.label}</text>
        <text x="${x+bw/2}" y="${y-3}" font-size="10" text-anchor="middle" fill="var(--ink)">${d.value}</text>`;
    }).join("")}
  </svg>`;
}
function svgPieChart(data,w,h){
  if(!data.length)return `<div class="empty">暂无数据</div>`;
  const total=data.reduce((s,d)=>s+d.value,0)||1;
  const cx=w/2,cy=h/2,r=Math.min(w,h)/2-10;
  let angle=-Math.PI/2;const slices=[];
  const colors=["var(--warm)","#9CB57A","#7BA5B0","#C5826B","#A78BB0","#B0A575"];
  data.forEach((d,i)=>{
    const slice=(d.value/total)*Math.PI*2;
    const x1=cx+r*Math.cos(angle),y1=cy+r*Math.sin(angle);
    angle+=slice;
    const x2=cx+r*Math.cos(angle),y2=cy+r*Math.sin(angle);
    const large=slice>Math.PI?1:0;
    slices.push(`<path d="M${cx} ${cy} L${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${colors[i%colors.length]}"/>`);
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${slices.join("")}
    <circle cx="${cx}" cy="${cy}" r="${r*.55}" fill="var(--card)"/>
    <text x="${cx}" y="${cy-4}" font-size="13" text-anchor="middle" fill="var(--ink)" font-weight="700">${total}</text>
    <text x="${cx}" y="${cy+10}" font-size="9" text-anchor="middle" fill="var(--muted)">总计</text>
  </svg>`;
}
/* 五维雷达图 */
function svgRadarChart(labels,values,w,h){
  if(!labels.length)return '<div class="empty">暂无数据</div>';
  const cx=w/2,cy=h/2;
  const r=Math.min(w,h)/2-36;
  const n=labels.length;
  const maxVal=5;
  let bgPolygons="",axes="";
  // 背景多边形（5层）
  for(let lv=1;lv<=maxVal;lv++){
    const pts=[];
    for(let i=0;i<n;i++){
      const angle=(Math.PI*2/n)*i-Math.PI/2;
      const lr=r*(lv/maxVal);
      pts.push((cx+lr*Math.cos(angle)).toFixed(1)+","+(cy+lr*Math.sin(angle)).toFixed(1));
    }
    bgPolygons+=`<polygon points="${pts.join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  }
  // 轴线 + 标签
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2/n)*i-Math.PI/2;
    axes+=`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(angle)).toFixed(1)}" y2="${(cy+r*Math.sin(angle)).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    const lx=cx+(r+20)*Math.cos(angle);
    const ly=cy+(r+20)*Math.sin(angle);
    axes+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="var(--ink-2)" font-weight="600">${labels[i]}</text>`;
  }
  // 数据多边形
  const dataPts=[];
  for(let i=0;i<n;i++){
    const angle=(Math.PI*2/n)*i-Math.PI/2;
    const dr=r*((values[i]||0)/maxVal);
    dataPts.push((cx+dr*Math.cos(angle)).toFixed(1)+","+(cy+dr*Math.sin(angle)).toFixed(1));
  }
  const dataPolygon=`<polygon points="${dataPts.join(" ")}" fill="rgba(200,167,128,.25)" stroke="var(--warm)" stroke-width="2"/>`;
  const dots=dataPts.map(p=>{
    const a=p.split(",");
    return `<circle cx="${a[0]}" cy="${a[1]}" r="4" fill="var(--warm)"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">${bgPolygons}${axes}${dataPolygon}${dots}</svg>`;
}

/* ============== 白噪音 + 闹钟 ============== */
let audioCtx=null,masterGain=null,activeNodes=[],currentSound=null,soundTimer=null,soundRemain=0,soundTimerInt=null,currentGain=null,soundStopAt=0;

function initAudio(){
  if(audioCtx)return;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.value=state.soundSettings.volume||0.5;
    masterGain.connect(audioCtx.destination);
  }catch(e){}
}

function makeNoiseBuffer(type){
  const sr=audioCtx.sampleRate,buf=audioCtx.createBuffer(1,sr*2,sr);
  const d=buf.getChannelData(0);
  if(type==="white"){
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }else if(type==="pink"){
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<d.length;i++){
      const w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926;
    }
  }else{ // brown
    let last=0;
    for(let i=0;i<d.length;i++){const w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5;}
  }
  return buf;
}

function startSound(type){
  initAudio();
  if(!audioCtx||!masterGain){toast("当前设备暂不支持音频播放");return;}
  if(audioCtx.state==="suspended"){audioCtx.resume().catch(()=>{});}
  stopSound(true);
  currentSound=type;
  activeNodes=[];
  const g=audioCtx.createGain();
  g.gain.value=0;
  g.gain.linearRampToValueAtTime(1,audioCtx.currentTime+0.5);
  g.connect(masterGain);
  activeNodes.push(g);
  currentGain=g;

  if(type==="white"||type==="pink"||type==="brown"){
    const src=audioCtx.createBufferSource();
    src.buffer=makeNoiseBuffer(type);src.loop=true;src.connect(g);src.start();
    activeNodes.push(src);
  }else if(type==="rain"){
    const src=audioCtx.createBufferSource();
    src.buffer=makeNoiseBuffer("white");src.loop=true;
    const bp=audioCtx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1000;bp.Q.value=0.5;
    src.connect(bp);bp.connect(g);src.start();
    activeNodes.push(src,bp);
    // 雨滴随机脉冲
    const tick=setInterval(()=>{if(currentSound!=="rain")return;const o=audioCtx.createOscillator();const og=audioCtx.createGain();o.frequency.value=800+Math.random()*1200;og.gain.value=0;og.gain.linearRampToValueAtTime(0.08,audioCtx.currentTime+0.005);og.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.03);o.connect(og);og.connect(masterGain);o.start();o.stop(audioCtx.currentTime+0.04);},80);
    activeNodes.push({stop:()=>clearInterval(tick),disconnect:()=>{}});
  }else if(type==="ocean"){
    const src=audioCtx.createBufferSource();
    src.buffer=makeNoiseBuffer("brown");src.loop=true;
    const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=400;
    const lfo=audioCtx.createOscillator();const lfoG=audioCtx.createGain();
    lfo.frequency.value=0.1;lfoG.gain.value=0.5;
    lfo.connect(lfoG);lfoG.connect(g.gain);
    src.connect(lp);lp.connect(g);src.start();lfo.start();
    activeNodes.push(src,lp,lfo,lfoG);
  }else if(type==="wind"){
    const src=audioCtx.createBufferSource();
    src.buffer=makeNoiseBuffer("pink");src.loop=true;
    const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=600;
    const lfo=audioCtx.createOscillator();const lfoG=audioCtx.createGain();
    lfo.frequency.value=0.05;lfoG.gain.value=200;
    lfo.connect(lfoG);lfoG.connect(lp.frequency);
    src.connect(lp);lp.connect(g);src.start();lfo.start();
    activeNodes.push(src,lp,lfo,lfoG);
  }else if(type==="fire"){
    const src=audioCtx.createBufferSource();
    src.buffer=makeNoiseBuffer("brown");src.loop=true;
    const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=300;
    src.connect(lp);lp.connect(g);src.start();
    activeNodes.push(src,lp);
    // 噼啪声
    const crackle=setInterval(()=>{if(currentSound!=="fire")return;if(Math.random()<0.3){const o=audioCtx.createBufferSource();o.buffer=makeNoiseBuffer("white");const og=audioCtx.createGain();og.gain.value=0;og.gain.linearRampToValueAtTime(0.15,audioCtx.currentTime+0.002);og.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.05);o.connect(og);og.connect(masterGain);o.start();o.stop(audioCtx.currentTime+0.06);}},200);
    activeNodes.push({stop:()=>clearInterval(crackle),disconnect:()=>{}});
  }else if(type==="birds"){
    const chirp=setInterval(()=>{if(currentSound!=="birds")return;if(Math.random()<0.4){const o=audioCtx.createOscillator();const og=audioCtx.createGain();o.type="sine";o.frequency.value=800+Math.random()*1200;o.frequency.linearRampToValueAtTime(o.frequency.value*1.3,audioCtx.currentTime+0.1);og.gain.value=0;og.gain.linearRampToValueAtTime(0.1,audioCtx.currentTime+0.02);og.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15);o.connect(og);og.connect(masterGain);o.start();o.stop(audioCtx.currentTime+0.2);}},500);
    activeNodes.push({stop:()=>clearInterval(chirp),disconnect:()=>{}});
    // 背景森林声
    const src=audioCtx.createBufferSource();src.buffer=makeNoiseBuffer("pink");src.loop=true;
    const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=200;
    const bg=audioCtx.createGain();bg.gain.value=0.15;
    src.connect(lp);lp.connect(bg);bg.connect(masterGain);src.start();
    activeNodes.push(src,lp,bg);
  }else if(type==="stream"){
    const src=audioCtx.createBufferSource();
    src.buffer=makeNoiseBuffer("white");src.loop=true;
    const hp=audioCtx.createBiquadFilter();hp.type="highpass";hp.frequency.value=500;
    const lp=audioCtx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3000;
    const lfo=audioCtx.createOscillator();const lfoG=audioCtx.createGain();
    lfo.frequency.value=0.3;lfoG.gain.value=0.1;lfo.connect(lfoG);lfoG.connect(g.gain);
    src.connect(hp);hp.connect(lp);lp.connect(g);src.start();lfo.start();
    activeNodes.push(src,hp,lp,lfo,lfoG);
  }else if(type==="piano"){
    // 氛围钢琴 - C大调和弦琶音
    const notes=[261.63,329.63,392.0,523.25,659.25];
    const playNote=()=>{
      if(currentSound!=="piano")return;
      const freq=notes[Math.floor(Math.random()*notes.length)];
      const o=audioCtx.createOscillator();const og=audioCtx.createGain();
      o.type="sine";o.frequency.value=freq;
      og.gain.value=0;og.gain.linearRampToValueAtTime(0.12,audioCtx.currentTime+0.02);
      og.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+3);
      o.connect(og);og.connect(masterGain);o.start();o.stop(audioCtx.currentTime+3.5);
      setTimeout(playNote,2000+Math.random()*3000);
    };
    playNote();
    activeNodes.push(g);
  }
  updateSoundIndicator();
}

function stopSound(instant){
  if(!audioCtx)return;
  const nodes=activeNodes;activeNodes=[];
  const g=currentGain;currentGain=null;
  if(instant){
    nodes.forEach(n=>{try{if(n.stop){try{n.stop(0);}catch(e){}}n.disconnect&&n.disconnect();}catch(e){}});
  }else{
    // 先把主增益淡出，避免切歌/停止时的咔哒声，再停源节点
    try{
      if(g&&g.gain){g.gain.cancelScheduledValues(audioCtx.currentTime);g.gain.setValueAtTime(g.gain.value,audioCtx.currentTime);g.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.35);}
    }catch(e){}
    setTimeout(()=>{nodes.forEach(n=>{try{if(n.stop){try{n.stop(0);}catch(e){}}n.disconnect&&n.disconnect();}catch(e){}});},380);
  }
  currentSound=null;
  if(soundTimerInt){clearInterval(soundTimerInt);soundTimerInt=null;}
  soundStopAt=0;
  if(settings.soundPersist){settings.soundPersist=null;try{saveSettings();}catch(e){}}
  soundRemain=0;
  updateSoundIndicator();
}

function setVolume(v){
  state.soundSettings.volume=v;
  if(masterGain)masterGain.gain.value=v;
  save();
}

function startSoundTimer(minutes){
  if(!currentSound){toast("请先播放一个音效");return;}
  if(soundTimerInt)clearInterval(soundTimerInt);
  soundRemain=minutes*60;
  soundStopAt=minutes>0?Date.now()+minutes*60*1000:0;
  if(minutes>0){try{settings.soundPersist={type:currentSound,stopAt:soundStopAt};saveSettings();}catch(e){}}
  soundTimerInt=setInterval(()=>{
    soundRemain--;
    if(soundRemain<=0){stopSound();toast("⏰ 白噪音定时结束");if(soundTimerInt){clearInterval(soundTimerInt);soundTimerInt=null;}}
    updateSoundIndicator();
  },1000);
}

/* 刷新后恢复白噪音定时（实际播放仍需点击音效卡恢复，这里恢复倒计时与指示） */
function restoreSoundTimer(){
  try{
    const p=settings.soundPersist;
    if(p&&p.stopAt&&p.stopAt>Date.now()){
      soundRemain=Math.round((p.stopAt-Date.now())/1000);
      currentSound=p.type;
      updateSoundIndicator();
      toast("⏱ 白噪音定时已恢复（点音效卡可重新播放）");
      if(soundTimerInt)clearInterval(soundTimerInt);
      soundTimerInt=setInterval(()=>{
        soundRemain--;
        if(soundRemain<=0){stopSound();toast("⏰ 白噪音定时结束");if(soundTimerInt){clearInterval(soundTimerInt);soundTimerInt=null;}}
        updateSoundIndicator();
      },1000);
    }else if(p){settings.soundPersist=null;try{saveSettings();}catch(e){}}
  }catch(e){}
}

function updateSoundIndicator(){

/* 闹钟 */
let alarmCheckInt=null;
function initAlarms(){
  if(alarmCheckInt)clearInterval(alarmCheckInt);
  alarmCheckInt=setInterval(checkAlarms,30000);
  checkAlarms();
}
function detectMissedAlarms(){
  try{
    state.alarmLog=state.alarmLog||[];
    const lc=state.lastClosed;
    if(!lc)return;
    const now=Date.now();
    if(now-lc<60000)return; // 离开不足 1 分钟不计入
    const start=Math.max(lc,now-24*3600*1000); // 最多回看 24h
    (state.alarms||[]).forEach(a=>{
      if(!a.enabled)return;
      const [hh,mm]=a.time.split(":").map(Number);
      for(let t=start;t<=now;t+=60000){
        const d=new Date(t);
        if(d.getHours()!==hh||d.getMinutes()!==mm)continue;
        const ds=fmtDate(d),td=d.getDay(),isWorkday=td>=1&&td<=5;
        if(a.repeat==="workdays"&&!isWorkday)continue;
        if(a.repeat==="once"&&a.triggeredOnce)continue;
        if(a.lastTriggered===ds)continue;
        state.alarmLog.unshift({id:a.id,label:a.label,time:a.time,at:t,missed:true});
        a.lastTriggered=ds;
        if(a.repeat==="once")a.triggeredOnce=true;
        break;
      }
    });
    if(state.alarmLog.length>50)state.alarmLog=state.alarmLog.slice(0,50);
    save();
  }catch(e){}
}
function checkAlarms(){
  state.alarmLog=state.alarmLog||[];
  const now=new Date();
  const hm=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  const today=now.getDay(); // 0=日
  const dateStr=fmtDate(now);
  (state.alarms||[]).forEach(a=>{
    if(!a.enabled)return;
    if(a.time!==hm)return;
    if(a.lastTriggered===dateStr)return;
    const isWorkday=today>=1&&today<=5;
    if(a.repeat==="workdays"&&!isWorkday)return;
    if(a.repeat==="once"&&a.triggeredOnce)return;
    triggerAlarm(a);
    a.lastTriggered=dateStr;
    if(a.repeat==="once")a.triggeredOnce=true;
    save();
  });
}
function triggerAlarm(a){
  haptic([200,100,200,100,200]);
  if("Notification" in window&&Notification.permission==="granted"){
    try{new Notification("⏰ 闹钟："+a.label,{body:"时间到了！点击查看",tag:"alarm-"+a.id});}catch(e){}
  }
  try{
    state.alarmLog=state.alarmLog||[];
    state.alarmLog.unshift({id:a.id,label:a.label,time:a.time,at:Date.now(),missed:false});
    if(state.alarmLog.length>50)state.alarmLog=state.alarmLog.slice(0,50);
  }catch(e){}
  showAlarmRing(a);
  toast("⏰ 闹钟："+a.label);
}
/* 应用内响铃页：保证前台必定可见，支持贪睡/停止，并尝试发声 */
let _ringInt=null,_ringBellInt=null;
function showAlarmRing(a){
  try{
    if(!audioCtx)initAudio();
    if(audioCtx&&audioCtx.state==="suspended"){audioCtx.resume().catch(()=>{});}
  }catch(e){}
  let root=document.getElementById("alarmRing");
  if(!root){root=document.createElement("div");root.id="alarmRing";root.className="alarm-ring";document.body.appendChild(root);}
  const now=new Date();
  const tstr=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  root.innerHTML=`<div class="ar-flash"></div><div class="ar-inner">
    <div class="ar-bell">🔔</div>
    <div class="ar-title">${esc(a.label||"闹钟")}</div>
    <div class="ar-time">${tstr}</div>
    <div class="ar-tip">应用已打开，闹钟准时响起</div>
    <div class="ar-btns">
      <button class="ar-snooze">😴 贪睡 5 分钟</button>
      <button class="ar-stop">✅ 停止</button>
    </div></div>`;
  root.classList.add("show");
  const playBell=()=>{try{if(!audioCtx)return;const o=audioCtx.createOscillator();const g=audioCtx.createGain();o.type="sine";o.frequency.value=880;g.gain.value=0;g.gain.linearRampToValueAtTime(0.3,audioCtx.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.2);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+1.3);}catch(e){}};
  playBell();_ringBellInt=setInterval(playBell,1500);
  _ringInt=setInterval(()=>{haptic([300,100,300]);},2000);
  haptic([300,100,300]);
  const stop=()=>{
    root.classList.remove("show");
    if(_ringInt){clearInterval(_ringInt);_ringInt=null;}
    if(_ringBellInt){clearInterval(_ringBellInt);_ringBellInt=null;}
  };
  root.querySelector(".ar-stop").onclick=stop;
  root.querySelector(".ar-snooze").onclick=()=>{
    stop();
    toast("😴 5 分钟后再次提醒");
    setTimeout(()=>{const cur=(state.alarms||[]).find(x=>x.id===a.id);if(cur&&cur.enabled)triggerAlarm(cur);},5*60000);
  };
}

let libraryTab="words";
let wordDB=null;
let wordCache=[]; // 内存缓存

async function ensureWordStore(){
  // 复用已有的 idbDB 连接，如果版本不够则升级
  return new Promise((resolve)=>{
    if(wordDB&&wordDB.objectStoreNames.contains("words")){resolve(wordDB);return;}
    try{
      const dbName="life_workbench";
      const version=idbDB?idbDB.version+1:2;
      // 如果 idbDB 已存在但没 words store，需要升级版本号
      if(idbDB){
        if(idbDB.objectStoreNames.contains("words")){wordDB=idbDB;resolve(wordDB);return;}
        // 关闭旧连接，用新版本打开
        idbDB.close();
      }
      const req=indexedDB.open(dbName,version);
      req.onupgradeneeded=(e)=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains("kv"))db.createObjectStore("kv");
        if(!db.objectStoreNames.contains("words")){
          const store=db.createObjectStore("words",{keyPath:"id"});
          store.createIndex("word","word",{unique:false});
          store.createIndex("category","category",{unique:false});
          store.createIndex("mastered","mastered",{unique:false});
        }
      };
      req.onsuccess=(e)=>{
        wordDB=e.target.result;
        idbDB=wordDB; // 更新全局引用
        resolve(wordDB);
      };
      req.onerror=()=>resolve(null);
    }catch(e){resolve(null);}
  });
}

async function loadWords(){
  await ensureWordStore();
  if(!wordDB)return [];
  return new Promise((resolve)=>{
    try{
      const tx=wordDB.transaction("words","readonly");
      const req=tx.objectStore("words").getAll();
      req.onsuccess=()=>{wordCache=req.result||[];resolve(wordCache);};
      req.onerror=()=>resolve([]);
    }catch(e){resolve([]);}
  });
}

async function saveWord(word){
  await ensureWordStore();
  if(!wordDB)return;
  return new Promise((resolve)=>{
    try{
      const tx=wordDB.transaction("words","readwrite");
      tx.objectStore("words").put(word);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>resolve();
    }catch(e){resolve();}
  });
}

async function deleteWord(id){
  await ensureWordStore();
  if(!wordDB)return;
  return new Promise((resolve)=>{
    try{
      const tx=wordDB.transaction("words","readwrite");
      tx.objectStore("words").delete(id);
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>resolve();
    }catch(e){resolve();}
  });
}

async function bulkImportWords(words){
  await ensureWordStore();
  if(!wordDB)return 0;
  return new Promise((resolve)=>{
    let count=0;
    try{
      const tx=wordDB.transaction("words","readwrite");
      words.forEach(w=>{tx.objectStore("words").put(w);count++;});
      tx.oncomplete=()=>resolve(count);
      tx.onerror=()=>resolve(0);
    }catch(e){resolve(0);}
  });
}

function weightSvg(pts){
  pts=pts.filter(p=>p&&p.weight!=null&&isFinite(p.weight));
  if(pts.length<2)return "";
  const w=300,h=120,pad=20;
  const minW=Math.min(...pts.map(p=>p.weight))-1;
  const maxW=Math.max(...pts.map(p=>p.weight))+1;
  const xs=pts.map((p,i)=>pad+i*(w-2*pad)/(pts.length-1));
  const path=pts.map((p,i)=>(i===0?"M":"L")+xs[i]+" "+(h-pad-(p.weight-minW)*((h-2*pad)/(maxW-minW)))).join(" ");
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--line)" stroke-width="1"/>
    <path d="${path}" stroke="var(--ink)" stroke-width="2" fill="none"/>
    ${pts.map((p,i)=>`<circle cx="${xs[i]}" cy="${h-pad-(p.weight-minW)*((h-2*pad)/(maxW-minW))}" r="3" fill="var(--ink)"/>`).join("")}
    <text x="${w-pad}" y="${pad+8}" text-anchor="end" fill="var(--muted)" font-size="10">${last.weight} kg</text>
  </svg>`;
}

/* ---- 全年学习强度热力图（类似 GitHub 贡献图） ---- */
function studyYearHeatmap(){
  const now=new Date();
  const y=now.getFullYear();
  // 计算今年的每一天学习时长（声乐+英语+阅读+听力+冥想）
  const days=[];
  for(let m=0;m<12;m++){
    const last=new Date(y,m+1,0).getDate();
    for(let d=1;d<=last;d++){
      const ds=fmtDate(new Date(y,m,d));
      const e=state.entries[ds];
      let mins=0;
      if(e&&e.study){
        mins+=(e.study.vocal&&+e.study.vocal.vocal_time||0);
        mins+=(e.study.piano&&e.study.piano.piano_song?30:0); // 钢琴按文本记录算30分钟
        if(e.study.english){
          mins+=(+e.study.english.en_read||0);
          mins+=(+e.study.english.en_listen||0);
        }
        if(e.study.reading)mins+=(+e.study.reading.minutes||0);
      }
      if(e&&e.health&&e.health.meditation){
        mins+=e.health.meditation.reduce((s,m)=>s+(m.duration||0)/60,0);
      }
      // 加上番茄钟分钟数
      if(e&&e.focusSessions){
        mins+=e.focusSessions.reduce((s,fs)=>s+(fs.duration||0)/60,0);
      }
      days.push({date:ds,mins:Math.round(mins)});
    }
  }
  const maxMins=Math.max(...days.map(d=>d.mins),1);
  // 按周分列（GitHub 风格：列=周，行=周日历上的星期几）
  // 这里用按月分组，每月一行，每行最多 31 天
  const monthNames=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  // 颜色等级：0=无，1=少(<30min), 2=中(30-60), 3=多(60-120), 4=很多(>120)
  const getColor=(mins)=>{
    if(mins===0)return "var(--card-soft)";
    if(mins<30)return "#E8DCC8";
    if(mins<60)return "#C8B080";
    if(mins<120)return "var(--warm)";
    return "#1F1B17";
  };
  // 计算每月格子数组（31列）
  let html=`<div style="display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted)">`;
  for(let m=0;m<12;m++){
    const last=new Date(y,m+1,0).getDate();
    html+=`<div style="display:flex;align-items:center;gap:6px">
      <div style="width:24px;flex-shrink:0">${monthNames[m]}</div>
      <div style="display:flex;gap:2px;flex:1;overflow-x:auto">`;
    for(let d=1;d<=31;d++){
      if(d>last){
        html+=`<div style="width:14px;height:14px"></div>`;
      }else{
        const ds=fmtDate(new Date(y,m,d));
        const mins=days.find(x=>x.date===ds).mins;
        html+=`<div title="${ds}: ${mins} 分钟" data-jump-date="${ds}" style="width:14px;height:14px;border-radius:2px;background:${getColor(mins)};cursor:pointer"></div>`;
      }
    }
    html+=`</div></div>`;
  }
  // 图例
  html+=`<div style="display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)">
    <span>少</span>
    <div style="width:14px;height:14px;border-radius:2px;background:var(--card-soft)"></div>
    <div style="width:14px;height:14px;border-radius:2px;background:#E8DCC8"></div>
    <div style="width:14px;height:14px;border-radius:2px;background:#C8B080"></div>
    <div style="width:14px;height:14px;border-radius:2px;background:var(--warm)"></div>
    <div style="width:14px;height:14px;border-radius:2px;background:#1F1B17"></div>
    <span>多</span>
    <span style="margin-left:auto">本年累计：${Math.round(days.reduce((s,d)=>s+d.mins,0))} 分钟</span>
  </div>`;
  html+=`</div>`;
  return html;
}

/* ---- 30 天情绪曲线 ---- */
function moodLineChart(){
  const now=new Date();
  const data=[];
  for(let i=29;i>=0;i--){
    const ds=fmtDate(new Date(now.getFullYear(),now.getMonth(),now.getDate()-i));
    const rfs=state.reflections[ds]||[];
    let avg=null;
    if(rfs.length){
      const vals=rfs.map(r=>moodVal(r.mood)).filter(v=>v);
      if(vals.length)avg=vals.reduce((a,b)=>a+b,0)/vals.length;
    }
    data.push({label:ds.slice(5),value:avg===null?0:Math.round(avg*10)/10,date:ds});
  }
  const max=5;
  const w=720,h=200;
  const padL=30,padR=10,padT=10,padB=24;
  const iw=w-padL-padR,ih=h-padT-padB;
  // 背景：横线分隔（1-5 刻度）
  let svg=`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
    <line x1="${padL}" y1="${padT}" x2="${w-padR}" y2="${padT}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${padT+ih*0.25}" x2="${w-padR}" y2="${padT+ih*0.25}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${padT+ih*0.5}" x2="${w-padR}" y2="${padT+ih*0.5}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${padT+ih*0.75}" x2="${w-padR}" y2="${padT+ih*0.75}" stroke="var(--line)"/>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--line)"/>
    <text x="${padL-4}" y="${padT+4}" text-anchor="end" font-size="9" fill="var(--muted)">5</text>
    <text x="${padL-4}" y="${padT+ih*0.5+3}" text-anchor="end" font-size="9" fill="var(--muted)">3</text>
    <text x="${padL-4}" y="${h-padB+2}" text-anchor="end" font-size="9" fill="var(--muted)">0</text>
  `;
  // 折线（跳过0值）
  const step=data.length>1?iw/(data.length-1):0;
  let path="",dots="";
  data.forEach((d,i)=>{
    const x=padL+i*step;
    if(d.value>0){
      const y=padT+ih-(d.value/max)*ih;
      if(path)path+="L";else path="M";
      path+=x.toFixed(1)+" "+y.toFixed(1);
      dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="var(--warm)"/>`;
    }
  });
  if(path){
    svg+=`<path d="${path}" fill="none" stroke="var(--warm)" stroke-width="2" stroke-linejoin="round"/>`;
    svg+=dots;
  }
  // 底部日期标签（每5天一个）
  data.forEach((d,i)=>{
    if(i%5===0||i===data.length-1){
      const x=padL+i*step;
      svg+=`<text x="${x.toFixed(1)}" y="${h-6}" font-size="9" text-anchor="middle" fill="var(--muted)">${d.label}</text>`;
    }
  });
  svg+=`</svg>`;
  const avg=data.filter(d=>d.value>0);
  const avgVal=avg.length?(avg.reduce((s,d)=>s+d.value,0)/avg.length).toFixed(1):"--";
  const recordDays=avg.length;
  return svg+`<div style="margin-top:6px;font-size:11px;color:var(--muted);display:flex;gap:14px">
    <span>📊 30 天平均情绪：${avgVal}/5</span>
    <span>📝 有记录：${recordDays}/30 天</span>
  </div>`;
}

function fmtTime(ts){if(!ts)return"";const d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function addReflection(date,obj){

}
/* 认知账本：把所有思考按主题聚合，记录出现次数与首末时间 */
function cognitiveLedger(){
  const map={};
  Object.keys(state.reflections).sort().forEach(d=>{
    (state.reflections[d]||[]).forEach(rf=>{
      extractKeywords(rf.text).forEach(k=>{
        const o=map[k]||(map[k]={count:0,first:d,last:d,samples:[]});
        o.count++;
        if(d<o.first)o.first=d;
        if(d>o.last)o.last=d;
        if(o.samples.length<2)o.samples.push(rf.text.slice(0,50));
      });
    });
  });
  let arr=Object.keys(map).map(k=>({k,count:map[k].count,first:map[k].first,last:map[k].last}));
  // 去噪：按包含关系分组，每组选最优代表（count 最高；平局取最短），丢弃噪声 n-gram
  const groups=[];
  arr.forEach(a=>{
    for(const g of groups){
      if(g.some(x=>x.k.indexOf(a.k)>=0||a.k.indexOf(x.k)>=0)){g.push(a);return;}
    }
    groups.push([a]);
  });
  arr=groups.map(g=>g.reduce((best,x)=>x.count>best.count||(x.count===best.count&&x.k.length<best.k.length)?x:best));
  return arr.sort((a,b)=>b.count-a.count);
}

/* ============== 课程表 / 课余空闲 ============== */
const WD_NAMES=["日","一","二","三","四","五","六"];
const WD_FULL=["周日","周一","周二","周三","周四","周五","周六"];
function toMin(t){const a=String(t).split(":").map(Number);return a[0]*60+a[1];}
function fmtMin(m){return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
const COURSE_PALETTE=["#C8A780","#7B9E87","#7E8FAF","#B88A9A","#A89C7B","#8A7BA8","#9A8470","#7BA89C"];
function courseColor(name){
  let h=0;
  for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%10000;
  return COURSE_PALETTE[h%COURSE_PALETTE.length];
}
/* 检测同一天内重叠课程，分配横向宽度 */
function layoutCourses(list){
  const sorted=list.map(c=>({...c,start:toMin(c.start),end:toMin(c.end)})).sort((a,b)=>a.start-b.start);
  const lanes=[];
  for(const c of sorted){
    let placed=false;
    for(const lane of lanes){
      const last=lane[lane.length-1];
      if(last.end<=c.start){lane.push(c);placed=true;break;}
    }
    if(!placed)lanes.push([c]);
  }
  const out=[];
  lanes.forEach((lane,li)=>{
    lane.forEach(c=>out.push({...c,left:(li/lanes.length)*100,width:100/lanes.length,total:lanes.length,lane:li}));
  });
  return out.sort((a,b)=>a.start-b.start);
}
/* 给定日期，返回当天所有占用时段（周课 ∪ 临时覆盖） */
function busySlots(date){
  const dn=parseDate(date).getDay();
  return ((state.courses[String(dn)]||[]).concat(state.courseOverrides[date]||[]))
    .map(c=>({id:c.id,name:c.name,start:toMin(c.start),end:toMin(c.end),loc:c.loc||""}));
}
/* 获取所有课程的去重列表（用于项目关联） */
function allCoursesList(){
  const map={};
  for(let d=1;d<=7;d++){
    (state.courses[String(d)]||[]).forEach(c=>{
      if(!map[c.name])map[c.name]={id:c.id,name:c.name};
    });
  }
  return Object.values(map);
}
/* 根据课程名查找相关的项目/作业 */
function projectsForCourse(courseName){
  return state.projects.filter(p=>p.courseRef===courseName);
