/* ============== 番茄钟 ============== */
function fmtPomoTime(sec){
  sec=Math.max(0,Math.floor(sec));
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}
function updatePomoDisplay(){
  const el=document.getElementById("pomoDisplay");
  if(el)el.textContent=fmtPomoTime(pomoRemain);
  const status=document.getElementById("pomoStatus");
  if(status)status.textContent=pomoRunning?"专注中…保持心流":"选一个时长，坐下来开始专注";
  const startBtn=document.getElementById("pomoStart");
  const pauseBtn=document.getElementById("pomoPause");
  if(startBtn&&pauseBtn){
    startBtn.style.display=pomoRunning?"none":"inline-block";
    pauseBtn.style.display=pomoRunning?"inline-block":"none";
  }
  const taskLabel=document.getElementById("pomoTaskLabel");
  if(taskLabel)taskLabel.textContent=pomoTaskRef?"关联任务: "+pomoTaskRef.taskText:"未关联任务";
  // 同步顶栏 mini 计时器
  const mini=document.getElementById("miniTimer");
  if(mini&&pomoRunning&&pomoRemain>0){
    mini.innerHTML=`🍅 ${fmtPomoTime(pomoRemain)}`;
    mini.style.display="block";
    mini.onclick=()=>{activeNav="learn";render();};
  }else if(mini&&!(medRunning&&medRemain>0)){
    mini.style.display="none";
  }
}
function startPomo(){
  if(pomoRunning)return;
  if(pomoRemain<=0)pomoRemain=pomoDuration;
  // 记录开始时间和关联任务
  pomoStartTime=new Date().toISOString();
  if(!pomoTaskRef){
    const r=getDay(currentDate);
    const undone=r.tasks.filter(t=>!t.done);
    if(undone.length){
      const idx=r.tasks.indexOf(undone[0]);
      pomoTaskRef={taskIndex:idx,taskText:undone[0].text};
    }
  }
  pomoRunning=true;
  // 自动播放白噪音
  if(state.soundSettings.autoPomo)startSound(state.soundSettings.autoPomo);
  updatePomoDisplay();
  pomoTimer=setInterval(()=>{
    pomoRemain--;
    if(pomoRemain<=0){
      clearInterval(pomoTimer);pomoTimer=null;
      pomoRunning=false;
      pomoRemain=0;
      // 停止白噪音
      if(state.soundSettings.autoPomo)stopSound();
      // 完成一个番茄
      const r=getDay(currentDate);
      r.pomodoros=(r.pomodoros||0)+1;
      // 记录专注会话
      r.focusSessions=r.focusSessions||[];
      r.focusSessions.push({id:uid(),startTime:pomoStartTime,duration:pomoDuration,taskText:pomoTaskRef?pomoTaskRef.taskText:"",completed:true});
      pomoTaskRef=null;
      pomoStartTime=null;
      save();
      toast("🍅 番茄完成！休息一下吧");
      haptic([100,50,100]);
      updatePomoDisplay();
      render();
      // 播放提示音（简单 beep）
      try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();o.frequency.value=800;o.connect(ac.destination);o.start();setTimeout(()=>{o.stop();ac.close();},300);}catch(e){}
    }else{
      updatePomoDisplay();
    }
  },1000);
}
function pausePomo(){
  if(!pomoRunning)return;
  pomoRunning=false;
  clearInterval(pomoTimer);pomoTimer=null;
  updatePomoDisplay();
}
function resetPomo(){
  pomoRunning=false;
  clearInterval(pomoTimer);pomoTimer=null;
  pomoRemain=pomoDuration;
  pomoTaskRef=null;
  pomoStartTime=null;
  updatePomoDisplay();
}
function setPomoDuration(sec){
  pomoDuration=sec;
  if(!pomoRunning){pomoRemain=sec;updatePomoDisplay();}

}

/* ============== 冥想/呼吸计时器 ============== */
let medDuration=300;      // 总时长秒数，默认5分钟
let medRemain=300;        // 剩余秒数
let medRunning=false;     // 是否运行
let medTimer=null;        // setInterval ID
let medBreathPhase=0;     // 0=吸气4s 1=憋气7s 2=呼气8s
let medBreathTimer=null;  // 呼吸阶段计时器
let medStartTime=null;     // 开始时间
function fmtMedTime(s){const m=Math.floor(s/60),sec=s%60;return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;}
function breathPhaseLabel(p){return ["吸气","憋气","呼气"][p]||"";}
function breathPhaseDuration(p){return [4,7,8][p]||4;}
function updateMeditateDisplay(){
  const el=document.getElementById("medDisplay");
  if(el)el.textContent=fmtMedTime(medRemain);
  const status=document.getElementById("medStatus");
  if(status)status.textContent=medRunning?"跟随节奏呼吸…":"选一个时长，开始放松";
  const startBtn=document.getElementById("medStart");
  const stopBtn=document.getElementById("medStop");
  if(startBtn&&stopBtn){
    startBtn.style.display=medRunning?"none":"inline-block";
    stopBtn.style.display=medRunning?"inline-block":"none";
  }
  // 同步顶栏 mini 计时器
  const mini=document.getElementById("miniTimer");
  if(mini&&medRunning&&medRemain>0){
    mini.innerHTML=`🧘 ${fmtMedTime(medRemain)}`;
    mini.style.display="block";
    mini.onclick=()=>{activeNav="health";render();};
  }else if(mini&&!(pomoRunning&&pomoRemain>0)){
    mini.style.display="none";
  }
}
function updateBreathPhase(){
  const circle=document.getElementById("breathCircle");
  if(!circle)return;
  const phase=medBreathPhase;
  circle.className="breath-circle "+["inhale","hold","exhale"][phase];
  const text=circle.querySelector(".breath-text");
  const count=circle.querySelector(".breath-count");
  if(text)text.textContent=breathPhaseLabel(phase);
  let remain=breathPhaseDuration(phase);
  if(count)count.textContent=remain;
  // 倒数
  if(medBreathTimer)clearInterval(medBreathTimer);
  medBreathTimer=setInterval(()=>{
    remain--;
    if(remain<=0){
      medBreathPhase=(medBreathPhase+1)%3;
      updateBreathPhase();
    }else{
      if(count)count.textContent=remain;
    }
  },1000);
}
function startMeditate(){
  if(medRunning)return;
  if(medRemain<=0)medRemain=medDuration;
  medStartTime=new Date().toISOString();
  medRunning=true;
  // 自动播放白噪音
  if(state.soundSettings.autoMed)startSound(state.soundSettings.autoMed);
  medBreathPhase=0;
  updateMeditateDisplay();
  updateBreathPhase();
  medTimer=setInterval(()=>{
    medRemain--;
    if(medRemain<=0){
      stopMeditate(true);
    }else{
      updateMeditateDisplay();
    }
  },1000);
}
function stopMeditate(completed){
  medRunning=false;
  clearInterval(medTimer);medTimer=null;
  clearInterval(medBreathTimer);medBreathTimer=null;
  // 停止白噪音
  if(state.soundSettings.autoMed)stopSound();
  // 记录到健康数据
  if(completed&&medStartTime){
    const h=getDay(currentDate).health;
    h.meditation=h.meditation||[];
    h.meditation.push({id:uid(),startTime:medStartTime,duration:medDuration,completed:true});
    // 也勾选健康-运动签到
    const r=getDay(currentDate);
    r.checks["健康-运动"]=true;
    save();
    toast("🧘 冥想完成 "+Math.round(medDuration/60)+" 分钟，身心放松");
    haptic(200);
    // 冥想完成提示音（柔和低频）
    try{const ac=new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator();o.frequency.value=440;o.connect(ac.destination);o.start();setTimeout(()=>{o.stop();ac.close();},500);}catch(e){}
  }
  medRemain=medDuration;
  medBreathPhase=0;
  const circle=document.getElementById("breathCircle");
  if(circle){circle.className="breath-circle";}
  updateMeditateDisplay();
  if(completed)render();
}
function setMedDuration(sec){
  medDuration=sec;
  if(!medRunning){medRemain=sec;updateMeditateDisplay();}
  render();
}

/* ===== 应用内弹窗：替代被 iOS 主屏吞掉的原生 confirm/prompt ===== */
function showAppModal(o){
  return new Promise((resolve)=>{
    o=o||{};
    let root=document.getElementById("appModalRoot");
    if(!root){root=document.createElement("div");root.id="appModalRoot";document.body.appendChild(root);}
    const isPrompt=o.type==="prompt";
    const okText=o.okText||"确定", cancelText=o.cancelText||"取消";
    // 多选按钮模式（如云端同步冲突：用云端 / 保留本地 / 暂不处理）
    const choiceBtns=Array.isArray(o.buttons)?o.buttons.map((b,i)=>({text:String(b.text),value:(b.value===undefined?i:b.value),danger:!!b.danger,ghost:!!b.ghost})):null;
    root.innerHTML=`<div class="am-backdrop"></div><div class="am-card${o.danger?" am-danger":""}" role="dialog" aria-modal="true">
      ${o.title?`<div class="am-title">${esc(o.title)}</div>`:""}
      <div class="am-msg">${esc(o.message||"").replace(/\n/g,"<br>")}</div>
      ${isPrompt?`<input class="am-input" type="text" value="${esc(o.defaultValue||"")}" placeholder="${esc(o.placeholder||"")}"/>`:""}
      <div class="am-btns">
        ${choiceBtns?choiceBtns.map((b,i)=>`<button class="am-choice btn${b.danger?" am-danger-btn":""}${b.ghost?" btn-ghost":""}" data-i="${i}">${esc(b.text)}</button>`).join("")
          :(o.hideCancel?"":`<button class="am-cancel btn-ghost">${esc(cancelText)}</button>`)+`<button class="am-ok btn${o.danger?" am-danger-btn":""}">${esc(okText)}</button>`}
      </div></div>`;
    root.classList.add("am-show");
    const input=root.querySelector(".am-input");
    const okBtn=root.querySelector(".am-ok");
    const cancelBtn=root.querySelector(".am-cancel");
    const backdrop=root.querySelector(".am-backdrop");
    function close(val){root.classList.remove("am-show");root.innerHTML="";document.removeEventListener("keydown",onKey,true);resolve(val);}
    function onKey(e){
      if(e.key==="Escape"){e.preventDefault();close(isPrompt?null:false);}
      else if(e.key==="Enter"&&!choiceBtns){e.preventDefault();close(isPrompt?(input?input.value.trim():""):true);}
    }
    document.addEventListener("keydown",onKey,true);
    if(isPrompt&&input){input.focus();input.select();}
    else if(!choiceBtns&&okBtn) okBtn.focus();
    if(choiceBtns){
      root.querySelectorAll(".am-choice").forEach(btn=>{btn.onclick=()=>close(choiceBtns[+btn.dataset.i].value);});
    }else{
      okBtn.onclick=()=>close(isPrompt?(input?input.value.trim():""):true);
      if(cancelBtn)cancelBtn.onclick=()=>close(isPrompt?null:false);
      backdrop.onclick=()=>{if(!o.noBackdropClose)close(isPrompt?null:false);};
    }
  });
}
function appConfirm(message,opts){opts=opts||{};return showAppModal(Object.assign({type:"confirm",message:message},opts));}
function appPrompt(message,def,opts){opts=opts||{};return showAppModal(Object.assign({type:"prompt",message:message,defaultValue:def||""},opts));}

/* ============== 休息模式 · 魁北克冬夜 ============== */
const REST_LINES=["雪落得很慢，像时间舍不得走。","窗里有光，外面再冷也不慌。","这一刻，只属于你和自己。","城市睡了，灯还醒着。","慢慢呼吸，世界会等你。","远处的暖光，是也有人正过冬。","把今天轻轻放下，明天再说。","安静，是一种很贵的从容。"];
function restLineToday(){
  const d=new Date();
  const seed=Math.floor((Date.now())/86400000)%REST_LINES.length;
  return REST_LINES[seed];
}
let snowCtx=null,snowRAF=null,snowParts=[];
function startSnow(){
  const c=document.getElementById("snowCanvas");if(!c)return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  c.width=window.innerWidth*dpr;c.height=window.innerHeight*dpr;
  c.style.width=window.innerWidth+"px";c.style.height=window.innerHeight+"px";
  snowCtx=c.getContext("2d");snowCtx.scale(dpr,dpr);
  const W=window.innerWidth,H=window.innerHeight;
  const reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const n=reduce?30:110;
  snowParts=Array.from({length:n},()=>({
    x:Math.random()*W,y:Math.random()*H,
    len:6+Math.random()*22,sp:0.4+Math.random()*1.1,
    drift:(Math.random()-0.5)*0.85,a:0.3+Math.random()*0.55,w:0.7+Math.random()*1.5
  }));
  function frame(){
    snowCtx.clearRect(0,0,W,H);
    for(const p of snowParts){
      p.y+=p.sp;p.x+=p.drift;
      if(p.y>H+22){p.y=-22;p.x=Math.random()*W;}
      if(p.x>W+20)p.x=-20;if(p.x<-20)p.x=W+20;
      snowCtx.strokeStyle="rgba(245,240,230,"+p.a+")";
      snowCtx.lineWidth=p.w;snowCtx.lineCap="round";
      snowCtx.beginPath();snowCtx.moveTo(p.x,p.y);snowCtx.lineTo(p.x-p.drift*5,p.y-p.len);snowCtx.stroke();
    }
    snowRAF=requestAnimationFrame(frame);
  }
  cancelAnimationFrame(snowRAF);snowRAF=requestAnimationFrame(frame);
}
function stopSnow(){
  if(snowRAF)cancelAnimationFrame(snowRAF);snowRAF=null;
  const c=document.getElementById("snowCanvas");if(c&&snowCtx)snowCtx.clearRect(0,0,c.width,c.height);
}

/* 状态偏好：选中年份 */
function yrGetYear(){

}

/* 兼容中文 / 英文 书籍状态枚举 */
function yrNormStatus(s){
  if(s==="read"||s==="已读")return "read";
  if(s==="reading"||s==="在读")return "reading";
  if(s==="want"||s==="想读")return "want";
  return "";
}

/* 取数据中最早年份（用于年份选择器下限） */
function yrMinYear(){
  const cur = new Date().getFullYear();
  let min = cur - 5;
  const scan = (d)=>{ if(d){ const yy=parseInt(String(d).slice(0,4),10); if(!isNaN(yy)&&yy<min)min=yy; } };
  Object.keys(state.entries||{}).forEach(scan);
  Object.keys(state.reflections||{}).forEach(scan);
  (state.books||[]).forEach(b=>scan(b.end));
  (state.capsules||[]).forEach(c=>{ if(c.createdAt)scan(fmtDate(new Date(c.createdAt))); });
  return Math.min(min, cur-1);
}

/* 统计某一年的聚合数据 */
function yrStats(y){
  y = String(y);
  const s = {
    booksRead:0, booksReading:0, booksWant:0,
    reflCount:0, weekRev:0, capCount:0,
    annualGoals:0, maxRun:0, pomo:0, finCount:0
  };
  (state.books||[]).forEach(b=>{
    const st = yrNormStatus(b.status);
    if(st==="read"){ if(b.end && String(b.end).slice(0,4)===y) s.booksRead++; }
    else if(st==="reading") s.booksReading++;
    else if(st==="want") s.booksWant++;
  });
  Object.keys(state.reflections||{}).forEach(d=>{
    if(d.slice(0,4)===y) s.reflCount += (state.reflections[d]||[]).length;
  });
  Object.keys(state.reviews||{}).forEach(k=>{
    if(k.slice(0,4)===y) s.weekRev++;
  });
  (state.capsules||[]).forEach(c=>{
    if(c.createdAt){ const cy = new Date(c.createdAt).getFullYear(); if(String(cy)===y) s.capCount++; }
  });
  s.annualGoals = (state.goals||[]).filter(g=>g.level==="annual").length;
  // 年内最长连续打卡
  const yDates = Object.keys(state.entries)
    .filter(d=>d.slice(0,4)===y && state.entries[d] && state.entries[d].checkIn)
    .sort();
  let cur=0;
  for(let i=0;i<yDates.length;i++){
    if(i>0 && yDates[i]===addDays(yDates[i-1],1)) cur++; else cur=1;
    if(cur>s.maxRun) s.maxRun=cur;
  }
  if(y===String(new Date().getFullYear())) s.maxRun = Math.max(s.maxRun, streakDays());
  // 番茄 / 记账
  Object.keys(state.entries).forEach(d=>{
    if(d.slice(0,4)!==y) return;
    const e = state.entries[d];
    if(!e) return;
    s.pomo += (e.pomodoros||0);
    if(e.finance){ s.finCount += (e.finance.in?e.finance.in.length:0) + (e.finance.out?e.finance.out.length:0); }
  });
  s.year = y;
  return s;
}

/* 自动生成年度总结文案 */
function yrSummary(s,y){
  const p=[];
  if(s.booksRead) p.push(`读完 <b>${s.booksRead}</b> 本书`);
  if(s.reflCount) p.push(`写下 <b>${s.reflCount}</b> 条思考`);
  if(s.weekRev) p.push(`完成 <b>${s.weekRev}</b> 次周复盘`);
  if(s.pomo) p.push(`累计 <b>${s.pomo}</b> 个番茄钟`);
  if(s.finCount) p.push(`记录 <b>${s.finCount}</b> 笔账目`);
  if(s.maxRun) p.push(`最长连续打卡 <b>${s.maxRun}</b> 天`);
  if(p.length) return `${y} 年，你${p.join("、")}。`;
  return `${y} 年还没有太多记录，去各个模块留下你的足迹吧 —— 读一本好书、写一条思考，都是给未来的礼物。`;
}

/* 今日历史：往年同月同日的记录 */
function yrOnThisDay(){
  const t = new Date();
  const md = String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  const thisY = String(t.getFullYear());
  const items = [];
  Object.keys(state.reflections||{}).forEach(d=>{
    if(d.slice(5)===md && d.slice(0,4)!==thisY){
      (state.reflections[d]||[]).forEach(r=>items.push({date:d,type:"reflect",text:r.text||"",mood:r.mood||""}));
    }
  });
  (state.capsules||[]).forEach(c=>{
    if(c.createdAt){
      const cd=new Date(c.createdAt); const cmd=String(cd.getMonth()+1).padStart(2,"0")+"-"+String(cd.getDate()).padStart(2,"0");
      if(cmd===md) items.push({date:fmtDate(cd),type:"capsule",title:c.title||"",text:c.text||""});
    }
    if(c.unlockDate && c.unlockDate.slice(5)===md && c.unlockDate.slice(0,4)!==thisY)
      items.push({date:c.unlockDate,type:"capsule-open",title:c.title||""});
  });
  Object.keys(state.entries).forEach(d=>{
    if(d.slice(5)===md && d.slice(0,4)!==thisY){
      const e=state.entries[d]; if(!e) return;
      const tasks=(e.tasks||[]);
      const has = e.checkIn || (e.pomodoros||0) || tasks.length;
      if(has) items.push({date:d,type:"entry",e:e,tasksDone:tasks.filter(x=>x.done).length,tasksTotal:tasks.length});
    }
  });
  items.sort((a,b)=>b.date.localeCompare(a.date));
  return items;
}

function hmLevel(s){
  if(s<=0)return 0;
  if(s<=2)return 1;
  if(s<=5)return 2;
  if(s<=9)return 3;
  return 4;
}
function hmDayScore(date,filter){
  const e=state.entries[date];
  if(!e)return 0;
  const d=getDay(date);
  if(filter==="签到")return d.checkIn?1:0;
  if(filter&&filter!=="全部"){
    const prefix=filter+"-";let n=0;
    for(const k in (d.checks||{})){if(k.indexOf(prefix)===0&&d.checks[k])n++;}
    return n;
  }
  let s=0;
  if(d.checkIn)s+=3;
  const done=(d.tasks||[]).filter(t=>t.done).length;
  s+=Math.min(done*2,6);
  const checksTrue=Object.values(d.checks||{}).filter(Boolean).length;
  s+=checksTrue;
  const refls=(state.reflections&&state.reflections[date])||[];
  s+=refls.length*2;
  s+=(d.pomodoros||0);
  const fin=d.finance||{};
  if((fin.in&&fin.in.length)||(fin.out&&fin.out.length))s+=1;
  const rev=d.review&&d.review.text&&d.review.text.trim();
  const grw=d.growth&&d.growth.text&&d.growth.text.trim();
  if(rev||grw)s+=2;
  return s;
}
function hmBuildGrid(y,filter){
  const jan1=new Date(y,0,1);
  const janDow=jan1.getDay(); // 0=周日
  const off=(janDow===0?6:janDow-1);
  const start=new Date(y,0,1); start.setDate(1-off);
  const cells=[]; const monthMarks=[];
  let prevMonth=-1, activeDays=0, total=0, maxStreak=0, cur=0;
  for(let c=0;c<53;c++){
    const colFirst=addDays(fmtDate(start),c*7);
    const colMonth=parseDate(colFirst).getMonth();
    if(colMonth!==prevMonth){ monthMarks.push({col:c,label:(colMonth+1)+"月"}); prevMonth=colMonth; }
    for(let r=0;r<7;r++){
      const ds=addDays(colFirst,r);
      const dt=parseDate(ds);
      const inYear=dt.getFullYear()===y;
      const score=inYear?hmDayScore(ds,filter):0;
      if(inYear){
        if(score>0){ activeDays++; cur++; if(cur>maxStreak)maxStreak=cur; }
        else cur=0;
        total+=score;
      }
      const lvl=inYear?hmLevel(score):0;
      const cls="hm-cell "+(inYear?("in l"+lvl):"out");
      const title=inYear?`title="${ds} · 活跃 ${score}"`:"";
      const act=inYear?`data-mod-action="hm-day" data-date="${ds}"`:"";
      cells.push(`<div class="${cls}" ${title} ${act}></div>`);
    }
  }
  return {cells,monthMarks,activeDays,total,maxStreak};
}

/* 番茄花园：把完成的番茄变成一座会生长的小花园（id=tomgarden，动作前缀 tg） */

// 真实累计番茄数 = 遍历所有 entry 累加 pomodoros
function tgRealPomodoros(){
  let s=0;

// 确定性伪随机（基于序号，保证每次渲染同一株位置一致）
function tgRand(i){
  const x=Math.sin((i+1)*127.1+311.7)*43758.5453;
  return x-Math.floor(x);
}

// 单株植物（基点 0,0，向上生长）
function tgPlant(){
  return `
    <line class="tg-stem" x1="0" y1="0" x2="0" y2="-26"/>
    <ellipse class="tg-leaf" cx="-7" cy="-13" rx="6.5" ry="3.4" transform="rotate(-32 -7 -13)"/>
    <ellipse class="tg-leaf" cx="7" cy="-9" rx="6.5" ry="3.4" transform="rotate(32 7 -9)"/>
    <circle class="tg-blossom" cx="0" cy="-31" r="7"/>
    <circle class="tg-center" cx="0" cy="-31" r="3"/>`;
}

// 花园 SVG：植物数很多时(>60)只画最近 60 株，计数显示全部
function tgGardenSvg(n){
  const W=800,H=400,groundY=322,margin=46;
  let plants="";
  if(n<=0){
    plants=`<text class="tg-empty" x="${W/2}" y="${groundY-44}" text-anchor="middle">还没有番茄，完成一个番茄钟来种下第一株 🌱</text>`;
  }else{
    const count=Math.min(n,60);
    const span=W-2*margin;
    const step=count<=1?0:span/(count-1);
    for(let j=0;j<count;j++){
      const idx=n-count+j;                       // 实际株序号（最近 60 株）
      const x=count<=1?W/2:margin+j*step;
      const jx=(tgRand(idx+1)-0.5)*Math.min(step*0.5,18);
      const jy=(tgRand(idx+2)-0.5)*8;
      const s=0.62+(count<=1?0.5:(j/(count-1))*0.6); // 后种的大一点，体现“生长”
      const c=((idx%3)+3)%3;
      const delay=((j%12)*0.32).toFixed(2);
      plants+=`<g transform="translate(${(x+jx).toFixed(1)},${(groundY+jy).toFixed(1)}) scale(${s.toFixed(3)})"><g class="tg-plant tg-c${c}" style="animation-delay:${delay}s">${tgPlant()}</g></g>`;
    }
  }
  return `<svg class="tg-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="番茄花园，共 ${n} 株植物">
    <rect class="tg-sky" x="0" y="0" width="${W}" height="${H}"/>
    <circle class="tg-sun" cx="690" cy="72" r="36"/>
    <circle class="tg-sun2" cx="690" cy="72" r="22"/>
    <rect class="tg-ground" x="0" y="${groundY}" width="${W}" height="${H-groundY}"/>
    <rect class="tg-grass" x="0" y="${groundY-3}" width="${W}" height="6"/>
    ${plants}
  </svg>`;
}

/* 间隔复习（spaced repetition）——基于遗忘曲线的复习调度 */
let srActiveId=null;      // 当前正在复习的卡 id
let srRevealed=false;     // 当前卡是否已翻面显示答案

const SR_DAY=86400000;
function srIntervalMs(box){
  // box: 升级后的目标箱  1→1天 2→3天 3→7天 4→16天 5→30天
  const MAP={1:1,2:3,3:7,4:16,5:30};
  return (MAP[box]||1)*SR_DAY;
}

/* 自动同步：把尚未入卡的 memos / quotes / notes 加入复习卡（去重） */
function srSync(){
  state.spaced=state.spaced||{cards:[]};
  const cards=state.spaced.cards||(state.spaced.cards=[]);
  const have=id=>cards.some(c=>c.refId===id);
  const add=(kind,refId)=>{
    if(!refId||have(refId))return;
    const now=Date.now();
    cards.push({id:uid(),kind,refId,box:0,next:now,last:now,created:now});
  };
  (state.memos||[]).forEach(m=>add('memo',m.id));
  (state.quotes||[]).forEach(q=>add('quote',q.id));
  (state.notes||[]).forEach(n=>add('note',n.id));
  // 清理来源已删除的卡，避免孤儿卡
  const exists=c=>{
    if(c.kind==='memo')return (state.memos||[]).some(m=>m.id===c.refId);
    if(c.kind==='quote')return (state.quotes||[]).some(q=>q.id===c.refId);
    if(c.kind==='note')return (state.notes||[]).some(n=>n.id===c.refId);
    return false;
  };
  state.spaced.cards=cards.filter(exists);
  return state.spaced;
}

/* 取一张复习卡对应的源内容（正面/答案/元信息） */
function srSource(c){
  if(c.kind==='memo'){
    const m=(state.memos||[]).find(x=>x.id===c.refId);
    if(!m)return null;
    const t=m.text||'';
    const meta=[m.cat?('分类 '+m.cat):'',m.pinned?'📌置顶':'',m.done?'✅已完成':''].filter(Boolean).join('   ');
    return {kindLabel:'MEMO · 备忘',front:t.slice(0,24)+(t.length>24?'…':''),back:t,meta};
  }
  if(c.kind==='quote'){
    const q=(state.quotes||[]).find(x=>x.id===c.refId);
    if(!q)return null;
    const ex=q.excerpt||'';
    let back=ex;
    if(q.reflection)back+='\n\n💭 反思：'+q.reflection;
    const meta=[q.sourceType?('类型 '+q.sourceType):'',q.source?('来源 '+q.source):'',q.date?('日期 '+q.date):''].filter(Boolean).join('   ');
    return {kindLabel:'QUOTE · 摘抄',front:ex.slice(0,40)+(ex.length>40?'…':''),back:back,meta};
  }
  const n=(state.notes||[]).find(x=>x.id===c.refId);
  if(!n)return null;
  return {kindLabel:'NOTE · 笔记',front:n.title||'(无标题)',back:n.body||'',meta:n.created_at?('创建 '+n.created_at):''};
}

function srFmtWhen(ms){
  const d=ms-Date.now();
  if(d<=0)return '现在';
  if(d<3600000)return Math.ceil(d/60000)+' 分钟后';
  if(d<SR_DAY)return Math.ceil(d/3600000)+' 小时后';
  return Math.ceil(d/SR_DAY)+' 天后';
}

// 到期检测：由主代理接入通知循环（如 scheduleNotifCheck 内调用）
function checkReminders(){
  if (!settings.notifEnabled || !("Notification" in window) || Notification.permission !== "granted") return;
  const now = Date.now();
  const d = new Date();
  const hhmm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  const today = fmtDate(d);
  for (const r of (state.reminders || [])){
    if (!r.enabled) continue;
    let due = false;
    if (r.type === "once"){
      due = !!r.date && r.date <= today && r.time <= hhmm && !r.firedOnce;
    } else if (r.type === "daily"){
      // 每天该时刻弹一次；用 20 分钟最小窗口避免高频检查时重复打扰
      due = r.time <= hhmm && (now - (r.lastFired || 0)) > Math.min(20*60000, 24*3600000);
    } else if (r.type === "interval"){
      due = (now - (r.lastFired || 0)) >= (r.intervalMin || 60) * 60000;
    }
    if (due){
      try {
        new Notification("🔔 人生工作台", { body: r.title, tag: "rm-" + r.id });
      } catch (e) {}
      r.lastFired = now;
      if (r.type === "once") r.firedOnce = true;
      save();
    }
  }
}

/* === MODULE JS: graph === */
/* 模块联动图谱：纯 SVG 环形布局，展示各功能模块的数据联动关系 */

/* 固定节点集合（27 个模块） */
const GRAPH_NODES=["工作台","学习","健康","资产","关系","书架","课程","项目","目标","思考","胶囊","摘抄","周复盘","周计划","笔记","备忘录","看板","生命树","声音","储备库","趋势","年回顾","热力图","番茄花园","复习","提醒","图谱"];

/* 静态关联边（端点别名，把"打卡/番茄钟/记账"映射到真实节点；自环会被忽略） */
const GRAPH_ALIAS={"打卡":"热力图","番茄钟":"番茄花园","记账":"资产"};
const GRAPH_STATIC=[
  ["项目","目标"],["项目","笔记"],["思考","备忘录"],["备忘录","笔记"],
  ["课程","项目"],["目标","周计划"],["书架","摘抄"],["健康","打卡"],
  ["番茄钟","项目"],["周复盘","目标"],["胶囊","思考"],["资产","记账"]
];
function alias(n){return GRAPH_ALIAS[n]||n;}

/* ---- 取数辅助：各模块的真实数据量 ---- */
function gpDaysWith(pred){
  const e=state.entries||{};let n=0;
  for(const k in e){if(e[k]&&pred(e[k]))n++;}return n;
}
function gpHasStudy(e){
  const st=e.study;if(!st)return false;
  return !!( (st.vocal&&st.vocal.vocal_time)||(st.piano&&st.piano.piano_song)||
    (st.english&&(st.english.en_words||st.english.en_read||st.english.en_listen))||
    (st.reading&&st.reading.minutes)||(st.policy&&st.policy.text) );
}
function gpHasHealth(e){
  const h=e.health;if(!h)return false;
  return !!( (h.exercise&&(h.exercise.minutes||h.exercise.type))||(h.feeling)||
    (h.sleep&&(h.sleep.bed||h.sleep.wake)) );
}
function gpHasReflect(e){
  return !!( (e.review&&e.review.text&&e.review.text.trim())||
    (e.growth&&e.growth.text&&e.growth.text.trim()) );
}
function gpFinanceTx(){
  const e=state.entries||{};let n=0;
  for(const k in e){const f=e[k]&&e[k].finance;if(f){
    n+=(f.in?f.in.length:0)+(f.out?f.out.length:0)+(f.invest?f.invest.length:0);
  }}return n;
}
function gpCoursesTotal(){
  const c=state.courses||{};let n=0;
  for(const d in c){if(Array.isArray(c[d]))n+=c[d].length;}return n;
}
function gpCourseNames(){
  const c=state.courses||{};const set=new Set();
  for(const d in c){if(Array.isArray(c[d]))c[d].forEach(x=>{if(x&&x.name)set.add(x.name);});}return set;
}
function gpReflectionsTotal(){
  const r=state.reflections||{};let n=0;
  for(const d in r){if(Array.isArray(r[d]))n+=r[d].length;}return n;
}
function gpCheckinDays(){
  const e=state.entries||{};let n=0;
  for(const k in e){if(e[k]&&e[k].checkIn)n++;}return n;
}
function gpPomodoros(){
  const e=state.entries||{};let n=0;
  for(const k in e){const x=e[k];if(x){
    n+=(x.pomodoros||0)+(x.focusSessions?x.focusSessions.length:0);
  }}return n;
}
function gpCount(name){
  const s=state;
  switch(name){
    case "工作台": return Object.keys(s.entries||{}).length;
    case "学习":   return gpDaysWith(gpHasStudy);
    case "健康":   return gpDaysWith(gpHasHealth);
    case "资产":   return gpFinanceTx();
    case "关系":   return (s.contacts||[]).length;
    case "书架":   return (s.books||[]).length;
    case "课程":   return gpCoursesTotal();
    case "项目":   return (s.projects||[]).length;
    case "目标":   return (s.goals||[]).length;
    case "思考":   return gpDaysWith(gpHasReflect);
    case "胶囊":   return (s.capsules||[]).length;
    case "摘抄":   return (s.quotes||[]).length;
    case "周复盘": return gpReflectionsTotal();
    case "周计划": return (s.goals||[]).filter(g=>g.level==="weekly").length;
    case "笔记":   return (s.notes||[]).length;
    case "备忘录": return (s.memos||[]).length;
    case "看板":   return 0;
    case "生命树": return (s.treeData&&s.treeData.level)||1;
    case "声音":   return (s.alarms||[]).length;
    case "储备库": return 0;
    case "趋势":   return 0;
    case "年回顾": return (s.goals||[]).filter(g=>g.level==="annual").length;
    case "热力图": return gpCheckinDays();
    case "番茄花园": return gpPomodoros();
    case "复习":   return 0;
    case "提醒":   return 0;
    case "图谱":   return 0;
    default: return 0;
  }
}

/* ---- 主视图 ---- */
function viewGraph(){
  state.graph=state.graph||{showDyn:true};
  const nodes=GRAPH_NODES, N=nodes.length;
  const W=820,H=820,cx=W/2,cy=H/2,R=330;
  const pos={};
  nodes.forEach((name,i)=>{
    const ang=-Math.PI/2 + i*2*Math.PI/N;
    pos[name]={x:cx+R*Math.cos(ang), y:cy+R*Math.sin(ang), ang};
  });
  const counts={}; nodes.forEach(n=>counts[n]=gpCount(n));
  const maxC=Math.max(1,...nodes.map(n=>counts[n]));
  const rad=n=>9 + Math.sqrt(counts[n]/maxC)*22;

  /* 静态边（始终显示） */
  const staticEdges=GRAPH_STATIC
    .map(([a,b])=>[alias(a),alias(b)])
    .filter(([a,b])=>a&&b&&a!==b&&pos[a]&&pos[b]);

  /* 动态边（依据真实数据，受开关控制） */
  const dynList=[]; const highlight={};
  if(state.graph.showDyn){
    const courseNames=gpCourseNames();
    const noteIds=new Set((state.notes||[]).map(n=>n.id));
    const projIds=new Set((state.projects||[]).map(p=>p.id));
    (state.projects||[]).forEach(p=>{ if(p.courseRef&&courseNames.has(p.courseRef)) dynList.push(["项目","课程"]); });
    (state.memos||[]).forEach(m=>{ if(m.linkedNote&&noteIds.has(m.linkedNote)) dynList.push(["备忘录","笔记"]); });
    (state.notes||[]).forEach(n=>{ if(n.related&&n.related.projects&&n.related.projects.some(id=>projIds.has(id))) dynList.push(["笔记","项目"]); });
    if((state.goals||[]).some(g=>g.level==="annual")) highlight["目标"]=true;
    /* 去重 */
    const seen=new Set();
    for(let i=dynList.length-1;i>=0;i--){
      const key=[dynList[i][0],dynList[i][1]].sort().join("|");
      if(seen.has(key)) dynList.splice(i,1); else seen.add(key);
    }
  }

  /* 构建 SVG */
  let svg=`<svg class="graph-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="模块联动图谱">`;
  staticEdges.forEach(([a,b])=>{
    const p=pos[a],q=pos[b];
    svg+=`<line class="graph-edge" x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="var(--line)" stroke-width="1.2" opacity="0.55"/>`;
  });
  if(state.graph.showDyn){
    dynList.forEach(([a,b])=>{
      const p=pos[a],q=pos[b];
      svg+=`<line class="graph-edge-dyn" x1="${p.x.toFixed(1)}" y1="${p.y.toFixed(1)}" x2="${q.x.toFixed(1)}" y2="${q.y.toFixed(1)}" stroke="var(--warm)" stroke-width="2" opacity="0.85"/>`;
    });
  }
  nodes.forEach(name=>{
    const p=pos[name], c=counts[name], r=rad(name);
    const hl=!!highlight[name];
    const fill = hl? "var(--good)" : (c>0? "var(--accent)" : "var(--card-soft)");
    const stroke = hl? "var(--warm)" : "var(--line)";
    const sw = hl? 3 : 1.5;
    const op = (c===0 && !hl)? 0.55 : 1;
    const cosA=Math.cos(p.ang), sinA=Math.sin(p.ang);
    const tx=p.x+(r+12)*cosA, ty=p.y+(r+12)*sinA;
    const anchor = cosA>0.25?"start":(cosA<-0.25?"end":"middle");
    const base = sinA>0.25?"hanging":(sinA<-0.25?"auto":"middle");
    svg+=`<g class="graph-node" opacity="${op}">
      <title>${esc(name)} · 数据量 ${c}</title>
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
      <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" dominant-baseline="${base}" class="graph-label">${esc(name)}<tspan class="graph-count" dx="3">${c}</tspan></text>
    </g>`;
  });
  svg+=`</svg>`;

  return `<div class="card">
    <div class="section-eyebrow">MODULE MAP</div>
    <div class="section-title">🕸 模块联动图谱</div>
    <p class="section-desc">各功能模块之间的数据联动关系。静态关联始终显示；真实数据关联依据你的实际数据高亮（橙色）。</p>
    <div class="graph-bar">
      <button class="btn ${state.graph.showDyn?'':'btn-ghost'}" data-mod-action="gp-dyn">${state.graph.showDyn?'● 显示真实数据关联':'○ 显示真实数据关联'}</button>
      <div class="graph-legend">
        <span><i class="lg-line" style="background:var(--line)"></i>静态关联</span>
        <span><i class="lg-line" style="background:var(--warm)"></i>真实数据关联</span>
      </div>
    </div>
    <div class="graph-svg-wrap">${svg}</div>
    <div class="graph-note">共 ${N} 个模块 · 静态关联 ${staticEdges.length} 条 · 真实数据关联 ${state.graph.showDyn?dynList.length:0} 条（悬停节点查看数据量）</div>
  </div>`;
}

function viewBody(){

  const today=currentDate;
  const todayData=state.bodyData[today]||{};

  // 取最近 N 条历史
  const dates=Object.keys(state.bodyData).sort().reverse();
  const recent=dates.slice(0,30).reverse();

  // 各指标最新值
  const latest={};
  ["weight","bodyFat","hr","steps"].forEach(k=>{
    for(const d of dates){
      if(state.bodyData[d]&&state.bodyData[d][k]!=null&&state.bodyData[d][k]!==""){
        latest[k]={v:state.bodyData[d][k],d:d};break;
      }
    }
  });

  const latestHtml=["weight","bodyFat","hr","steps"].map(k=>{
    const META={weight:["⚖️ 体重","kg"],bodyFat:["🔥 体脂","%"],hr:["❤️ 心率","bpm"],steps:["👟 步数","步"]};
    const m=META[k];const l=latest[k];
    return `<div class="body-latest-item">
      <div class="v">${l?l.v:"—"}</div>
      <div class="l">${m[0]} ${l?'<span style="font-size:10px;color:var(--muted)">'+m[1]+'</span>':''}</div>
      <div class="d">${l?l.d.slice(5):"暂无"}</div>
    </div>`;
  }).join("");

  // 体重趋势图（最近 14 天有点子的）
  const wPts=recent.filter(d=>state.bodyData[d]&&state.bodyData[d].weight).map(d=>({label:d.slice(5),value:+state.bodyData[d].weight}));
  let wChart="";
  if(wPts.length>=2){
    const vals=wPts.map(p=>p.value);const minV=Math.min(...vals)-1,maxV=Math.max(...vals)+1;
    const W=300,H=120,pad=24,bw=W/Math.max(wPts.length,1);
    const x=i=>pad+i*bw;
    const y=v=>H-10-(v-minV)/(maxV-minV||1)*(H-30);
    const path=wPts.map((p,i)=>(i?"L":"M")+x(i)+","+y(p.value)).join("");
    const dots=wPts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.value)}" r="3" fill="var(--warm)"/>`).join("");
    wChart=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:320px;display:block;margin:0 auto">
      <line x1="${pad}" y1="${H-10}" x2="${W}" y2="${H-10}" stroke="var(--line)"/>
      <path d="${path}" fill="none" stroke="var(--warm)" stroke-width="2"/>
      ${dots}
      ${wPts.map((p,i)=>`<text x="${x(i)}" y="${H-2}" text-anchor="middle" font-size="8" fill="var(--muted)">${p.label}</text>`).join("")}
    </svg>`;
  }

  // 历史 5 条
  const histHtml=dates.slice(0,5).map(d=>{
    const e=state.bodyData[d];if(!e)return"";
    const parts=[];
    if(e.weight)parts.push("⚖️ "+e.weight+"kg");
    if(e.bodyFat)parts.push("🔥 "+e.bodyFat+"%");
    if(e.hr)parts.push("❤️ "+e.hr);
    if(e.steps)parts.push("👟 "+e.steps);
    if(!parts.length)return"";
    return `<div class="body-history-row"><span style="color:var(--muted)">${d}</span><span>${parts.join(" · ")}</span></div>`;
  }).filter(Boolean).join("");

  return `<div class="card">
    <div class="section-eyebrow">BODY TRACKER</div>
    <div class="section-title">⚖️ 身体数据</div>
    <p class="section-desc">记录体重、体脂、心率、步数。看得见的趋势，是坚持的理由。</p>

    <div class="body-latest">${latestHtml}</div>

    <div class="section-eyebrow" style="margin-top:8px">📝 今日记录（${today}）</div>
    <div class="body-metric-input">
      <input class="tl-input" type="number" step="0.1" data-body="weight" value="${todayData.weight||""}" placeholder="体重 (kg)"/>
      <input class="tl-input" type="number" step="0.1" data-body="bodyFat" value="${todayData.bodyFat||""}" placeholder="体脂率 (%)"/>
      <input class="tl-input" type="number" data-body="hr" value="${todayData.hr||""}" placeholder="静息心率 (bpm)"/>
      <input class="tl-input" type="number" data-body="steps" value="${todayData.steps||""}" placeholder="步数"/>
    </div>
    <textarea class="big-text" rows="2" data-body="note" placeholder="今日身体感受…">${esc(todayData.note||"")}</textarea>

    ${wChart?`<div class="section-eyebrow" style="margin-top:14px">📈 体重趋势（近 ${wPts.length} 次记录）</div>
    <div class="body-chart-box">${wChart}</div>`:""}

    ${histHtml?`<div class="section-eyebrow" style="margin-top:8px">📋 最近记录</div>
    <div class="list">${histHtml}</div>`:""}
  </div>`;
}

    if(d>=weekAgo&&d<=today){const e=state.entries[d];if(e)weekEntries.push({date:d,tasksDone:(e.tasks||[]).filter(t=>t.done).length,tasksTotal:(e.tasks||[]).length,pomodoros:e.pomodoros||0,checkIn:!!e.checkIn,studyMin:(e.focusSessions||[]).reduce((s,f)=>s+Math.round((f.duration||0)/60),0),finOut:((e.finance&&e.finance.out)||[]).reduce((s,x)=>s+(+x.amount||0),0),sleep:e.sleep||{}});}
  });
  // 目标
  const goals=(state.goals||[]).map(g=>({title:g.title,level:g.level,progress:g.progress||0,status:g.status||""}));
  // 书
  const books={read:(state.books||[]).filter(b=>b.status==="read").length,reading:(state.books||[]).filter(b=>b.status==="reading").length,want:(state.books||[]).filter(b=>b.status==="want").length};
  // 习惯打卡近7天
  const checkin=weekEntries.map(e=>({date:e.date,done:e.checkIn}));
  // 生命树
  const tree=state.treeData?{level:state.treeData.level,nutrients:state.treeData.nutrients}:{};
  // 番茄
  const totalPomo=weekEntries.reduce((s,e)=>s+e.pomodoros,0);
  // 身体数据近7天
  const bodyData={};
  Object.keys(state.bodyData||{}).sort().reverse().slice(0,7).forEach(d=>{if(state.bodyData[d])bodyData[d]=state.bodyData[d];});
  // 提醒
  const reminders=(state.reminders||[]).filter(r=>r.enabled).map(r=>r.title);
  // 购物
  const shopPending=state.shopping?Object.values(state.shopping.lists||{}).reduce((s,l)=>s+l.filter(i=>!i.done).length,0):0;

  return {
    currentDate:today,
    streak:streakDays(),
    today:{
      tasksDone:(r.tasks||[]).filter(t=>t.done).length,
      tasksTotal:(r.tasks||[]).length,
      pomodoros:r.pomodoros||0,
      checkIn:!!r.checkIn,
      studyMood:r.study?r.study.mood:"",
      sleep:r.health?r.health.sleep:{},
      exercise:r.health?r.health.exercise:{},
      water:r.health?Object.values(r.health.water||{}).filter(Boolean).length:0,
      financeOut:((r.finance&&r.finance.out)||[]).map(x=>x.cat+":"+x.amount).join(", "),
    },
    week:weekEntries,
    goals,books,checkin,tree,totalPomo,bodyData,reminders,shopPending
  };
}

// 构造系统提示（带缓存：只在数据版本变化或超过 30s 时重新计算）
let _dataVersion=0;
function bumpDataVersion(){_dataVersion++;_aiCache.timestamp=0;}
function buildSystemPrompt(){
  const now=Date.now();
  const key=currentDate+"|"+_dataVersion;
  if(_aiCache.key===key&&_aiCache.prompt&&(now-_aiCache.timestamp)<30000)return _aiCache.prompt;
  const ctx=collectContextData();
  const prompt=`你是"人生工作台"的 AI 助手，服务于用户鹿7铭。你能读取用户的实时工作台数据来帮他分析、总结、建议。

当前工作台数据（JSON）：
${JSON.stringify(ctx,null,2)}

规则：
1. 回答简洁有力，用中文，不要过度客套
2. 基于真实数据分析，不要编造数据里没有的东西
3. 给建议要具体可执行，不要空话
4. 如果用户要求"记一笔/加提醒/加目标/加购物"等录入操作，只回复纯 JSON（不要 markdown 代码块、不要多余文字）：{"action":"record","type":"finance|reminder|goal|shopping|body","data":{...}}
   - finance: data={cat:"餐饮|学习|娱乐|交通|其他",amount:数字,note:"物品或场景",direction:"in|out"}
     * direction: in=收入（收/收到/入账/进账/转账给我/工资/红包/退款/分成/利息），out=支出（花了/购买/付/买/充值/消费）；默认 out
     * 重要：如果用户只说"输入X元"/"录入X元"/"记一笔X元"，方向未定——根据上下文判断（如之前聊过工资/红包→in，之前聊过买/花→out）
     * 分类（按优先级，命中任一关键词即可）：
       餐饮：吃/饭/菜/餐/咖啡/奶茶/外卖/早午晚夜餐/宵/零食/水果/饮料/水/酒/烧烤/火锅/面条/饺子
       学习：书/课/培训/学费/文具/订阅/课程/讲座/考试/资料/网课/学
       娱乐：电影/游戏/演出/旅游/景点/ktv/酒吧/聚会/会员/演唱会/演唱会/门票/手办/玩具
       交通：打车/地铁/公交/加油/停车/高铁/机票/油费/过路费/骑车/单车/出租车/网约车
       其他：购物/水电/房租/医疗/日用/买/购/账/账单
     * 完全没物品词时（如"花了50"/"支出10块"）：归 其他，note 里说明"未指定具体用途"
   - shopping: data={name:"物品名",qty:"数量或单位"}
   - reminder: data={title:"标题",date:"YYYY-MM-DD(可选)",time:"HH:MM(可选)",type:"once|daily|weekly",intervalMin:分钟数(仅type非once时)}
   - goal: data={title:"目标",level:"annual|quarter|month"}
   - body: data={weight:数字,bodyFat:数字,hr:数字,steps:数字}(只填用户提到的字段)
5. 保持温暖但务实的语气，像一个懂你的朋友`;
  _aiCache={key,prompt,timestamp:now};
  return prompt;
}

let aiMsgs=[];
function aiRenderMsgs(){
  const el=document.getElementById("aiMsgs");
  if(!el)return;
  el.innerHTML=aiMsgs.map(m=>
    `<div class="ai-msg ${m.role==='user'?'user':'bot'} ${m.thinking?'thinking':''}">
      <div class="bubble">${esc(m.content)}</div>
    </div>`
  ).join("");
  el.scrollTop=el.scrollHeight;
}
function aiAddMsg(role,content,thinking){
  aiMsgs.push({role,content,thinking});
  aiRenderMsgs();
  // 小鹿气泡：AI 回复时头顶弹气泡
  if(role==="bot"){
    const short=content.replace(/\n/g," ").slice(0,40)+(content.length>40?"…":"");
    if(typeof deerBubble==="function")deerBubble(short,4000);
  }
}
function aiUpdateLast(content){
  if(aiMsgs.length){aiMsgs[aiMsgs.length-1].content=content;aiMsgs[aiMsgs.length-1].thinking=false;aiRenderMsgs();}
}

async function aiSend(text){
  text=(text||"").trim();
  if(!text)return;
  // 拦截：用户要求配置 key
  if(text.includes("配置")&&text.includes("key")){
    aiAddMsg("user",text);
    const newKey=await appPrompt("请粘贴你的 DeepSeek API key（get → https://platform.deepseek.com/）\n\n说明：key 只存本地 localStorage，刷新不丢失，绝不上传。\n\n如需清除：在控制台运行 localStorage.removeItem('ai_deepseek_key')");
    if(newKey&&newKey.trim()){
      DEEPSEEK_KEY=newKey.trim();
      localStorage.setItem("ai_deepseek_key",DEEPSEEK_KEY);
      aiAddMsg("bot","✅ key 已保存，刷新也不丢失。可以问我任何事了～");
    }else{
      aiAddMsg("bot","好的，需要时随时说「配置 key」");
    }
    const input=document.getElementById("aiInput");if(input)input.value="";
    return;
  }
  if(!DEEPSEEK_KEY){
    aiAddMsg("user",text);
    aiAddMsg("bot","⚠️ 还没配置 API key。先点「⚙ 配置 key」按钮贴上你的 DeepSeek key 吧。");
    const input=document.getElementById("aiInput");if(input)input.value="";
    return;
  }
  aiAddMsg("user",text);
  aiAddMsg("bot","正在分析你的工作台数据…",true);
  const input=document.getElementById("aiInput");
  const btn=document.getElementById("aiSendBtn");
  if(input){input.value="";input.style.height="auto";}
  if(btn)btn.disabled=true;
  try{
    const resp=await fetch(DEEPSEEK_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+DEEPSEEK_KEY},
      body:JSON.stringify({
        model:"deepseek-chat",
        messages:[
          {role:"system",content:buildSystemPrompt()},
          ...aiMsgs.filter(m=>!m.thinking).map(m=>({role:m.role==="bot"?"assistant":"user",content:m.content}))
        ],
        max_tokens:1200,
        temperature:0.7
      })
    });
    const data=await resp.json();
    if(data.error){aiUpdateLast("⚠️ 出错了："+(data.error.message||JSON.stringify(data.error)));return;}
    const reply=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:"（无回复）";
    // 检查是否是录入操作（兼容 markdown 代码块包裹的 JSON）
    let raw=reply.trim();
    const fenceMatch=raw.match(/```(?:json)?\s*([\s\S]*?)```/);
    if(fenceMatch)raw=fenceMatch[1].trim();
    if(raw.startsWith("{")&&raw.includes('"action"')){
      try{
        const parsed=JSON.parse(raw);
        if(parsed.action==="record"){aiHandleRecord(parsed);return;}
      }catch(e){}
    }
    aiUpdateLast(reply);
  }catch(e){
    aiUpdateLast("⚠️ 网络错误："+e.message);
  }finally{
    if(btn)btn.disabled=false;
  }
}

// 处理 AI 返回的录入操作
function aiHandleRecord(parsed){
  const t=parsed.type,d=parsed.data||{};
  let msg="";
  if(t==="finance"){
    const r=getDay(currentDate);if(!r.finance)r.finance={in:[],out:[]};
    if(!r.finance.in)r.finance.in=[];
    if(!r.finance.out)r.finance.out=[];
    const dir=d.direction==="in"?"in":"out";
    const cat=d.cat||"其他";
    const amount=round2(+d.amount||0);
    const note=d.note||"";
    r.finance[dir].push({cat,amount,note});
    save(true);
    recalcFinanceBalance();
    updateFinanceKpi();
    msg=`✅ 已记一笔${dir==="in"?"收入":""}：${cat} ${amount}元${dir==="in"?"（收入）":""}`;
  }else if(t==="shopping"){
    state.shopping=state.shopping||{lists:{default:[]},active:"default"};
    state.shopping.lists[state.shopping.active||"default"].push({name:d.name||"",qty:d.qty||"",done:false});
    save(true);msg="✅ 已加入购物清单："+d.name;
  }else if(t==="reminder"){
    state.reminders=state.reminders||[];
    state.reminders.push({id:uid(),title:d.title||"",type:d.type||"once",date:d.date||"",time:d.time||"",intervalMin:+d.intervalMin||60,enabled:true});
    save(true);msg="✅ 已添加提醒："+d.title;
  }else if(t==="goal"){
    state.goals=state.goals||[];
    state.goals.push({id:uid(),title:d.title||"",level:d.level||"annual",progress:0,status:"active",createdAt:Date.now()});
    save(true);msg="✅ 已添加目标："+d.title;
  }else if(t==="body"){
    state.bodyData=state.bodyData||{};
    if(!state.bodyData[currentDate])state.bodyData[currentDate]={};
    if(d.weight)state.bodyData[currentDate].weight=+d.weight;
    if(d.bodyFat)state.bodyData[currentDate].bodyFat=+d.bodyFat;
    if(d.hr)state.bodyData[currentDate].hr=+d.hr;
    if(d.steps)state.bodyData[currentDate].steps=+d.steps;
    save(true);msg="✅ 已记录身体数据";
  }
  aiUpdateLast(msg);
  render();
}

window.__aiSend=function(){
  const input=document.getElementById("aiInput");
  if(input)aiSend(input.value);
};

// 打开 AI 面板（顶栏按钮 + 侧栏入口共用）
function aiBuildStats(){
  try{
    const days=Object.keys(state.entries).sort();
    const recent=days.slice(-7);
    let tasks=0,done=0,checks=0,onchecks=0,pomos=0,moods=[],spent=0;
    recent.forEach(d=>{const e=state.entries[d];if(!e)return;
      const ts=e.tasks||[];tasks+=ts.length;done+=ts.filter(t=>t&&t.done).length;
      const cs=e.checks||{};Object.keys(cs).forEach(k=>{checks++;if(cs[k])onchecks++;});
      if(e.pomos)pomos+=e.pomos;
      if(e.mood!=null)moods.push(e.mood);
      if(typeof e.finance==="number")spent+=e.finance;
    });
    const avgMood=moods.length?Math.round(moods.reduce((a,b)=>a+b,0)/moods.length*10)/10:"—";
    return `记录天数:${days.length} | 近7天:${recent.length}\n任务总数:${tasks} 已完成:${done}\n打卡项:${checks} 已完成:${onchecks}\n番茄数:${pomos}\n平均心情(1-5):${avgMood}\n近7天账目支出:${spent}`;
  }catch(e){return "（数据统计失败）";}
}
function aiReport(type){
  try{
    const promptMap={
      week:"请根据我本周（最近7天）的记录生成一份周报，包含：完成的事、坚持的习惯、情绪波动、番茄专注时长、账目概况，并给出下周的小建议。",
      month:"请根据我本月的记录生成月度复盘，包含趋势、亮点、不足与下月改进方向。",
      review:"请基于我的全部记录做一次深度复盘：我在哪些事上最投入？哪些目标在推进？情绪与专注的关系如何？给出真诚的观察。",
      insight:"请跨模块分析我的数据：运动/练声日 vs 其他日的心情与专注差异、超预算信号、睡眠与效率关联，给出 3 条可执行洞察。"
    };
    const prompt=(promptMap[type]||promptMap.week)+"\n\n【我的数据摘要】\n"+aiBuildStats();
    openAIPanel();
    const inp=document.getElementById("aiInput");
    if(inp)inp.value=prompt;
    if(window.__aiSend)window.__aiSend();else aiSend(prompt);
    toast("正在生成 AI 报告…");
  }catch(e){toast("生成报告失败");}
}
function openAIPanel(){
  const panel=document.getElementById("aiPanel");
  if(!panel)return;
  panel.classList.add("open");
  const fab=document.getElementById("quickCaptureBtn");
  if(fab)fab.style.display="none";
  if(aiMsgs.length===0){
    if(!DEEPSEEK_KEY){
      aiAddMsg("bot","👋 首次使用，需要先配置你的 DeepSeek API key（在设置里填，存本地不外传）");
    }else{
      aiAddMsg("bot","你好鹿7铭 👋\n\n我能看到你工作台的所有数据：今天的任务、打卡、番茄、账目、学习、身体数据，以及本周/本月的历史记录。\n\n你可以问我任何事，比如：\n• 总结我今天的情况\n• 根据数据给我建议\n• 记一笔午餐 25 块\n• 我这周过得怎么样");
    }
  }
  const input=document.getElementById("aiInput");
  setTimeout(()=>{if(input)input.focus();},350);
}

// 绑定 AI 面板事件
(function bindAI(){
  function ready(fn){if(document.readyState!=='loading')fn();else document.addEventListener('DOMContentLoaded',fn);}
  ready(()=>{
    const panel=document.getElementById("aiPanel");
    const close=document.getElementById("aiClose");
    const sendBtn=document.getElementById("aiSendBtn");
    const micBtn=document.getElementById("aiMicBtn");
    const input=document.getElementById("aiInput");
    if(close)close.onclick=()=>{
      if(panel)panel.classList.remove("open");
      const fab=document.getElementById("quickCaptureBtn");
      if(fab)fab.style.display="";
    };
    if(sendBtn)sendBtn.onclick=window.__aiSend;
    if(micBtn)micBtn.onclick=toggleAISpeech;
    // 自动高度
    if(input)input.oninput=function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,100)+"px";};
    // 快捷问题
    document.querySelectorAll("[data-ai-q]").forEach(b=>{
      b.onclick=()=>aiSend(b.dataset.aiQ);
    });
  });
})();

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
