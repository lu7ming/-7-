/* 课余空闲：返回 ≥30 分钟的空闲块 */
function freeSlots(date,winStart,winEnd){
  winStart=toMin(winStart||"07:00");winEnd=toMin(winEnd||"23:00");
  const busy=busySlots(date).slice().sort((a,b)=>a.start-b.start);
  const free=[];let cur=winStart;
  for(const b of busy){
    if(b.start>cur)free.push({start:cur,end:Math.min(b.start,winEnd)});
    cur=Math.max(cur,b.end);
  }
  if(cur<winEnd)free.push({start:cur,end:winEnd});
  return free.filter(f=>f.end-f.start>=30);
}

  let timeLabels="";

    timeLabels+=`<div class="tt-time-label" style="top:${HEAD_H+i*SLOT_H}px">${fmtMin(m)}</div>`;

  let daysHtml="";

    const list=(state.courses[String(d)]||[]).slice();
    const layout=layoutCourses(list);
    const isToday=d===todayDay;
    const dayName=WD_FULL[d%7];
    const blocks=layout.map(c=>{
      const top=((c.start-START*60)/totalMin)*totalH;

      slotsHtml+=`<div class="tt-slot" data-add-course-slot="${d}|${fmtMin(m)}" title="点击添加 ${dayName} ${fmtMin(m)} 的课程"></div>`;
    }

      <div class="tt-day-head">${dayName}</div>
      <div class="tt-slots" style="height:${totalH}px">${slotsHtml}${blocks}</div>

     <div class="section-title">🗓 课程表</div>

         <div class="tt-time-col">
           <div class="tt-corner">时间</div>
           ${timeLabels}
         </div>
         ${daysHtml}
       </div>
     </div>
   </div>
   <div class="card">
     <div class="section-title">📌 ${currentDate}（${WD_FULL[todayDay%7]}）今日课程与空闲</div>
     ${busySlots(currentDate).sort((a,b)=>a.start-b.start).map(c=>`<div class="tc-item"><b>${fmtMin(c.start)}–${fmtMin(c.end)}</b> ${esc(c.name)}${c.loc?" · 📍"+esc(c.loc):""}</div>`).join("") || `<div class="empty">今天无课</div>`}
     <div class="section-eyebrow" style="margin-top:12px">🟢 课余空闲（点一下填入任务）</div>
     <div class="free-row">${free.length?free.map(f=>`<button class="free-slot" data-use-slot="${fmtMin(f.start)}|${fmtMin(f.end)}">${fmtMin(f.start)}–${fmtMin(f.end)} <span class="fs-dur">${((f.end-f.start)/60).toFixed(1)}h</span></button>`).join(""):`<div class="empty">今天没有空闲时段</div>`}</div>
   </div>
   <div class="card">
     <div class="section-eyebrow">⚡ 当日临时覆盖（调课/考试）</div>
     <div class="input-row">
       <input class="tl-input" id="ovName" placeholder="名称（如：线代·考试）"/>
       <input class="tl-input" id="ovStart" type="time" style="width:90px"/>
       <input class="tl-input" id="ovEnd" type="time" style="width:90px"/>
       <button class="btn" data-action="add-override">添加覆盖</button>

     ${ovList.length?ovList.map(o=>`<div class="ov-item"><span>${esc(o.name)} ${esc(o.start)}–${esc(o.end)}</span><button class="refl-del" data-ov-del="${o.id}">✕</button></div>`).join(""):`<div class="empty">今天无临时覆盖</div>`}

}

function viewGoals(){
  const levels=[{k:"vision",t:"🌟 五年愿景"},{k:"annual",t:"📅 年度目标"},{k:"monthly",t:"🗓️ 月度重点"}];

  const goalCard=g=>{
    const tasks=g.tasks||[];

/* ============== 心情日志 ============== */
function viewMood(){
  const today=currentDate;
  const m=state.moods[today]||{};
  const MOOD_PICK=[{e:"😭",v:1,t:"难过"},{e:"😔",v:2,t:"低落"},{e:"😐",v:3,t:"一般"},{e:"🙂",v:4,t:"平静"},{e:"😊",v:5,t:"开心"},{e:"✨",v:5,t:"灵光"}];
  const picker=MOOD_PICK.map(x=>`<div class="mood-pick ${m.emoji===x.e?"active":""}" data-mood-pick="${x.e}" data-v="${x.v}" title="${x.t}">${x.e}</div>`).join("");
  const days=[];for(let i=29;i>=0;i--)days.push(addDays(today,-i));
  const vals=days.map(d=>{const mm=state.moods[d];return mm&&mm.val?mm.val:null;});
  const valid=vals.filter(v=>v!=null);
  const avg=valid.length?Math.round(valid.reduce((a,b)=>a+b,0)/valid.length*10)/10:null;
  const W=300,H=80,pad=10,n=days.length;
  const xx=i=>pad+i*(W-2*pad)/(n-1);
  const yy=v=>H-pad-((v-1)/4)*(H-2*pad);
  let path="",started=false,dots="";
  vals.forEach((v,i)=>{if(v==null){started=false;return;}const px=xx(i),py=yy(v);if(!started){path+="M"+px+" "+py;started=true;}else path+=" L"+px+" "+py;dots+=`<circle cx="${px}" cy="${py}" r="2.4" fill="var(--warm)"/>`;});
  if(!path)path=`M${pad} ${H/2} L${W-pad} ${H/2}`;
  const trendSvg=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:${W}px;margin:0 auto"><line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="var(--line)"/><path d="${path}" fill="none" stroke="var(--warm)" stroke-width="2" stroke-linejoin="round"/><line x1="${pad}" y1="${yy(5)}" x2="${W-pad}" y2="${yy(5)}" stroke="var(--line)" stroke-dasharray="2 3"/><line x1="${pad}" y1="${yy(3)}" x2="${W-pad}" y2="${yy(3)}" stroke="var(--line)" stroke-dasharray="2 3"/>${dots}</svg>`;
  const hasEx=d=>{const h=getDay(d).health;return !!(h&&h.exercise&&(h.exercise.minutes||h.exercise.done));};
  const avgOf=arr=>{const vs=arr.map(d=>state.moods[d]&&state.moods[d].val).filter(v=>v);return vs.length?Math.round(vs.reduce((a,b)=>a+b,0)/vs.length*10)/10:null;};
  const ae=avgOf(days.filter(hasEx)),an=avgOf(days.filter(d=>!hasEx(d)));
  let corr="记录越多，越能看到心情与运动、睡眠之间的关联。";
  if(ae!=null&&an!=null&&valid.length>=5)corr=`近 30 天：运动日心情均值 <b>${ae}</b>，非运动日 <b>${an}</b>${ae>an?" —— 动一动确实更开心 😊":"。"}`;
  return `<div class="card">
    <div class="section-eyebrow">MOOD LOG</div>
    <div class="section-title">🌈 心情日志</div>
    <p class="section-desc">每天花 3 秒记一下心情，30 天后回看这条情绪曲线。</p>
    <div class="mood-pick-wrap">${picker}</div>
    <textarea class="big-text" rows="2" data-mood-note placeholder="今天为什么是这种心情？（可选）">${esc(m.note||"")}</textarea>
    <div class="section-eyebrow" style="margin-top:14px">近 30 天情绪曲线</div>
    ${valid.length?trendSvg:`<div class="empty">还没有足够数据，先挑个表情吧 👆</div>`}
    <div class="mood-avg">均值 ${avg!=null?avg:"—"} · 已记录 ${valid.length} 天</div>
    <div class="mood-corr">💡 ${corr}</div>
  </div>`;
}

let tbSearchTerm="";
function tbFlatten(){const out=[];TOOLBOX_SITES.forEach(seg=>seg.items.forEach(it=>out.push(Object.assign({},it,{cat:seg.c,ico:seg.ico}))));return out;}
function tbIsFav(u){return (settings.favTools||[]).indexOf(u)>=0;}
function tbCard(s){
  const isFav=tbIsFav(s.u);
  return `<div class="tb-item">
    <a class="tb-card" href="${s.u}" target="_blank" rel="noopener">
      <div class="tb-n">${esc(s.n)}${s.t?`<span class="tb-tag">${s.t}</span>`:""}</div>
      <div class="tb-u">${esc(s.u.replace(/^https?:\/\//,""))}</div>
      <div class="tb-d">${esc(s.d)}</div>
    </a>
    <button class="tb-fav ${isFav?"on":""}" data-mod-action="tb-fav" data-tb-url="${esc(s.u)}" title="收藏/取消收藏">${isFav?"★":"☆"}</button>
  </div>`;
}
function tbListHtml(){
  const q=(tbSearchTerm||"").trim().toLowerCase();
  const all=tbFlatten();
  if(q){
    const res=all.filter(s=>(s.n+s.d+s.cat).toLowerCase().includes(q));
    return res.length?`<div class="tb-grid">${res.map(s=>tbCard(s)).join("")}</div>`:`<div class="empty">没有匹配的网站，换个关键词试试～</div>`;
  }
  return TOOLBOX_SITES.map(seg=>`<div class="section-eyebrow" style="margin-top:14px">${seg.ico} ${seg.c}</div><div class="tb-grid">${seg.items.map(s=>tbCard(s)).join("")}</div>`).join("");
}
function viewToolbox(){
  const all=tbFlatten();
  const favs=all.filter(s=>tbIsFav(s.u));
  const favHtml=favs.length?`<div class="tb-grid">${favs.map(s=>tbCard(s)).join("")}</div>`:`<div class="tb-fav-empty">还没收藏。点任意网站右上角的 ☆ 即可固定到这里，主页快捷条也会同步显示。</div>`;
  return `<div class="card">
    <div class="section-eyebrow">TOOLBOX · 备工作台</div>
    <div class="section-title">🧰 工具箱</div>
    <p class="section-desc">工作台同源整理的常用网站。点开在浏览器新标签打开（外部站点无法内嵌）。点 ☆ 收藏，会固定到主页快捷条。</p>
    <div class="tb-search"><span class="tb-s-ico">🔍</span><input id="tbSearch" data-tb-search placeholder="搜索网站 / 用途，如：AI、理财、PDF…" value="${esc(tbSearchTerm)}" autocomplete="off"/></div>
    <div class="section-eyebrow" style="margin-top:14px">⭐ 我的收藏（${favs.length}）</div>
    ${favHtml}
    <div class="section-eyebrow" style="margin-top:16px">🌐 全部资源</div>
    <div id="tbBody">${tbListHtml()}</div>
  </div>`;
}
/* 主页快捷条：学习时随手打开 */
function toolboxBar(){
  const all=tbFlatten();
  let list=(settings.favTools||[]).map(u=>all.find(s=>s.u===u)).filter(Boolean);
  if(!list.length)list=all.filter(s=>s.t==="在用");
  if(!list.length)list=all.slice(0,6);
  const chips=list.map(s=>`<a class="tb-q" href="${s.u}" target="_blank" rel="noopener" title="${esc(s.d)}"><span>${esc(s.n)}</span></a>`).join("");
  return `<div class="card pano-full tb-quick">
    <div class="section-eyebrow">🧰 常用资源 · 学习时随手打开</div>
    <div class="tb-q-row">${chips}${`<button class="tb-q-more" data-nav="toolbox">全部 ${all.length} 个 →</button>`}</div>
  </div>`;
}
MODULE_ACTIONS["tb-fav"]=function(t){
  const u=t.dataset.tbUrl;
  const arr=settings.favTools||[];
  const i=arr.indexOf(u);
  if(i>=0)arr.splice(i,1);else arr.push(u);
  settings.favTools=arr;
  saveSettings();
  render();
};

/* ============== 交互 ============== */
function bindDateNav(){
  const sc=document.getElementById("scroll");
  sc.onscroll=null;
}
function onClick(e){
  const t=e.target;
  // 模块动作分发（新增模块统一走 data-mod-action，避免污染主 data-action）
  if(t.dataset&&t.dataset.modAction){
    const h=MODULE_ACTIONS[t.dataset.modAction];
    if(h){h(t);return;}
  }
  // nav 切换
  if(t.closest("[data-nav]")){
    const navId=t.closest("[data-nav]").dataset.nav;
    // AI 入口：不切换视图，打开 AI 抽屉
    if(navId==="ai"){openAIPanel();return;}
    activeNav=navId;
    activeTool=null;
    render();
    // 移动端收起侧栏
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sbOverlay").classList.remove("show");
    return;
  }
  if(t.dataset.nav){
    if(t.dataset.nav==="ai"){openAIPanel();return;}
    activeNav=t.dataset.nav;activeTool=null;render();return;
  }
  // 日历：点日期切换到那一天
  if(t.dataset.calDate){
    currentDate=t.dataset.calDate;
    // 同步日历游标月份
    calCursor=currentDate;
    render();
    return;
  }
  // 日历：翻月 / 回今天
  if(t.dataset.calNav){
    const a=t.dataset.calNav;
    if(a==="prev"){const d=parseDate(calCursor);calCursor=fmtDate(new Date(d.getFullYear(),d.getMonth()-1,1));}
    else if(a==="next"){const d=parseDate(calCursor);calCursor=fmtDate(new Date(d.getFullYear(),d.getMonth()+1,1));}
    else if(a==="today"){calCursor=fmtDate(new Date());currentDate=fmtDate(new Date());}
    render();
    return;
  }
  // 番茄钟
  if(t.dataset.pomoAction){
    if(t.dataset.pomoAction==="start")startPomo();
    else if(t.dataset.pomoAction==="pause")pausePomo();
    else if(t.dataset.pomoAction==="reset")resetPomo();
    return;
  }
  if(t.dataset.pomoSet!=null){setPomoDuration(+t.dataset.pomoSet);return;}
  // 冥想/呼吸计时器
  if(t.dataset.medAction){
    if(t.dataset.medAction==="start")startMeditate();
    else if(t.dataset.medAction==="stop")stopMeditate(false);
    return;
  }
  if(t.dataset.medSet!=null){setMedDuration(+t.dataset.medSet);return;}
  // 顶栏
  if(t.dataset.top){
    const a=t.dataset.top;
    if(a==="search")openSearch("");
    else if(a==="data")openData();
    else if(a==="theme")toggleTheme();
    else if(a==="rest")toggleRest();
    return;
  }
  // 打卡签到
  if(t.id==="checkinBtn"){
    getDay(currentDate).checkIn=true;
    save();
    // 局部更新侧栏 streak 数字
    const sn=document.getElementById("streakNum");
    if(sn)sn.textContent=streakDays();
    toast("已签到 ✓ 连续 +1 天");
    return;
  }
  if(t.dataset.check!=null){
    const k=t.dataset.check;
    const r=getDay(currentDate);
    r.checks[k]=!r.checks[k];
    const on=!!r.checks[k];
    // 局部更新：翻转 checkbox + 文本样式
    t.classList.toggle("on",on);
    const txtEl=t.parentElement.querySelector(".check-text");
    if(txtEl)txtEl.classList.toggle("done",on);
    // 局部更新进度卡
    updateCheckProgress();
    haptic(10);
    save();
    return;
  }
  if(t.dataset.checkDel!=null){
    delete getDay(currentDate).checks[t.dataset.checkDel];
    save();
    // 局部更新：移除该行 + 更新进度
    const row=t.closest(".check-row");
    if(row)row.remove();
    updateCheckProgress();
    return;
  }
  if(t.dataset.water!=null){
    const r=getDay(currentDate);
    r.health.water[t.dataset.water]=!r.health.water[t.dataset.water];
    const on=!!r.health.water[t.dataset.water];
    t.classList.toggle("on",on);
    // 局部更新喝水进度
    updateWaterProgress();
    haptic(10);
    save();
    return;
  }
  if(t.dataset.task!=null){
    const idx=+t.dataset.task;
    const r=getDay(currentDate);
    r.tasks[idx].done=!r.tasks[idx].done;
    const on=r.tasks[idx].done;
    t.classList.toggle("on",on);
    const txtEl=t.parentElement.querySelector(".task-text");
    if(txtEl)txtEl.classList.toggle("done",on);
    haptic(10);
    save();
    return;
  }
  if(t.dataset.taskDel!=null){
    getDay(currentDate).tasks.splice(+t.dataset.taskDel,1);
    save();render();return;
  }
  if(t.dataset.action==="add-task"){
    const i=document.getElementById("newTask");const v=(i&&i.value.trim())||"";if(!v)return;
    getDay(currentDate).tasks.push({text:v,done:false});
    save();render();return;
  }
  if(t.dataset.action==="export-review-image"){
    exportReviewImage(t.dataset.key);return;
  }
  if(t.dataset.action==="export-year-report"){
    exportYearReportImage();return;
  }
  if(t.dataset.action==="add-contact"){
    const i=document.getElementById("newContact-"+t.dataset.cat);const v=(i&&i.value.trim())||"";if(!v)return;
    state.contacts.push({id:uid(),category:t.dataset.cat,name:v,note:"",time:"",interactions:[]});
    save();render();return;
  }
  if(t.dataset.contactDel!=null){
    state.contacts=state.contacts.filter(x=>x.id!==t.dataset.contactDel);
    save();render();return;
  }
  if(t.dataset.interactionToggle!=null){
    const el=document.getElementById("interact-"+t.dataset.interactionToggle);
    if(el)el.style.display=el.style.display==="none"?"block":"none";
    return;
  }
  if(t.dataset.interactionAdd!=null){
    const ct=state.contacts.find(c=>c.id===t.dataset.interactionAdd);
    if(ct){
      ct.interactions=ct.interactions||[];
      ct.interactions.push({id:uid(),date:currentDate,method:"微信",summary:"",feeling:3});
      save();render();
      // 重新展开
      const el=document.getElementById("interact-"+t.dataset.interactionAdd);
      if(el)el.style.display="block";
    }
    return;
  }
  if(t.dataset.interactionDel!=null){
    const [cid,idx]=t.dataset.interactionDel.split("-");
    const ct=state.contacts.find(c=>c.id===cid);
    if(ct&&ct.interactions){ct.interactions.splice(+idx,1);save();render();}
    return;
  }
  if(t.dataset.action==="add-goal"){
    const i=document.getElementById("newGoal-"+t.dataset.level);const v=(i&&i.value.trim())||"";if(!v)return;
    state.goals.push({id:uid(),title:v,level:t.dataset.level,createdAt:Date.now()});
    save();render();return;
  }
  if(t.dataset.goalDel!=null){
    state.goals=state.goals.filter(g=>g.id!==t.dataset.goalDel);
    save();render();return;
  }
  if(t.dataset.action==="add-goal-task"){
    const gid=t.dataset.gid;const i=document.getElementById("newGoalTask-"+gid);const v=(i&&i.value.trim())||"";if(!v)return;
    const g=state.goals.find(x=>x.id===gid);if(g){(g.tasks=g.tasks||[]).push({id:uid(),text:v,done:false});}
    save();render();return;
  }
  if(t.dataset.goalTaskToggle!=null){
    const g=state.goals.find(x=>x.id===t.dataset.gid);
    if(g&&g.tasks){const tk=g.tasks.find(x=>x.id===t.dataset.goalTaskToggle);if(tk)tk.done=!tk.done;}
    save();render();return;
  }
  if(t.dataset.goalTaskDel!=null){
    const g=state.goals.find(x=>x.id===t.dataset.gid);
    if(g&&g.tasks)g.tasks=g.tasks.filter(x=>x.id!==t.dataset.goalTaskDel);
    save();render();return;
  }
  if(t.dataset.moodPick){
    const em=t.dataset.moodPick,v=+t.dataset.v;
    const cur=state.moods[currentDate]||{};
    state.moods[currentDate]={emoji:em,val:v,note:cur.note||""};
    save();render();return;
  }
  if(t.dataset.inboxCat!=null){
    const it=(state.inbox||[]).find(x=>x.id===t.dataset.inboxCat);
    if(it){const order=["","思考","项目","目标","待办"];const i=order.indexOf(it.cat);it.cat=order[(i+1)%order.length];save();render();}
    return;
  }
  if(t.dataset.inboxDel!=null){
    state.inbox=(state.inbox||[]).filter(x=>x.id!==t.dataset.inboxDel);
    save();render();return;
  }
  if(t.dataset.inboxToReflect!=null){
    const it=(state.inbox||[]).find(x=>x.id===t.dataset.inboxToReflect);
    if(it){addReflection(currentDate,{text:it.text,mood:""});it.catered=true;save();render();toast("已转入思考流 💭");}
    return;
  }
  if(t.dataset.action==="add-countdown"){
    const n=document.getElementById("cdName");
    const d=document.getElementById("cdDate");
    if(!n.value.trim()||!d.value){toast("请填写名称和日期");return;}
    state.countdowns.push({id:uid(),name:n.value.trim(),date:d.value,createdAt:Date.now()});
    n.value="";d.value="";
    save();render();return;
  }
  if(t.dataset.cdDel!=null){
    state.countdowns=state.countdowns.filter(c=>c.id!==t.dataset.cdDel);
    save();render();return;
  }
  if(t.dataset.finAdd!=null){
    const k=t.dataset.finAdd;
    const r=getDay(currentDate);
    if(k==="in")r.finance.in.push({source:"",amount:"",date:""});
    else if(k==="out")r.finance.out.push({cat:"",amount:"",date:""});
    else if(k==="invest")r.finance.invest.push({item:"",income:"",risk:""});
    save();recalcFinanceBalance();render();return;
  }
  if(t.dataset.finDel!=null){
    const a=t.dataset.finDel.split("-");const k=a[0];const i=+a[1];
    const r=getDay(currentDate);
    if(k==="in")r.finance.in.splice(i,1);
    else if(k==="out")r.finance.out.splice(i,1);
    else if(k==="invest")r.finance.invest.splice(i,1);
    save();recalcFinanceBalance();render();return;
  }
  if(t.dataset.action==="add-book"){
    const t1=document.getElementById("newBookTitle");
    const a=document.getElementById("newBookAuthor");
    const s=document.getElementById("newBookStatus");
    if(!t1.value.trim()){toast("请填写书名");return;}
    state.books.push({id:uid(),title:t1.value.trim(),author:a.value.trim()||"佚名",status:s.value,progress:s.value==="read"?100:0,start:"",end:"",note:"",summary:""});
    t1.value="";a.value="";
    save();render();return;
  }
  if(t.dataset.action==="finish-onboard"){
    state.onboarded=true;save();render();return;
  }
  if(t.dataset.action==="quick-capture"){
    const inp=document.getElementById("qcInput");
    const v=inp&&inp.value.trim();
    if(!v)return;
    const result=parseQuickCapture(v);
    if(result){
      recalcFinanceBalance();
      save();render();
      showQcResult(result);
    }
    return;
  }
  if(t.dataset.tpl!=null){
    applyTemplate(t.dataset.tpl);return;
  }
  if(t.dataset.focusDel!=null){
    const arr=getFocusThree();
    arr.splice(+t.dataset.focusDel,1);
    setFocusThree(arr);render();return;
  }
  if(t.dataset.action==="look-date"){
    const d=document.getElementById("trendLookDate").value;
    const e=state.entries[d];
    const box=document.getElementById("trendLookResult");
    if(!e){box.innerHTML='<div class="empty">该日无记录</div>';return;}
    let h=`<div class="list-item"><div class="li-name">${d}</div>`;
    if(e.checkIn)h+='<div class="li-meta">✓ 已签到</div>';
    if(e.tasks&&e.tasks.length)h+='<div class="li-meta">任务：'+e.tasks.length+' 条（完成 '+e.tasks.filter(t=>t.done).length+'）</div>';
    if(e.review&&e.review.text)h+='<div class="li-meta">复盘：'+esc(e.review.text.slice(0,80))+'…</div>';
    if(e.study&&e.study.vocal&&e.study.vocal.vocal_time)h+='<div class="li-meta">声乐：'+e.study.vocal.vocal_time+' 分钟</div>';
    if(e.health&&e.feeling)h+='<div class="li-meta">身体：'+esc(e.health.feeling.slice(0,80))+'…</div>';
    h+='</div>';
    box.innerHTML=h;
    return;
  }
  if(t.dataset.bookDel!=null){
    state.books=state.books.filter(b=>b.id!==t.dataset.bookDel);
    save();render();return;
  }
  if(t.dataset.mood){
    selMood=t.dataset.mood;
    document.querySelectorAll(".mood").forEach(m=>m.classList.toggle("active",m.dataset.mood===selMood));
    return;
  }
  if(t.dataset.kw){

let _saveIndicatorT;

    ind.textContent="✓ 已保存";
    ind.style.opacity="1";

function onInput(e){
  const t=e.target;

  if(t.dataset.autoSound!=null){state.soundSettings[t.dataset.autoSound]=t.value;save();return;}
  if(t.dataset.wordSearch!=null){
    const q=t.value.trim().toLowerCase();
    const container=document.getElementById("wordListContainer");
    if(!container)return;
    const filtered=q?wordCache.filter(w=>(w.word||"").toLowerCase().includes(q)||(w.meaning||"").toLowerCase().includes(q)):wordCache;
    container.innerHTML=filtered.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,200).map(w=>
      `<div class="list-item word-item"><div class="word-main"><b class="word-text">${esc(w.word)}</b><span class="word-meaning">${esc(w.meaning)}</span></div><span class="word-cat">${esc(w.category)}</span><div class="word-state ${w.mastered===2?"mastered":w.mastered===1?"familiar":""}" data-word-cycle="${w.id}">${w.mastered===2?"✅ 已掌握":w.mastered===1?"🔸 熟悉":"🔹 未掌握"}</div><button class="check-del" data-word-del="${w.id}">✕</button></div>`
    ).join("")||`<div class="empty">未找到匹配</div>`;
    return;
  }
  if(t.dataset.taskText!=null){getDay(currentDate).tasks[+t.dataset.taskText].text=t.value;markSaved();return;}
  if(t.dataset.review!=null){getDay(currentDate).review.text=t.value;markSaved();return;}
  if(t.dataset.growth!=null){getDay(currentDate).growth.text=t.value;markSaved();return;}
  if(t.dataset.q!=null){getDay(currentDate).questions[+t.dataset.q]=t.value;markSaved();return;}
  if(t.dataset.goalText!=null){const g=state.goals.find(x=>x.id===t.dataset.goalText);if(g)g.title=t.value;markSaved();return;}
  if(t.dataset.contact!=null){const c=state.contacts.find(x=>x.id===t.dataset.contact);if(c)c[t.dataset.field]=t.value;markSaved();return;}
  if(t.dataset.interaction!=null){
    const [cid,idx]=t.dataset.interaction.split("-");
    const ct=state.contacts.find(c=>c.id===cid);
    if(ct&&ct.interactions&&ct.interactions[+idx]){
      const f=t.dataset.field;
      ct.interactions[+idx][f]=(f==="feeling")?(+t.value||3):t.value;
      if(f==="date"){
        const sorted=ct.interactions.map(i=>i.date).sort().reverse();
        ct.time=sorted[0]||ct.time;
      }
      markSaved();
    }
    return;
  }
  if(t.dataset.book!=null){const b=state.books.find(x=>x.id===t.dataset.book);if(b)b[t.dataset.field]=t.value;markSaved();return;}
  if(t.dataset.study!=null){
    const a=t.dataset.study.split("-");
    const r=getDay(currentDate);
    if(a[0]==="s"&&a.length>=4){
      // s-vocal-vocal_time / s-mood
      if(a[1]==="mood"){r.study.mood=t.value;markSaved();return;}
      const key=a[1];const field=a.slice(2).join("-");
      if(!r.study[key])r.study[key]={};
      r.study[key][field]=t.value;
      markSaved();return;
    }
    return;
  }
  if(t.dataset.exercise!=null){
    const r=getDay(currentDate);
    const v=t.dataset.exercise==="minutes"?+t.value||0:t.value;
    r.health.exercise[t.dataset.exercise]=v;markSaved();return;
  }
  if(t.dataset.sleep!=null){
    getDay(currentDate).health.sleep[t.dataset.sleep]=t.value;markSaved();return;
  }
  if(t.dataset.feeling!=null){getDay(currentDate).health.feeling=t.value;markSaved();return;}
  if(t.dataset.context!=null){getDay(currentDate).context=t.value;markSaved();return;}
  if(t.dataset.outlineText!=null){
    const [pid,idx]=t.dataset.outlineText.split(":");
    const p=state.projects.find(x=>x.id===pid);if(!p)return;
    if(p.outline&&p.outline[+idx])p.outline[+idx].text=t.value;
    markSaved();return;
  }
  if(t.dataset.material!=null){
    const p=state.projects.find(x=>x.id===t.dataset.material);if(!p)return;
    p.materials=t.value.split("\n").filter(s=>s.trim());
    markSaved();return;
  }
  if(t.dataset.balance!=null){getDay(currentDate).finance.balance=t.value;markSaved();recalcFinanceBalance();updateFinanceKpi();return;}
  if(t.dataset.initialBalance!=null){state.financeInitialBalance=(+t.value||0);save();recalcFinanceBalance();updateFinanceKpi();return;}
  if(t.dataset.budgetInput!=null){
    state.financeBudget=state.financeBudget||{};
    state.financeBudget[t.dataset.budgetInput]=(+t.value||0);
    markSaved();return;
  }
  if(t.dataset.fin!=null){
    const a=t.dataset.fin.split("-");const k=a[0];const i=+a[1];const f=a.slice(2).join("-");
    const r=getDay(currentDate);
    if(r.finance[k]&&r.finance[k][i]){
      const numField=(f==="amount"||f==="income");
      r.finance[k][i][f]=numField?(+t.value||0):t.value;
      markSaved();
      recalcFinanceBalance();
      updateFinanceKpi();
    }
    return;
  }
  if(t.dataset.trend!=null){
    const m=document.getElementById("trendMonth");
    state.trends=state.trends||{};
    state.trends[m.value]=t.value;markSaved();return;
  }
  /* ---- 周计划 ---- */
  if(t.dataset.weekGoal!=null){
    const p=getWeekPlan(currentDate);const i=+t.dataset.weekGoal;
    if(p.weekly_goals[i])p.weekly_goals[i].goal=t.value;
    markSaved();return;
  }
  if(t.dataset.weekStatus!=null){
    const p=getWeekPlan(currentDate);const i=+t.dataset.weekStatus;
    if(p.weekly_goals[i])p.weekly_goals[i].status=t.value;
    save();render();return;
  }
  if(t.dataset.weekPrio!=null){
    const p=getWeekPlan(currentDate);const i=+t.dataset.weekPrio;
    if(p.weekly_goals[i])p.weekly_goals[i].priority=+t.value;
    markSaved();return;
  }
  if(t.dataset.weekRev!=null){
    const p=getWeekPlan(currentDate);
    p.week_review[t.dataset.weekRev]=t.value;
    markSaved();return;
  }
  /* ---- 笔记 ---- */
  if(t.dataset.noteSearch!=null){
    renderNoteList(t.value);
    return;
  }
  if(t.id==="memoInput"){
    const v=t.value.trim();
    const prev=document.getElementById("memoPreview");
    if(!prev)return;
    if(!v){prev.innerHTML="";return;}
    const cls=autoClassifyMemo(v);
    const c=memoCat(cls.cat);
    const links=[];
    (cls.links.projects||[]).forEach(id=>{const p=state.projects.find(x=>x.id===id);if(p)links.push("🎯"+p.name);});
    (cls.links.goals||[]).forEach(id=>{const g=state.goals.find(x=>x.id===id);if(g)links.push("🏹"+g.title);});
    (cls.links.contacts||[]).forEach(id=>{const ct=state.contacts.find(x=>x.id===id);if(ct)links.push("👥"+ct.name);});
    prev.innerHTML=`将归入 <b style="color:${c.color}">${c.ico} ${c.l}</b>${links.length?` · 关联 ${links.join(" ")}`:""}`;
    return;
  }
  if(t.dataset.metric!=null){
    if(!state.metrics[currentDate])state.metrics[currentDate]={};
    state.metrics[currentDate][t.dataset.metric]=t.value?+t.value:"";
    markSaved();return;
  }
  if(t.dataset.body!=null){
    if(!state.bodyData)state.bodyData={};
    if(!state.bodyData[currentDate])state.bodyData[currentDate]={};
    const f=t.dataset.body;
    if(f==="note"){state.bodyData[currentDate].note=t.value;}
    else{state.bodyData[currentDate][f]=t.value?(+t.value):"";}
    markSaved();return;
  }
  if(t.dataset.reviewPeriod!=null){
    const wk=t.dataset.reviewPeriod;
    const f=t.dataset.field;
    if(!state.reviews[wk])state.reviews[wk]={};
    state.reviews[wk][f]=t.value;
    markSaved();return;
  }
  if(t.dataset.radar!=null&&t.dataset.dim!=null){
    const wk=t.dataset.radar;
    const dim=t.dataset.dim;
    if(!state.reviews[wk])state.reviews[wk]={};
    if(!state.reviews[wk].radar)state.reviews[wk].radar={};
    state.reviews[wk].radar[dim]=+t.value||1;
    // 局部更新雷达图 SVG，不触发 render
    const radarSvg=document.querySelector(".review-gen svg, .card svg.radar-chart");
    if(radarSvg){
      const dims=[{k:"study",l:"学习"},{k:"health",l:"健康"},{k:"finance",l:"资产"},{k:"relate",l:"关系"},{k:"growth",l:"成长"}];
      const vals=dims.map(d=>state.reviews[wk].radar[d.k]||1);
      const cx=100,cy=95,R=65;
      const pts=vals.map((v,i)=>{const ang=-Math.PI/2+i*Math.PI*2/5;return [cx+Math.cos(ang)*R*v/5,cy+Math.sin(ang)*R*v/5];});
      const poly=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
      const polyEl=radarSvg.querySelector("polygon:last-of-type");
      if(polyEl)polyEl.setAttribute("points",poly);
    }
    save();
    return;
  }
  if(t.dataset.focusEdit!=null){
    const arr=getFocusThree();
    arr[+t.dataset.focusEdit]=t.value;
    setFocusThree(arr);
    markSaved();return;
  }
  if(t.dataset.tbSearch!=null){
    tbSearchTerm=t.value;
    const body=document.getElementById("tbBody");
    if(body)body.innerHTML=tbListHtml();
    return;
  }
}

/* ============== 搜索 ============== */
function openSearch(preset){
 document.getElementById("searchOverlay").classList.remove("hidden");
 const i=document.getElementById("searchInput");i.value=preset||"";i.focus();runSearch();
}
function closeSearch(){document.getElementById("searchOverlay").classList.add("hidden");}
function runSearch(){
 const q=document.getElementById("searchInput").value.trim().toLowerCase();
 const box=document.getElementById("searchResults");
 if(!q){box.innerHTML='<div class="empty">输入关键词跨板块检索</div>';return;}
 const res=[];
 const push=(modL,disp,search,full,jump)=>{if(!search)return;if(search.toLowerCase().includes(q))res.push({modL,disp:String(disp),full:full||String(disp),jump});};
 Object.keys(state.entries).forEach(date=>{
  const r=state.entries[date];
  (r.tasks||[]).forEach((t,i)=>push("任务",t.text,t.text,t.text,"tasks:"+date+":"+i));
  if(r.review&&r.review.text)push("复盘",r.review.text,r.review.text,r.review.text,"review:"+date);
  if(r.growth&&r.growth.text)push("精进",r.growth.text,r.growth.text,r.growth.text,"growth:"+date);
  Object.values(r.questions||{}).forEach((a,i)=>{if(a)push("八问",a,a,a,"q:"+date+":"+i);});
 });
 state.contacts.forEach(c=>push("联系人",c.name+" "+c.note,c.name+" "+c.note,c.name+" "+c.note,"contact:"+c.id));
 state.books.forEach(b=>push("书架",b.title+" "+b.author+" "+b.note,b.title+" "+b.author+" "+b.note,b.title+" "+b.author+" "+b.note,"book:"+b.id));
 Object.keys(state.reflections).forEach(date=>{
  (state.reflections[date]||[]).forEach(rf=>push("思考",rf.text,rf.text,rf.text,"reflect:"+date));
 });
 state.capsules.forEach(c=>push("胶囊",c.title+" "+c.text,c.title+" "+c.text,c.title+" "+c.text,"capsule:"+c.id));
 state.quotes.forEach(q=>push("摘抄",(q.source||"")+" "+(q.excerpt||"")+" "+(q.reflection||""),(q.source||"")+" "+(q.excerpt||"")+" "+(q.reflection||""),(q.source||"")+" "+(q.excerpt||""),"quote:"+q.id));
 state.projects.forEach(p=>push("项目",p.name+" "+p.type+" "+(p.materials||[]).join(" "),p.name+" "+(p.materials||[]).join(" "),p.name+" "+(p.materials||[]).join(" "),"project:"+p.id));
 state.notes.forEach(n=>push("笔记",(n.title||"")+" "+(n.content||"")+" "+(n.tags||[]).join(" "),(n.title||"")+" "+(n.content||"")+" "+(n.tags||[]).join(" "),(n.content||"").slice(0,80),"note:"+n.id));
 state.memos.forEach(m=>push("备忘",(m.text||"")+" "+(memoCat(m.cat).l),(m.text||"")+"",(m.text||"").slice(0,80),"memo:"+m.id));
 state.weeklyPlans.forEach(w=>{w.weekly_goals.forEach(g=>push("周计划",g.goal||"",g.goal||"",g.goal||"","week:"+w.week_id));});
 if(!res.length){box.innerHTML='<div class="empty">未找到匹配内容</div>';return;}
 box.innerHTML=res.slice(0,80).map(r=>`<div class="sr" data-jump="${r.jump}"><div class="sr-meta"><span class="sr-mod">${r.modL}</span></div><div class="sr-snip">${snippet(r.full,q)}</div></div>`).join("");
 box.querySelectorAll(".sr").forEach(el=>el.onclick=()=>jump(el.dataset.jump));
}
function snippet(text,q){
 text=String(text);const low=text.toLowerCase();const idx=low.indexOf(q);
 if(idx<0)return esc(text.slice(0,120));
 const a=Math.max(0,idx-40),b=Math.min(text.length,idx+q.length+80);
 let s=(a>0?"…":"")+esc(text.slice(a,b))+(b<text.length?"…":"");
 const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");
 s=s.replace(re,"<mark>$1</mark>");
 return s;
}
function jump(spec){
 const [type,...rest]=spec.split(":");
 closeSearch();
 const scrollTo=(id)=>{setTimeout(()=>{const el=document.getElementById(id);if(el && el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"start"});},50);};
 if(type==="tasks"){activeNav="home";currentDate=rest[0];render();setTimeout(()=>document.getElementById("scroll").scrollIntoView(),50);}
 else if(type==="review"){activeNav="home";if(rest[0])currentDate=rest[0];render();scrollTo("tool-review");}
 else if(type==="growth"){activeNav="home";if(rest[0])currentDate=rest[0];render();scrollTo("tool-growth");}
 else if(type==="q"){activeNav="home";if(rest[0])currentDate=rest[0];render();scrollTo("tool-questions");}
 else if(type==="contact"){activeNav="relate";render();}
 else if(type==="book"){activeNav="book";render();}
 else if(type==="reflect"){activeNav="reflect";render();}
 else if(type==="capsule"){activeNav="capsule";render();}
 else if(type==="quote"){activeNav="quote";render();}
 else if(type==="project"){activeNav="project";render();}
 else if(type==="note"){activeNav="note";render();}
 else if(type==="memo"){activeNav="memo";render();}
 else if(type==="week"){activeNav="week";render();}
}

/* 渲染背景图片网格 + 绑定上传/滑块 */
function renderBgGrid(){
  const grid=document.getElementById("bgGrid");
  if(!grid)return;
  const b=settings.bg||{mode:"gradient",sel:-1};
  let html='<div class="bg-opt bg-none '+(b.mode!=="photo"?"active":"")+'" data-bg-none="1">渐变背景</div>';
  (settings.bgGallery||[]).forEach((g,i)=>{
    const active=(b.mode==="photo"&&b.sel===i)?"active":"";
    html+='<div class="bg-opt '+(active?'active':'')+'" data-bg-i="'+i+'">'
      +'<img class="bg-thumb" src="'+g.data+'" alt="">'
      +'<button class="bg-del" data-bg-del="'+i+'" title="删除">✕</button>'
      +(active?'<div class="bg-check">✓</div>':'')
      +'<div class="bg-label">'+(g.name||("图"+(i+1)))+'</div>'
      +'</div>';
  });
  grid.innerHTML=html;
  // 选择渐变
  grid.querySelectorAll("[data-bg-none]").forEach(el=>el.onclick=()=>{
    settings.bg.mode="gradient";settings.bg.sel=-1;applyBackground();saveSettings();renderBgGrid();
    document.getElementById("bgSliders").style.display="none";
  });
  // 选择照片
  grid.querySelectorAll("[data-bg-i]").forEach(el=>el.onclick=(e)=>{
    if(e.target.dataset.bgDel!=null)return;
    const i=parseInt(el.dataset.bgI,10);
    settings.bg.mode="photo";settings.bg.sel=i;applyBackground();saveSettings();renderBgGrid();
    document.getElementById("bgSliders").style.display="block";
  });
  // 删除照片
  grid.querySelectorAll("[data-bg-del]").forEach(el=>el.onclick=(e)=>{
    e.stopPropagation();
    const i=parseInt(el.dataset.bgDel,10);
    settings.bgGallery.splice(i,1);
    if(settings.bg.mode==="photo"&&settings.bg.sel>=settings.bgGallery.length){
      settings.bg.sel=settings.bgGallery.length-1;
      if(settings.bg.sel<0){settings.bg.mode="gradient";settings.bg.sel=-1;}
    }
    applyBackground();saveSettings();renderBgGrid();syncBgSliders();
  });
  syncBgSliders();
}
function syncBgSliders(){
  const sl=document.getElementById("bgSliders");
  if(!sl)return;
  const on=(settings.bg&&settings.bg.mode==="photo");
  sl.style.display=on?"block":"none";
  if(on){
    document.getElementById("bgBlur").value=settings.bg.blur||0;
    document.getElementById("bgBlurV").textContent=(settings.bg.blur||0);

    document.getElementById("bgDimV").textContent=((settings.bg.dim!=null?settings.bg.dim:0.3)).toFixed(2);

/* ============== 语音录入 ============== */
let voiceRec=null,voiceActive=false;
function toggleVoice(){
  const btn=document.getElementById("voiceBtn");
  if(!btn)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("当前浏览器不支持语音识别");return;}
  if(voiceActive){
    try{voiceRec&&voiceRec.stop();}catch(e){}
    voiceActive=false;
    btn.classList.remove("recording");
    return;
  }
  voiceRec=new SR();
  voiceRec.lang="zh-CN";
  voiceRec.continuous=false;
  voiceRec.interimResults=false;
  voiceRec.onstart=()=>{voiceActive=true;btn.classList.add("recording");toast("🎤 正在听… 说完后自动录入");}
  voiceRec.onend=()=>{voiceActive=false;btn.classList.remove("recording");}
  voiceRec.onerror=(e)=>{voiceActive=false;btn.classList.remove("recording");toast("语音识别失败："+(e.error||"未知错误"));}
  voiceRec.onresult=(e)=>{
    const txt=e.results[0][0].transcript;
    const input=document.getElementById("qcInput");
    if(input){input.value=txt;input.focus();}

let aiVoiceRec=null,aiVoiceActive=false;
function toggleAISpeech(){

/* ============== 本地推送提醒 ============== */
function initNotifications(){
  if(!("Notification" in window))return;
  if(Notification.permission==="default"&&settings.notifEnabled){
    Notification.requestPermission().then(p=>{
      if(p==="granted")scheduleNotifCheck();
    });
  }else if(Notification.permission==="granted"&&settings.notifEnabled){
    scheduleNotifCheck();
  }
}
function enableNotifications(){
  if(!("Notification" in window)){toast("当前浏览器不支持推送通知");return false;}
  if(Notification.permission==="granted"){settings.notifEnabled=true;saveSettings();scheduleNotifCheck();toast("✅ 已开启推送提醒");return true;}
  Notification.requestPermission().then(p=>{
    if(p==="granted"){
      settings.notifEnabled=true;saveSettings();scheduleNotifCheck();
      toast("✅ 已开启推送提醒");
    }else{
      toast("需要在浏览器设置中允许通知");
    }
  });
  return true;
}
function scheduleNotifCheck(){
  // 每小时检查一次提醒
  if(window._notifTimer)clearInterval(window._notifTimer);
  window._notifTimer=setInterval(()=>{
    if(!settings.notifEnabled||Notification.permission!=="granted")return;
    // 模块提醒（提醒中心）：每分钟级间隔由 checkReminders 内部 lastFired 控制，这里每小时触发一次即可
    try{checkReminders();}catch(e){}
    const today=fmtDate(new Date());
    if(settings.lastNotifDay===today+"h"+new Date().getHours())return;
    const alerts=dailyAlerts();
    if(alerts.length){
      settings.lastNotifDay=today+"h"+new Date().getHours();
      saveSettings();
      const body=alerts.slice(0,3).map(a=>a.icon+" "+a.text).join("\n");
      try{
        new Notification("📋 人生工作台提醒",{
          body:body,
          icon:"icons/apple-touch-icon.png",
          tag:"life-notif-"+today
        });
      }catch(e){}
    }
  },3600000); // 1小时
}

/* ============== 智能建议引擎（离线） ============== */
function smartSuggestions(){
  const sugs=[];
  const today=fmtDate(new Date());
  // 1. 学习趋势：对比本周和上周
  const thisWeek=weekStats(today);
  const lastWeekStart=addDays(weekRange(today).start,-7);
  const lastWeek=weekStats(lastWeekStart);
  if(thisWeek.studyMin!=null&&lastWeek.studyMin!=null){
    if(lastWeek.studyMin>0&&thisWeek.studyMin<lastWeek.studyMin*0.7){
      const drop=Math.round((1-thisWeek.studyMin/lastWeek.studyMin)*100);
      sugs.push({icon:"📉",text:`本周学习时间较上周下降了 ${drop}%，是否需要调整安排？`});
    }else if(thisWeek.studyMin>lastWeek.studyMin*1.3){
      const rise=Math.round((thisWeek.studyMin/(lastWeek.studyMin||1)*100-100));
      sugs.push({icon:"📈",text:`学习时间较上周增长 ${rise}%，势头很好，继续保持！`});
    }
  }
  // 2. 联系人冷落
  const cold=coldContacts(30);
  if(cold.length>=3){
    sugs.push({icon:"🤝",text:`${cold.length} 位联系人超 30 天未联系，建议今天联系 ${cold.slice(0,2).map(c=>esc(c.name)).join("、")}`});
  }
  // 3. 情绪走势
  let moodLow=0;
  for(let i=0;i<3;i++){
    const d=addDays(today,-i);
    const refls=state.reflections[d]||[];
    if(refls.length&&refls[0].mood){
      if(moodVal(refls[0].mood)<=2)moodLow++;
    }
  }
  if(moodLow>=2)sugs.push({icon:"🌧️",text:"近 3 天情绪偏低，建议出门散步或做点喜欢的事"});
  // 4. 打卡连续中断
  const streak=streakDays();
  const yest=addDays(today,-1);
  const yEntry=state.entries[yest];
  if(streak===0&&(!yEntry||!yEntry.checkIn))sugs.push({icon:"🔥",text:"连续打卡中断了，今天重新开始吧"});
  // 5. 备份提醒
  if(shouldRemindBackup())sugs.push({icon:"💾",text:"已超过 7 天未备份数据，建议导出一份"});
  // 6. 读书
  const reading=state.books.filter(b=>b.status==="在读");
  if(reading.length){
    const stale=reading.filter(b=>{
      if(!b.start)return false;
      const days=diffDays(b.start,today);
      return days>30&&(!b.progress||b.progress<50);
    });
    if(stale.length)sugs.push({icon:"📚",text:`《${esc(stale[0].title)}》已开始 ${diffDays(stale[0].start,today)} 天，进度 ${stale[0].progress||0}%，继续读吧`});
  }
  return sugs;
}

/* ============== 天气（联网缓存） ============== */
let weatherCache=null;
async function fetchWeather(){
  // 尝试从 sessionStorage 获取缓存
  const cached=sessionStorage.getItem("weatherCache");
  if(cached){
    weatherCache=JSON.parse(cached);
  }
  // 如果缓存是今天的，直接用
  if(weatherCache&&weatherCache.date===fmtDate(new Date()))return weatherCache;
  // 在线获取
  try{
    const pos=await new Promise((res,rej)=>{
      if(!navigator.geolocation)return rej("no geo");
      navigator.geolocation.getCurrentPosition(p=>res(p),e=>rej(e),{timeout:5000,maximumAge:600000});
    });
    const lat=pos.coords.latitude.toFixed(2);
    const lon=pos.coords.longitude.toFixed(2);
    const res=await fetch(`https://wttr.in/${lat},${lon}?format=j1`,{signal:AbortSignal.timeout?AbortSignal.timeout(6000):undefined});
    const data=await res.json();
    const cur=data.current_condition&&data.current_condition[0];
    if(!cur)throw new Error("no data");
    const code=parseInt(cur.weatherCode);
    let icon="🌤️";
    if(code<=3)icon=parseInt(cur.weatherCode)===1?"☀️":"⛅";
    else if(code<=48)icon="🌫️";
    else if(code<=67||code>=80&&code<=82)icon="🌧️";
    else if(code>=71&&code<=77)icon="❄️";
    else if(code>=95)icon="⛈️";
    weatherCache={
      date:fmtDate(new Date()),
      icon:icon,
      temp:parseInt(cur.temp_C),
      desc:cur.lang_zh&&cur.lang_zh[0]?cur.lang_zh[0].value:cur.weatherDesc&&cur.weatherDesc[0]?cur.weatherDesc[0].value:"",
      loc:data.nearest_area&&data.nearest_area[0]?data.nearest_area[0].areaName[0].value:""
    };
    sessionStorage.setItem("weatherCache",JSON.stringify(weatherCache));
  }catch(e){
    // 离线或失败：使用缓存或默认
    if(!weatherCache)weatherCache=null;
  }
  return weatherCache;
}
function weatherHtml(){
  if(!weatherCache)return"";
  return `<div class="weather-row">
    <span class="weather-icon">${weatherCache.icon}</span>
    <span class="weather-temp">${weatherCache.temp}°</span>
    <span class="weather-desc">${esc(weatherCache.desc)}</span>
    <span class="weather-loc">${esc(weatherCache.loc)}</span>
  </div>`;
}

    ${stat("平均情绪",avgMood,460,210)}
    <text x="40" y="290" font-size="13" font-weight="600" fill="#3A332D">📈 月度学习时长（分钟）</text>
    ${bars}
    <text x="40" y="${barY+50}" font-size="13" font-weight="600" fill="#3A332D">🎯 ${year} 年度总结</text>
    <text x="40" y="${barY+80}" font-size="12" fill="#3A332D">这一年，你学习了 ${Math.round(studyTotal/60)} 小时，打卡 ${checkinDays} 天，</text>
    <text x="40" y="${barY+100}" font-size="12" fill="#3A332D">读了 ${booksDone} 本书，记录了 ${reflectionsCount} 条思考。</text>
    <text x="40" y="${barY+120}" font-size="12" fill="#3A332D">平均情绪 ${avgMood}/5，${moodDays>0?(moodSum/moodDays>=4?"状态不错！":"继续加油！"):"开始记录情绪吧"}</text>
    <text x="${W-20}" y="${H-20}" text-anchor="end" font-size="10" fill="#BFB6A8">人生工作台 · ${fmtDate(new Date())}</text>
  </svg>`;
  const img=new Image();
  const blob=new Blob([svg],{type:"image/svg+xml"});
  const url=URL.createObjectURL(blob);
  img.onload=()=>{
    const canvas=document.createElement("canvas");
    canvas.width=W*2;canvas.height=H*2;
    const ctx=canvas.getContext("2d");
    ctx.scale(2,2);
    ctx.drawImage(img,0,0);
    canvas.toBlob(b=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(b);
      a.download=`year_report_${year}.png`;
      a.click();
      URL.revokeObjectURL(url);
      toast("年度报告已导出");
    },"image/png");
  };
  img.src=url;
}

/* ============== 生命之树 ============== */
const TREE_LEVELS=[
  {lv:1,name:"种子",icon:"🌰",min:0,max:500,desc:"一切的开始"},
  {lv:2,name:"嫩芽",icon:"🌱",min:500,max:2000,desc:"破土而出"},
  {lv:3,name:"小苗",icon:"🌿",min:2000,max:5000,desc:"向阳生长"},
  {lv:4,name:"小树",icon:"🌳",min:5000,max:10000,desc:"枝繁叶茂"},
  {lv:5,name:"大树",icon:"🌲",min:10000,max:20000,desc:"根深蒂固"},
  {lv:6,name:"开花树",icon:"🌸",min:20000,max:50000,desc:"繁花似锦"},
  {lv:7,name:"繁茂古树",icon:"🌟",min:50000,max:999999,desc:"参天之木"}
];

/* 计算今日养分：从各模块数据中提取 */
function calcTreeNutrients(){
  const today=fmtDate(new Date());
  const r=getDay(today);
  let water=0,sunlight=0,fertilizer=0;
  const num=(v)=>+(v||0);

  // 打卡 → 水
  const dn=CHECK_TPL.reduce((a,c)=>a+c.items.filter(it=>r.checks[c.cat+"-"+it]).length,0);
  water+=dn*10;

  // 喝水记录 → 水
  if(r.health&&r.health.water){
    const w=r.health.water;
    if(typeof w==="object"){
      water+=Object.values(w).filter(v=>v===true).length*5;
    }else{
      water+=num(w)*5;
    }
  }

  // 学习 → 肥
  const fs=r.focusSessions||[];
  const studyMin=fs.reduce((s,f)=>s+Math.round(num(f.duration)/60),0);
  fertilizer+=studyMin*2;
  if(r.study&&r.study.vocal&&r.study.vocal.vocal_time)fertilizer+=num(r.study.vocal.vocal_time);
  if(r.study&&r.study.english&&(r.study.english.en_words||r.study.english.en_read))fertilizer+=num(r.study.english.en_words)+num(r.study.english.en_read);

  // 运动 → 阳光
  if(r.health&&r.health.exercise){
    const ex=r.health.exercise;
    if(typeof ex==="object")sunlight+=num(ex.minutes);
    else sunlight+=num(ex);
  }
  if(r.health&&r.health.meditation)sunlight+=r.health.meditation.reduce((s,m)=>s+Math.round(num(m.duration)/60),0);
  if(r.health&&r.health.sleep&&num(r.health.sleep)>=7)sunlight+=20;

  // 思考 → 肥
  const refls=state.reflections[today]||[];
  fertilizer+=refls.length*20;

  // 连续打卡 → 额外养分
  const streak=streakDays();
  if(streak>=7)fertilizer+=50;
  if(streak>=30){water+=100;sunlight+=100;}

  return {water,sunlight,fertilizer,total:water+sunlight+fertilizer};
}

/* 更新树数据（每次 render 时调用，确保养分实时） */
function updateTreeData(){
  const today=fmtDate(new Date());
  if(!state.treeData)state.treeData={nutrients:0,water:0,sunlight:0,fertilizer:0,level:1,lastCalcDate:"",history:{}};
  const td=state.treeData;
  if(!td.history)td.history={};
  if(!td.lastCalcDate)td.lastCalcDate="";
  // 如果今天还没计算过，累加今日养分
  if(td.lastCalcDate!==today){
    const n=calcTreeNutrients();
    td.nutrients=(+td.nutrients||0)+(+n.total||0);
    td.water=(+td.water||0)+(+n.water||0);
    td.sunlight=(+td.sunlight||0)+(+n.sunlight||0);
    td.fertilizer=(+td.fertilizer||0)+(+n.fertilizer||0);
    td.history[today]={water:+n.water,sunlight:+n.sunlight,fertilizer:+n.fertilizer,total:+n.total};
    td.lastCalcDate=today;
    // 更新等级
    for(let i=TREE_LEVELS.length-1;i>=0;i--){
      if(td.nutrients>=TREE_LEVELS[i].min){td.level=TREE_LEVELS[i].lv;break;}
    }
    save();
  }
}

/* 生成树的 SVG（写实渐变风） */
function treeSVG(level,size){
  const w=size||400,h=size||400;
  const cx=w/2;
  const groundY=h-45;
  let svg=`<svg class="tree-svg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">`;

  // 背景天空渐变（根据时间）
  const hr=new Date().getHours();
  let skyColors,groundColors,sunColor,isNight;
  if(hr<6){skyColors=["#0D1B2A","#1B2838","#2C3E50"];groundColors=["#1a2a1a","#0D1a0D"];sunColor="#E8E8E8";isNight=true;}
  else if(hr<8){skyColors=["#FFB088","#FFCBA8","#E8D5C0"];groundColors=["#5A6B4A","#3A4A30"];sunColor="#FF9E5A";isNight=false;}
  else if(hr<11){skyColors=["#A8D8F0","#C8E8FF","#E8F4FF"];groundColors=["#6B8E5A","#4A6B3A"];sunColor="#FFE5A0";isNight=false;}
  else if(hr<16){skyColors=["#87CEEB","#B0E0F5","#D8F0FF"];groundColors=["#7FB069","#5A8A4A"];sunColor="#FFEF8A";isNight=false;}
  else if(hr<18){skyColors=["#FFB07C","#FF9E5A","#E87A3A"];groundColors=["#6B7B4A","#4A5A30"];sunColor="#FF6B3A";isNight=false;}
  else if(hr<20){skyColors=["#5A4A6B","#3A2E4A","#2A2038"];groundColors=["#3A3A2A","#2A2A1A"];sunColor="#FF8C5A";isNight=false;}
  else{skyColors=["#0D0D1A","#1A1A2E","#16132B"];groundColors=["#1a1a1a","#0D0D0D"];sunColor="#E8E8F0";isNight=true;}

  svg+=`<defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${skyColors[0]}"/>
      <stop offset="50%" stop-color="${skyColors[1]}"/>
      <stop offset="100%" stop-color="${skyColors[2]}"/>
    </linearGradient>
    <linearGradient id="ground-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${groundColors[0]}"/>
      <stop offset="100%" stop-color="${groundColors[1]}"/>
    </linearGradient>
    <linearGradient id="trunk-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D2B1F"/>
      <stop offset="30%" stop-color="#6B4F35"/>
      <stop offset="55%" stop-color="#8B6F47"/>
      <stop offset="75%" stop-color="#6B4F35"/>
      <stop offset="100%" stop-color="#3D2B1F"/>
    </linearGradient>
    <linearGradient id="trunk-shadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="50%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <radialGradient id="leaf-light" cx="0.35" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#D4F0B8"/>
      <stop offset="30%" stop-color="#A8D88A"/>
      <stop offset="65%" stop-color="#7FB069"/>
      <stop offset="100%" stop-color="#4A7A3A"/>
    </radialGradient>
    <radialGradient id="leaf-dark" cx="0.35" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#B8D89C"/>
      <stop offset="35%" stop-color="#8EC06A"/>
      <stop offset="70%" stop-color="#5E9A48"/>
      <stop offset="100%" stop-color="#3A6A2C"/>
    </radialGradient>
    <radialGradient id="leaf-highlight" cx="0.3" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="rgba(255,255,200,0.4)"/>
      <stop offset="100%" stop-color="rgba(255,255,200,0)"/>
    </radialGradient>
    <radialGradient id="fruit-grad" cx="0.35" cy="0.25" r="0.8">
      <stop offset="0%" stop-color="#FFE0A0"/>
      <stop offset="35%" stop-color="#F5B05A"/>
      <stop offset="70%" stop-color="#D87838"/>
      <stop offset="100%" stop-color="#A05020"/>
    </radialGradient>
    <radialGradient id="fruit-shine" cx="0.3" cy="0.2" r="0.3">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <radialGradient id="flower-grad" cx="0.4" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="40%" stop-color="#FFB0CC"/>
      <stop offset="80%" stop-color="#E0789C"/>
      <stop offset="100%" stop-color="#C04878"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft-shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/></filter>
  </defs>`;

  // 天空
  svg+=`<rect width="${w}" height="${h}" fill="url(#sky)"/>`;

  // 星星（夜晚）
  if(isNight){
    const stars=[[40,30,1],[80,50,1.5],[120,25,1],[200,40,1.2],[280,20,1],[320,55,1.5],[360,35,1],[60,70,0.8],[180,60,1],[260,65,0.8],[340,70,1.2]];
    stars.forEach(s=>{svg+=`<circle cx="${s[0]}" cy="${s[1]}" r="${s[2]}" fill="#FFF" opacity="${0.4+Math.random()*0.4}"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="${2+Math.random()*3}s" repeatCount="indefinite"/></circle>`;});
  }

  // 太阳/月亮
  const sunX=w-65,sunY=55;
  if(isNight){
    svg+=`<circle cx="${sunX}" cy="${sunY}" r="16" fill="${sunColor}" opacity="0.9" filter="url(#glow)"/>`;
    svg+=`<circle cx="${sunX-5}" cy="${sunY-3}" r="13" fill="${skyColors[0]}" opacity="0.95"/>`;
    svg+=`<circle cx="${sunX-4}" cy="${sunY-2}" r="12" fill="${sunColor}" opacity="0.8"/>`;
  }else{
    // 太阳光晕
    svg+=`<circle cx="${sunX}" cy="${sunY}" r="28" fill="${sunColor}" opacity="0.2"/>`;
    svg+=`<circle cx="${sunX}" cy="${sunY}" r="20" fill="${sunColor}" opacity="0.4" filter="url(#glow)"/>`;
    svg+=`<circle cx="${sunX}" cy="${sunY}" r="14" fill="${sunColor}" opacity="0.9"/>`;
  }

  // 远山
  svg+=`<path d="M0,${groundY-10} Q${w*0.15},${groundY-45} ${w*0.3},${groundY-15} Q${w*0.45},${groundY-35} ${w*0.6},${groundY-10} Q${w*0.75},${groundY-30} ${w},${groundY-12} L${w},${groundY} L0,${groundY} Z" fill="${groundColors[1]}" opacity="0.4"/>`;
  svg+=`<path d="M0,${groundY-5} Q${w*0.2},${groundY-25} ${w*0.4},${groundY-8} Q${w*0.6},${groundY-20} ${w*0.8},${groundY-5} Q${w*0.9},${groundY-15} ${w},${groundY-3} L${w},${groundY} L0,${groundY} Z" fill="${groundColors[1]}" opacity="0.6"/>`;

  // 云朵（白天）
  if(!isNight&&level>=2){
    const clouds=[[60,40,1],[250,30,0.8],[330,55,0.6]];
    clouds.forEach(c=>{
      svg+=`<g opacity="${c[2]*0.6}">`;
      svg+=`<ellipse cx="${c[0]}" cy="${c[1]}" rx="20" ry="8" fill="#FFF"/>`;
      svg+=`<ellipse cx="${c[0]+12}" cy="${c[1]+2}" rx="15" ry="7" fill="#FFF"/>`;
      svg+=`<ellipse cx="${c[0]-10}" cy="${c[1]+3}" rx="12" ry="5" fill="#FFF"/>`;
      svg+=`</g>`;
    });
  }

  // 草地
  svg+=`<ellipse cx="${cx}" cy="${groundY+5}" rx="${w*0.48}" ry="30" fill="url(#ground-grad)"/>`;
  // 小草
  if(level>=2){
    const grass=[[-80,3],[-50,-2],[-30,4],[30,-3],[50,2],[80,-2],[100,3],[-100,-1]];
    grass.forEach(g=>{
      const gx=cx+g[0],gy=groundY+g[1];
      svg+=`<path d="M${gx},${gy} Q${gx+2},${gy-8} ${gx+1},${gy-12} M${gx+3},${gy} Q${gx+4},${gy-6} ${gx+5},${gy-10}" stroke="${groundColors[0]}" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>`;
    });
  }

  // ===== 树的主体 =====
  if(level===1){
    // 种子——半埋在土中
    svg+=`<g class="trunk" filter="url(#soft-shadow)">
      <ellipse cx="${cx}" cy="${groundY-3}" rx="16" ry="11" fill="url(#trunk-grad)"/>
      <ellipse cx="${cx-3}" cy="${groundY-6}" rx="10" ry="6" fill="rgba(255,255,255,0.1)"/>
      <path d="M${cx-4},${groundY-2} Q${cx},${groundY-12} ${cx+4},${groundY-2}" stroke="#7FB069" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${groundY-14}" r="2" fill="#A8D88A"/>
    </g>`;
  }else if(level===2){
    // 嫩芽——两片子叶+茎
    svg+=`<g class="trunk" filter="url(#soft-shadow)">
      <path d="M${cx},${groundY} Q${cx-1},${groundY-25} ${cx},${groundY-40}" stroke="url(#trunk-grad)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="${cx-11}" cy="${groundY-35}" rx="13" ry="8" fill="url(#leaf-light)" transform="rotate(-35 ${cx-11} ${groundY-35})"/>
      <ellipse cx="${cx+11}" cy="${groundY-35}" rx="13" ry="8" fill="url(#leaf-light)" transform="rotate(35 ${cx+11} ${groundY-35})"/>
      <ellipse cx="${cx-11}" cy="${groundY-36}" rx="10" ry="5" fill="url(#leaf-highlight)" transform="rotate(-35 ${cx-11} ${groundY-36})"/>
      <ellipse cx="${cx+11}" cy="${groundY-36}" rx="10" ry="5" fill="url(#leaf-highlight)" transform="rotate(35 ${cx+11} ${groundY-36})"/>
      <circle cx="${cx}" cy="${groundY-42}" r="3" fill="#A8D88A"/>
    </g>`;
  }else if(level===3){
    // 小苗——有分枝
    svg+=`<g class="trunk" filter="url(#soft-shadow)">
      <path d="M${cx},${groundY} Q${cx-2},${groundY-50} ${cx},${groundY-80} Q${cx+2},${groundY-95} ${cx},${groundY-105}" stroke="url(#trunk-grad)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M${cx},${groundY-60} Q${cx-15},${groundY-65} ${cx-25},${groundY-72}" stroke="url(#trunk-grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M${cx},${groundY-65} Q${cx+15},${groundY-70} ${cx+25},${groundY-77}" stroke="url(#trunk-grad)" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>`;
    svg+=`<g class="leaf-cluster">`;
    const leafClusters3=[
      {x:cx-25,y:groundY-75,r:16,grad:"leaf-light",rot:-20},
      {x:cx+25,y:groundY-80,r:16,grad:"leaf-light",rot:20},
      {x:cx-12,y:groundY-95,r:14,grad:"leaf-dark",rot:-10},
      {x:cx+12,y:groundY-100,r:14,grad:"leaf-dark",rot:10},
      {x:cx,y:groundY-110,r:16,grad:"leaf-light",rot:0},
    ];
    leafClusters3.forEach(c=>{
      svg+=`<g transform="rotate(${c.rot} ${c.x} ${c.y})">
        <ellipse cx="${c.x}" cy="${c.y}" rx="${c.r}" ry="${c.r*0.7}" fill="url(#${c.grad})"/>
        <ellipse cx="${c.x-c.r*0.15}" cy="${c.y-c.r*0.15}" rx="${c.r*0.7}" ry="${c.r*0.45}" fill="url(#leaf-highlight)"/>
      </g>`;
    });
    svg+=`</g>`;
  }else{
    // 小树到古树（level 4-7）——真实树形
    const scale=0.55+(level-3)*0.13;
    const trunkH=140*scale;
    const trunkBaseW=14*scale;
    const trunkTopW=7*scale;
    const crownY=groundY-trunkH;
    const crownR=55*scale;

    svg+=`<g class="trunk">`;
    // 树干——锥形贝塞尔
    svg+=`<path d="M${cx-trunkBaseW},${groundY}
      Q${cx-trunkBaseW*0.8},${groundY-trunkH*0.4} ${cx-trunkTopW},${crownY+trunkH*0.1}
      L${cx+trunkTopW},${crownY+trunkH*0.1}
      Q${cx+trunkBaseW*0.8},${groundY-trunkH*0.4} ${cx+trunkBaseW},${groundY}
      Z" fill="url(#trunk-grad)" filter="url(#soft-shadow)"/>`;
    // 树皮纹理
    svg+=`<path d="M${cx-trunkBaseW*0.5},${groundY-5} Q${cx-trunkBaseW*0.3},${groundY-trunkH*0.3} ${cx-trunkTopW*0.5},${crownY+trunkH*0.15}" stroke="rgba(0,0,0,0.12)" stroke-width="1" fill="none"/>`;
    svg+=`<path d="M${cx+trunkBaseW*0.3},${groundY-8} Q${cx+trunkBaseW*0.2},${groundY-trunkH*0.35} ${cx+trunkTopW*0.3},${crownY+trunkH*0.12}" stroke="rgba(0,0,0,0.08)" stroke-width="0.8" fill="none"/>`;
    svg+=`<path d="M${cx},${groundY-10} L${cx},${crownY+trunkH*0.1}" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none"/>`;

    // 主分枝
    const branchW=4*scale;
    svg+=`<path d="M${cx},${crownY+trunkH*0.15} Q${cx-25*scale},${crownY} ${cx-45*scale},${crownY-8*scale}" stroke="url(#trunk-grad)" stroke-width="${branchW}" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx},${crownY+trunkH*0.15} Q${cx+25*scale},${crownY} ${cx+45*scale},${crownY-8*scale}" stroke="url(#trunk-grad)" stroke-width="${branchW}" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx},${crownY+trunkH*0.1} Q${cx-10*scale},${crownY-15*scale} ${cx-15*scale},${crownY-30*scale}" stroke="url(#trunk-grad)" stroke-width="${branchW*0.8}" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx},${crownY+trunkH*0.1} Q${cx+10*scale},${crownY-15*scale} ${cx+15*scale},${crownY-30*scale}" stroke="url(#trunk-grad)" stroke-width="${branchW*0.8}" fill="none" stroke-linecap="round"/>`;
    if(level>=5){
      svg+=`<path d="M${cx-40*scale},${crownY-5*scale} Q${cx-55*scale},${crownY-15*scale} ${cx-60*scale},${crownY-25*scale}" stroke="url(#trunk-grad)" stroke-width="${branchW*0.7}" fill="none" stroke-linecap="round"/>`;
      svg+=`<path d="M${cx+40*scale},${crownY-5*scale} Q${cx+55*scale},${crownY-15*scale} ${cx+60*scale},${crownY-25*scale}" stroke="url(#trunk-grad)" stroke-width="${branchW*0.7}" fill="none" stroke-linecap="round"/>`;
    }
    svg+=`</g>`;

    // 树冠——多层不规则叶簇
    svg+=`<g class="leaf-cluster">`;
    const clusters=[
      {x:cx,y:crownY,r:crownR,grad:"leaf-light"},
      {x:cx-crownR*0.65,y:crownY+crownR*0.25,r:crownR*0.72,grad:"leaf-dark"},
      {x:cx+crownR*0.65,y:crownY+crownR*0.25,r:crownR*0.72,grad:"leaf-light"},
      {x:cx-crownR*0.35,y:crownY-crownR*0.45,r:crownR*0.62,grad:"leaf-dark"},
      {x:cx+crownR*0.35,y:crownY-crownR*0.45,r:crownR*0.62,grad:"leaf-light"},
      {x:cx,y:crownY-crownR*0.65,r:crownR*0.58,grad:"leaf-dark"},
    ];
    if(level>=5){
      clusters.push({x:cx-crownR*1.05,y:crownY+crownR*0.05,r:crownR*0.52,grad:"leaf-dark"});
      clusters.push({x:cx+crownR*1.05,y:crownY+crownR*0.05,r:crownR*0.52,grad:"leaf-light"});
      clusters.push({x:cx-crownR*0.7,y:crownY-crownR*0.55,r:crownR*0.45,grad:"leaf-light"});
      clusters.push({x:cx+crownR*0.7,y:crownY-crownR*0.55,r:crownR*0.45,grad:"leaf-dark"});
    }
    if(level>=6){
      clusters.push({x:cx,y:crownY-crownR*0.9,r:crownR*0.42,grad:"leaf-light"});
      clusters.push({x:cx-crownR*1.2,y:crownY-crownR*0.2,r:crownR*0.38,grad:"leaf-light"});
      clusters.push({x:cx+crownR*1.2,y:crownY-crownR*0.2,r:crownR*0.38,grad:"leaf-dark"});
    }
    if(level>=7){
      clusters.push({x:cx-crownR*0.5,y:crownY+crownR*0.6,r:crownR*0.35,grad:"leaf-dark"});
      clusters.push({x:cx+crownR*0.5,y:crownY+crownR*0.6,r:crownR*0.35,grad:"leaf-light"});
      clusters.push({x:cx-crownR*1.3,y:crownY+crownR*0.3,r:crownR*0.3,grad:"leaf-dark"});
      clusters.push({x:cx+crownR*1.3,y:crownY+crownR*0.3,r:crownR*0.3,grad:"leaf-light"});
    }
    clusters.forEach((c,i)=>{
      // 不规则边缘的叶簇
      const bumps=6;
      let path=`M${c.x+c.r},${c.y}`;
      for(let b=0;b<bumps;b++){
        const ang=(b/bumps)*Math.PI*2;
        const ang2=((b+0.5)/bumps)*Math.PI*2;
        const r1=c.r*(0.88+0.12*((b+i)%3===0?1:0));
        const r2=c.r*(0.82+0.08*((b+i)%2));
        const x1=c.x+Math.cos(ang)*r1;
        const y1=c.y+Math.sin(ang)*r1;
        const x2=c.x+Math.cos(ang2)*r2;
        const y2=c.y+Math.sin(ang2)*r2;
        path+=` Q${(c.x+Math.cos(ang)*r1*1.1).toFixed(1)},${(c.y+Math.sin(ang)*r1*1.1).toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}`;
      }
      path+=` Z`;
      svg+=`<path class="leaf" d="${path}" fill="url(#${c.grad})" opacity="${0.88+0.12*(i%2)}"/>`;
      // 高光
      svg+=`<ellipse cx="${c.x-c.r*0.2}" cy="${c.y-c.r*0.25}" rx="${c.r*0.5}" ry="${c.r*0.35}" fill="url(#leaf-highlight)" opacity="${0.5+0.3*(i%2)}"/>`;
    });

    // 果实（level >= 4）
    if(level>=4){
      const fruits=[
        {x:cx-crownR*0.4,y:crownY+crownR*0.3,r:7*scale},
        {x:cx+crownR*0.5,y:crownY+crownR*0.1,r:6*scale},
        {x:cx-crownR*0.1,y:crownY+crownR*0.55,r:7*scale},
        {x:cx+crownR*0.2,y:crownY-crownR*0.2,r:6*scale},
      ];
      if(level>=5){fruits.push({x:cx-crownR*0.6,y:crownY-crownR*0.1,r:6*scale});fruits.push({x:cx+crownR*0.6,y:crownY+crownR*0.4,r:7*scale});}
      if(level>=6){fruits.push({x:cx-crownR*0.3,y:crownY-crownR*0.5,r:5*scale});fruits.push({x:cx+crownR*0.3,y:crownY-crownR*0.6,r:5*scale});}
      if(level>=7){fruits.push({x:cx,y:crownY-crownR*0.8,r:5*scale});}
      fruits.forEach(f=>{
        svg+=`<circle class="fruit" cx="${f.x}" cy="${f.y}" r="${f.r}" fill="url(#fruit-grad)"/>`;
        svg+=`<circle cx="${f.x-f.r*0.3}" cy="${f.y-f.r*0.3}" r="${f.r*0.35}" fill="url(#fruit-shine)"/>`;
      });
    }

    // 花朵（level >= 6）
    if(level>=6){
      const flowers=[
        {x:cx+crownR*0.7,y:crownY-crownR*0.3},
        {x:cx-crownR*0.8,y:crownY+crownR*0.15},
        {x:cx+crownR*0.1,y:crownY-crownR*0.7},
        {x:cx-crownR*0.5,y:crownY-crownR*0.3},
        {x:cx+crownR*0.4,y:crownY+crownR*0.5},
      ];
      if(level>=7){flowers.push({x:cx,y:crownY-crownR*0.95});flowers.push({x:cx-crownR*0.9,y:crownY-crownR*0.1});flowers.push({x:cx+crownR*0.9,y:crownY-crownR*0.1});}
      flowers.forEach(f=>{
        for(let p=0;p<5;p++){
          const ang=p*72*Math.PI/180-Math.PI/2;
          const px=f.x+Math.cos(ang)*6*scale;
          const py=f.y+Math.sin(ang)*6*scale;
          svg+=`<circle class="flower" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${4.5*scale}" fill="url(#flower-grad)" opacity="0.92"/>`;
        }
        svg+=`<circle cx="${f.x}" cy="${f.y}" r="${3*scale}" fill="#FFE060"/>`;
      });
    }

    // 星星和光芒（level 7）
    if(level>=7){
      svg+=`<g filter="url(#glow)">`;
      svg+=`<text x="${cx}" y="${crownY-crownR*1.05}" text-anchor="middle" font-size="22">🌟</text>`;
      svg+=`<text x="${cx-crownR*1.1}" y="${crownY-crownR*0.3}" text-anchor="middle" font-size="16">✨</text>`;
      svg+=`<text x="${cx+crownR*1.1}" y="${crownY-crownR*0.3}" text-anchor="middle" font-size="16">✨</text>`;
      svg+=`<text x="${cx-crownR*0.4}" y="${crownY+crownR*0.8}" text-anchor="middle" font-size="14">✨</text>`;
      svg+=`</g>`;
    }
    svg+=`</g>`;
  }

  // 根系（level >= 2）
  if(level>=2){
    svg+=`<g class="root" opacity="0.35">`;
    const rootSpread=level>=4?40:25;
    svg+=`<path d="M${cx-8},${groundY} Q${cx-15},${groundY+8} ${cx-rootSpread},${groundY+18}" stroke="#4A3A24" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx+8},${groundY} Q${cx+15},${groundY+8} ${cx+rootSpread},${groundY+18}" stroke="#4A3A24" stroke-width="2" fill="none" stroke-linecap="round"/>`;
    svg+=`<path d="M${cx},${groundY} L${cx},${groundY+22}" stroke="#4A3A24" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
    if(level>=4){
      svg+=`<path d="M${cx-18},${groundY+3} Q${cx-28},${groundY+12} ${cx-42},${groundY+15}" stroke="#4A3A24" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
      svg+=`<path d="M${cx+18},${groundY+3} Q${cx+28},${groundY+12} ${cx+42},${groundY+15}" stroke="#4A3A24" stroke-width="1.5" fill="none" stroke-linecap="round"/>`;
      svg+=`<path d="M${cx-10},${groundY+15} L${cx-20},${groundY+25}" stroke="#4A3A24" stroke-width="1" fill="none" stroke-linecap="round"/>`;
      svg+=`<path d="M${cx+10},${groundY+15} L${cx+20},${groundY+25}" stroke="#4A3A24" stroke-width="1" fill="none" stroke-linecap="round"/>`;
    }
    svg+=`</g>`;
  }

  // 飘浮粒子（养分/萤火虫）
  if(level>=3){
    const particleCount=isNight?8:5;
    const particleColor=isNight?"#FFE060":"#FFE5A0";
    for(let i=0;i<particleCount;i++){
      const px=cx+((i*37+13)%200-100);
      const py=groundY-80-((i*53+17)%120);
      svg+=`<circle class="particle" cx="${px}" cy="${py}" r="${isNight?2.5:2}" fill="${particleColor}" opacity="0" style="animation-delay:${i*0.5}s"/>`;
    }
  }

  svg+=`</svg>`;
  return svg;
}

/* 生命之树模块 */
function viewTree(){
  updateTreeData();
  const td=state.treeData;
  const lv=TREE_LEVELS[td.level-1]||TREE_LEVELS[0];
  const todayN=calcTreeNutrients();

  // 各分支养分
  const r=getDay(fmtDate(new Date()));
  const checkDn=CHECK_TPL.reduce((a,c)=>a+c.items.filter(it=>r.checks[c.cat+"-"+it]).length,0);
  const studyMin=(r.focusSessions||[]).reduce((s,f)=>s+Math.round((+(f.duration||0))/60),0);
  const exerciseRaw=r.health&&r.health.exercise;
  const exerciseMin=typeof exerciseRaw==="object"?(+(exerciseRaw&&exerciseRaw.minutes)||0):+(exerciseRaw||0);
  const medMin=(r.health&&r.health.meditation)?r.health.meditation.reduce((s,m)=>s+Math.round((+(m.duration||0))/60),0):0;
  const refls=state.reflections[fmtDate(new Date())]||[];
  const booksRead=state.books.filter(b=>b.status==="已读").length;

  const branches=[
    {icon:"🌱",name:"根系·打卡",val:checkDn,max:15,color:"var(--good)",unit:"项"},
    {icon:"📖",name:"学习枝",val:studyMin,max:120,color:"var(--warm)",unit:"分"},
    {icon:"💪",name:"健康枝",val:exerciseMin+medMin,max:60,color:"#5B9BD5",unit:"分"},
    {icon:"💭",name:"思考花",val:refls.length,max:5,color:"#9B7BC4",unit:"条"},
    {icon:"📚",name:"书叶",val:booksRead,max:30,color:"#7FB069",unit:"本"},
    {icon:"🎯",name:"果实",val:state.projects.filter(p=>p.status==="done").length,max:10,color:"#E89B5A",unit:"个"}
  ];

  const branchesHtml=branches.map(b=>{
    const pct=Math.min(100,Math.round(b.val/b.max*100));
    return `<div class="tree-branch-item">
      <span class="tbi-icon">${b.icon}</span>
      <div class="tbi-info">
        <div class="tbi-name">${b.name}</div>
        <div class="tbi-val">${b.val} ${b.unit}</div>
        <div class="tbi-bar"><div class="tbi-bar-fill" style="width:${pct}%;background:${b.color}"></div></div>
      </div>
    </div>`;
  }).join("");

  const nextLv=TREE_LEVELS[td.level]||null;
  const progress=nextLv?Math.round(((+td.nutrients||0)-lv.min)/(nextLv.min-lv.min)*100):100;
  const toNext=nextLv?nextLv.min-(+td.nutrients||0):0;

  return `<div class="card tree-page">
    <div class="section-eyebrow">TREE OF LIFE</div>
    <div class="section-title" style="font-size:18px;text-align:center">🌳 生命之树</div>
    <p class="section-desc" style="text-align:center">${lv.icon} ${lv.name} · ${lv.desc}</p>

    ${treeSVG(td.level,400)}

    <div class="tree-level-bar">
      <div class="tlb-head">
        <span>${lv.icon} Lv.${td.level} ${lv.name}</span>
        <span>${nextLv?'距下一级 '+toNext:'已满级 🌟'}</span>
      </div>
      <div class="tlb-track"><div class="tlb-fill" style="width:${progress}%"></div></div>
    </div>

    <div class="tree-info">
      <div class="tree-stat">
        <div class="ts-icon">💧</div>
        <div class="ts-num">${(+td.water||0).toFixed(0)}</div>
        <div class="ts-label">累计水分</div>
      </div>
      <div class="tree-stat">
        <div class="ts-icon">☀️</div>
        <div class="ts-num">${(+td.sunlight||0).toFixed(0)}</div>
        <div class="ts-label">累计阳光</div>
      </div>
      <div class="tree-stat">
        <div class="ts-icon">🌿</div>
        <div class="ts-num">${(+td.fertilizer||0).toFixed(0)}</div>
        <div class="ts-label">累计养分</div>
      </div>
      <div class="tree-stat">
        <div class="ts-icon">⭐</div>
        <div class="ts-num">${(+td.nutrients||0).toFixed(0)}</div>
        <div class="ts-label">总能量</div>
      </div>
    </div>

    <div class="tree-branches">
      ${branchesHtml}
    </div>

    <div style="margin-top:14px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6">
      💧 打卡/喝水 → 水分 · ☀️ 运动/睡眠 → 阳光 · 🌿 学习/思考 → 养分<br/>
      今日已获：${todayN.total} 能量（水${todayN.water}+光${todayN.sunlight}+肥${todayN.fertilizer}）
    </div>

    ${(()=>{ /* 同系列整合：今日打卡速览（成长可见系列） */
      const r=getDay(currentDate);
      const done=[];
      const pend=[];
      CHECK_TPL.forEach(c=>{
        c.items.forEach(it=>{
          const k=c.cat+"-"+it;
          if(r.checks[k]) done.push(c.icon+" "+it);
          else pend.push(c.icon+" "+it);
        });
      });
      const todayPomo=r.pomodoros||0;
      return `<div class="card" style="margin-top:14px;background:var(--card-soft);box-shadow:none">
        <div class="section-eyebrow">HABITS · 今日打卡（滋养生命树）</div>
        ${done.length?`<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
          ${done.map(d=>`<span style="font-size:12px;background:var(--good);color:#fff;padding:3px 10px;border-radius:999px">✓ ${esc(d)}</span>`).join("")}
        </div>`:'<div class="section-desc" style="margin:8px 0 0">今天还没有打卡，完成一项就能给树添能量。</div>'}
        ${pend.length?`<details style="margin-top:8px"><summary style="font-size:12px;color:var(--muted);cursor:pointer">未完成 ${pend.length} 项</summary>
          <div style="margin-top:6px;display:flex;flex-wrap:wrap;gap:6px">
            ${pend.map(d=>`<span style="font-size:12px;color:var(--muted);padding:3px 10px;border-radius:999px;border:1px solid var(--line)">${esc(d)}</span>`).join("")}
          </div></details>`:''}
        <div class="data-row" style="margin-top:10px">
          <button class="btn-ghost" data-nav="home">去打卡 →</button>
          <span style="font-size:12px;color:var(--muted);align-self:center">今日番茄 ${todayPomo} 个</span>
        </div>
      </div>`;
    })()}
  </div>`;
}

async function fetchCloudRemote(){

function fmtAgo(ts){if(!ts)return"";const s=Math.floor((Date.now()-ts)/1000);if(s<60)return s+"秒前";if(s<3600)return Math.floor(s/60)+"分钟前";if(s<86400)return Math.floor(s/3600)+"小时前";return Math.floor(s/86400)+"天前";}

/* ============== 密码保险柜（九宫格手势解锁 + AES-GCM 加密密钥） ============== */
/* 设计：
   - 手势密码的 SHA-256 哈希存 localStorage（vault_hash），仅作门控
   - 密钥列表用 AES-GCM 加密，密钥派生自手势 + 随机 salt（PBKDF2）
   - 忘记手势只能重置（清空所有密钥），无后门
*/
const VAULT_HASH_KEY="vault_hash", VAULT_SALT_KEY="vault_salt", VAULT_DATA_KEY="vault_data";
function vaultHasPassword(){try{return !!localStorage.getItem(VAULT_HASH_KEY);}catch(e){return false;}}
async function sha256(s){const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");}
async function vaultDeriveKey(gestureStr,salt){
  const keyMat=await crypto.subtle.importKey("raw",new TextEncoder().encode(gestureStr),{name:"PBKDF2"},false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},keyMat,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function vaultEncrypt(items,key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const data=new TextEncoder().encode(JSON.stringify(items));
  const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,data);
  const combined=new Uint8Array(iv.length+cipher.byteLength);
  combined.set(iv,0);combined.set(new Uint8Array(cipher),iv.length);
  return btoa(String.fromCharCode(...combined));
}
async function vaultDecrypt(b64,key){
  try{
    const combined=new Uint8Array(atob(b64).split("").map(c=>c.charCodeAt(0)));
    const iv=combined.slice(0,12);const cipher=combined.slice(12);
    const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,cipher);
    return JSON.parse(new TextDecoder().decode(plain));
  }catch(e){return null;}
}
/* 九宫格手势交互：3×3 点位，pointerdown/move 连线采集，松开返回点序号数组（如 [0,1,2,5]） */
function vaultShowGesture(title,hint,onDone,opts){
  opts=opts||{};
  const ov=document.getElementById("vaultGesture");
  document.getElementById("vgTitle").textContent=title;
  const hintEl=document.getElementById("vgHint");hintEl.textContent=hint;
  const grid=document.getElementById("vgGrid");
  grid.innerHTML="";
  const dots=[];
  for(let i=0;i<9;i++){const d=document.createElement("div");d.className="vault-dot";d.dataset.i=i;grid.appendChild(d);dots.push(d);}
  // canvas 画连线
  let canvas=grid.querySelector(".vault-canvas");
  if(!canvas){canvas=document.createElement("canvas");canvas.className="vault-canvas";grid.appendChild(canvas);}
  function fitCanvas(){const r=grid.getBoundingClientRect();canvas.width=r.width;canvas.height=r.height;canvas.style.width=r.width+"px";canvas.style.height=r.height+"px";}
  fitCanvas();
  const ctx=canvas.getContext("2d");
  let path=[],drawing=false,pts=[];
  function dotCenter(i){const r=dots[i].getBoundingClientRect();const gr=grid.getBoundingClientRect();return {x:r.left-gr.left+r.width/2,y:r.top-gr.top+r.height/2};}
  function redraw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(pts.length<1)return;ctx.strokeStyle="#d99a4e";ctx.lineWidth=3;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();pts.forEach((p,idx)=>{if(idx===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);});ctx.stroke();}
  function hitTest(x,y){const gr=grid.getBoundingClientRect();for(let i=0;i<9;i++){if(path.includes(i))continue;const c=dotCenter(i);const dx=x-gr.left-c.x,dy=y-gr.top-c.y;if(dx*dx+dy*dy<28*28){return i;}}return -1;}
  function onDown(e){e.preventDefault();drawing=true;path=[];pts=[];dots.forEach(d=>d.classList.remove("hit","error"));const p=pointerXY(e);const i=hitTest(p.x,p.y);if(i>=0){path.push(i);pts.push(dotCenter(i));dots[i].classList.add("hit");}redraw();}
  function onMove(e){if(!drawing)return;e.preventDefault();const p=pointerXY(e);const i=hitTest(p.x,p.y);if(i>=0){path.push(i);pts.push(dotCenter(i));dots[i].classList.add("hit");}pts.push({x:p.x-grid.getBoundingClientRect().left,y:p.y-grid.getBoundingClientRect().top});redraw();}
  function onUp(e){if(!drawing)return;drawing=false;redraw();if(path.length>=4){onDone(path.slice());}else{dots.forEach(d=>d.classList.add("error"));hintEl.textContent="至少连接 4 个点，请重画";setTimeout(()=>{dots.forEach(d=>d.classList.remove("error"));hintEl.textContent=hint;},800);}}
  function pointerXY(e){if(e.touches&&e.touches[0])return {x:e.touches[0].clientX,y:e.touches[0].clientY};return {x:e.clientX,y:e.clientY};}
  grid.onpointerdown=onDown;grid.onpointermove=onMove;grid.onpointerup=onUp;grid.onpointerleave=onUp;grid.onpointercancel=onUp;
  ov.classList.remove("hidden");
  // 取消按钮
  document.getElementById("vgCancel").onclick=()=>{ov.classList.add("hidden");if(opts.onCancel)opts.onCancel();};
}
function vaultCloseGesture(){document.getElementById("vaultGesture").classList.add("hidden");}
/* 首次设置手势：画两遍确认 */
function vaultSetupGesture(){
  let first=null;
  vaultShowGesture("🔐 设置手势密码","请画出解锁手势（至少 4 个点）",async(path)=>{
    if(!first){first=path;vaultShowGesture("🔐 确认手势密码","再画一遍确认",async(p2)=>{if(arrEq(first,p2)){await vaultSavePassword(first);vaultCloseGesture();vaultRender();toast("手势密码已设置");}else{vaultShowGesture("🔐 设置手势密码","两次不一致，请重新画第一遍",async(p3)=>{first=p3;vaultShowGesture("🔐 确认手势密码","再画一遍确认",async(p4)=>{if(arrEq(first,p4)){await vaultSavePassword(first);vaultCloseGesture();vaultRender();toast("手势密码已设置");}else{vaultCloseGesture();toast("两次不一致，请重试");}});});hintEl.textContent="两次不一致，请重新画";}});}else{vaultCloseGesture();}
  });
  function arrEq(a,b){return a&&b&&a.length===b.length&&a.every((x,i)=>x===b[i]);}
}
async function vaultSavePassword(gestureArr){
  const gestureStr=gestureArr.join("-");
  const hash=await sha256(gestureStr+"|life-vault-salt-v1");
  const salt=crypto.getRandomValues(new Uint8Array(16));
  localStorage.setItem(VAULT_HASH_KEY,hash);
  localStorage.setItem(VAULT_SALT_KEY,btoa(String.fromCharCode(...salt)));
  // 初始化空密钥列表（加密空数组）
  const key=await vaultDeriveKey(gestureStr,salt);
  const enc=await vaultEncrypt([],key);
  localStorage.setItem(VAULT_DATA_KEY,enc);
}
/* 解锁：画手势 → 校验哈希 → 解密密钥列表 */
function vaultUnlock(){
  vaultShowGesture("🔐 解锁保险柜","请画出你的解锁手势",async(path)=>{
    const gestureStr=path.join("-");
    const hash=await sha256(gestureStr+"|life-vault-salt-v1");
    const stored=localStorage.getItem(VAULT_HASH_KEY);
    if(hash!==stored){
      const hintEl=document.getElementById("vgHint");
      document.querySelectorAll("#vgGrid .vault-dot").forEach(d=>d.classList.add("error"));
      hintEl.textContent="手势错误，请重画";
      setTimeout(()=>{document.querySelectorAll("#vgGrid .vault-dot").forEach(d=>d.classList.remove("error"));hintEl.textContent="请画出你的解锁手势";},900);
      return;
    }
    // 解密密钥列表
    const saltB64=localStorage.getItem(VAULT_SALT_KEY);
    const salt=new Uint8Array(atob(saltB64).split("").map(c=>c.charCodeAt(0)));
    const key=await vaultDeriveKey(gestureStr,salt);
    window.__vaultKey=key; // 供 vaultPersist 重新加密用
    const items=await vaultDecrypt(localStorage.getItem(VAULT_DATA_KEY),key);
    vaultCloseGesture();
    vaultRenderItems(items||[]);
  });
}
/* 渲染保险柜主界面 */
function vaultRender(){
  const body=document.getElementById("vaultBody");
  if(!vaultHasPassword()){

/* 解锁后：显示密钥列表，可添加/删除/复制 */
function vaultRenderItems(items){
  const body=document.getElementById("vaultBody");
  // 保存当前 items 供增删后重渲染（不解密态下保留内存副本）
  window.__vaultItems=items;

async function vaultPersist(items){
